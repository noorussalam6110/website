<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Quiz Login Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 50px auto; padding: 20px; background: #0f3b2c; color: white; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; font-size: 16px; }
        button { background: #fbbf24; color: black; font-weight: bold; cursor: pointer; }
        #error { color: #f87171; margin-top: 10px; }
        #result { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; margin-top: 15px; }
    </style>
</head>
<body>
    <h1>🔑 Login Test</h1>
    <input type="text" id="studentId" placeholder="Enter Student ID (e.g. admin)" />
    <button id="loginBtn">Login</button>
    <div id="error"></div>
    <div id="result"></div>

    <script>
        // ✅ നിങ്ങളുടെ Supabase വിവരങ്ങൾ
        const SUPABASE_URL = "https://iaaazjetelndkroignrd.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_7BNVf0qnhk8xlpGh0Vts5w_viVZ1kpc";

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('loginBtn').addEventListener('click', async function() {
            const studentId = document.getElementById('studentId').value.trim();
            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');
            
            errorDiv.innerText = '';
            resultDiv.innerText = '⏳ Checking...';

            if (!studentId) {
                errorDiv.innerText = 'Please enter a Student ID';
                resultDiv.innerText = '';
                return;
            }

            try {
                // 1. Check if Student exists
                const { data: student, error } = await supabase
                    .from('Student')
                    .select('*')
                    .eq('studentId', studentId)
                    .single();

                if (error) {
                    errorDiv.innerText = '❌ Error: ' + error.message;
                    resultDiv.innerText = '';
                    return;
                }

                if (!student) {
                    errorDiv.innerText = '❌ Student not found!';
                    resultDiv.innerText = '';
                    return;
                }

                resultDiv.innerHTML = `
                    ✅ <strong>Login Successful!</strong><br>
                    Name: ${student.name}<br>
                    ID: ${student.studentId}<br>
                    Role: ${student.role || 'student'}<br>
                    Parent: ${student.parentName || 'Not set'}
                `;
                errorDiv.innerText = '';

            } catch (err) {
                errorDiv.innerText = '❌ ' + err.message;
                resultDiv.innerText = '';
            }
        });
    </script>
</body>
</html>
