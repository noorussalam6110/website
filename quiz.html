<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Daily Meelad Quiz - Full Solution</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #0a2e1f, #1a5e44);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            max-width: 720px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 44px;
            padding: 30px 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            color: #fff;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 30px;
            font-weight: 800;
            background: linear-gradient(to right, #fcd34d, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            color: #a7f3d0;
            font-size: 14px;
            margin-top: 4px;
        }
        .card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            font-weight: 600;
            color: #d1fae5;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.25s;
        }
        .input-group input:focus {
            border-color: #fbbf24;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.15);
        }
        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            background: #fbbf24;
            color: #0f172a;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 18px rgba(251, 191, 36, 0.25);
        }
        .btn:hover {
            transform: scale(1.01);
            background: #fcd34d;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-success {
            background: #10b981;
            color: #fff;
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.25);
        }
        .btn-success:hover {
            background: #059669;
        }
        .hidden {
            display: none !important;
        }

        /* Messages */
        .msg-error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 12px;
            font-weight: 500;
            text-align: center;
        }
        .msg-success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 12px;
            font-weight: 500;
            text-align: center;
        }
        .msg-info {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 12px;
            font-weight: 500;
            text-align: center;
        }

        /* Dashboard */
        .welcome-banner {
            background: rgba(251, 191, 36, 0.1);
            border: 1px dashed rgba(251, 191, 36, 0.3);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            color: #fde68a;
            margin-bottom: 20px;
        }
        .welcome-banner strong {
            color: #fbbf24;
            font-weight: 700;
        }

        .quiz-timer {
            font-size: 48px;
            font-weight: 800;
            text-align: center;
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.35);
            padding: 12px;
            border-radius: 60px;
            margin-bottom: 20px;
            color: #fbbf24;
            letter-spacing: 2px;
        }
        .quiz-timer.warning {
            color: #f87171;
        }

        .status-box {
            text-align: center;
            padding: 40px 20px;
        }
        .status-box .icon {
            font-size: 56px;
            margin-bottom: 14px;
        }
        .status-box h2 {
            font-size: 22px;
            margin-bottom: 8px;
        }
        .status-box p {
            color: #cbd5e1;
            font-size: 15px;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 16px;
            border-left: 4px solid #fbbf24;
        }
        .question-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 14px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        @media (max-width: 500px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }
        .opt-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 12px 16px;
            border-radius: 12px;
            color: #e2e8f0;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            transition: 0.2s;
        }
        .opt-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .opt-btn.selected {
            background: #fbbf24;
            color: #0f172a;
            font-weight: 700;
            border-color: #fbbf24;
        }
        .opt-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .mt-16 {
            margin-top: 16px;
        }
        .mt-24 {
            margin-top: 24px;
        }
        .text-center {
            text-align: center;
        }

        /* Parent Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-box {
            background: #1e293b;
            padding: 32px;
            border-radius: 32px;
            max-width: 420px;
            width: 92%;
            border: 1px solid #fbbf24;
        }
        .modal-box h2 {
            color: #fbbf24;
            font-size: 24px;
            margin-bottom: 6px;
        }
        .modal-box p {
            color: #94a3b8;
            margin-bottom: 16px;
        }
        .modal-box input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
            margin-bottom: 16px;
            outline: none;
        }
        .modal-box input:focus {
            border-color: #fbbf24;
        }

        .debug-log {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 12px;
            margin-top: 16px;
            font-family: monospace;
            font-size: 12px;
            color: #94a3b8;
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .debug-log .log-error {
            color: #f87171;
        }
        .debug-log .log-success {
            color: #34d399;
        }
        .debug-log .log-info {
            color: #60a5fa;
        }
    </style>
</head>
<body>

    <div class="container" id="app">

        <!-- HEADER -->
        <div class="header">
            <h1>🌟 Daily Meelad Quiz</h1>
            <p>നൂറുസ്സലാം മദ്‌റസ SKSBV യൂണിറ്റ്</p>
        </div>

        <!-- ========== LOGIN SCREEN ========== -->
        <div id="loginScreen">
            <div class="card">
                <div class="input-group">
                    <label>👤 Student ID</label>
                    <input type="text" id="studentIdInput" placeholder="ഉദാ: admin" autofocus />
                </div>
                <button class="btn" id="loginBtn">🔑 Login / പ്രവേശിക്കുക</button>
                <div id="loginMessage"></div>
                <!-- Debug Log -->
                <div class="debug-log" id="debugLog"></div>
            </div>
        </div>

        <!-- ========== DASHBOARD ========== -->
        <div id="dashboardScreen" class="hidden">

            <!-- Welcome -->
            <div class="welcome-banner" id="welcomeBanner">
                👋 സ്വാഗതം, <strong id="userNameDisplay">...</strong>
            </div>

            <!-- Timer -->
            <div id="timerArea" class="hidden">
                <div class="quiz-timer" id="timerDisplay">15:00</div>
            </div>

            <!-- Status -->
            <div id="statusArea">
                <div class="status-box" id="waitingMsg">
                    <div class="icon">⏳</div>
                    <h2>മത്സരത്തിന് ഇതുവരെ സമയമായിട്ടില്ല</h2>
                    <p id="waitingTimeText">ദയവായി കാത്തിരിക്കുക...</p>
                </div>
                <div class="status-box hidden" id="endedMsg">
                    <div class="icon">🚫</div>
                    <h2>ഇന്നത്തെ മത്സരം അവസാനിച്ചു</h2>
                    <p>നാളെ വീണ്ടും വരൂ!</p>
                </div>
            </div>

            <!-- Start Button -->
            <div id="startArea" class="hidden text-center mt-24">
                <button class="btn" id="startQuizBtn" style="max-width:320px;margin:0 auto;">🚀 ക്വിസ് ആരംഭിക്കുക</button>
            </div>

            <!-- Questions -->
            <div id="questionsArea" class="hidden">
                <div id="questionsContainer"></div>
                <button class="btn btn-success mt-24" id="submitQuizBtn">📤 ഉത്തരങ്ങൾ സമർപ്പിക്കുക</button>
            </div>

            <!-- Submitted -->
            <div id="submittedArea" class="hidden">
                <div class="status-box">
                    <div class="icon">✅</div>
                    <h2>നന്ദി!</h2>
                    <p>നിങ്ങളുടെ ഉത്തരങ്ങൾ വിജയകരമായി രേഖപ്പെടുത്തി.</p>
                    <p style="color:#fbbf24;font-size:26px;font-weight:800;margin-top:8px;" id="scoreDisplay"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== PARENT NAME MODAL ========== -->
    <div id="parentModal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2>👪 രക്ഷിതാവിന്റെ പേര്</h2>
            <p>Day 1-ൽ മാത്രം ഒരു തവണ</p>
            <input type="text" id="parentNameInput" placeholder="ഉദാ: അബ്ദുറഹ്മാൻ" />
            <button class="btn" id="saveParentBtn">✅ സേവ് ചെയ്യുക</button>
        </div>
    </div>

    <script>
        // ================================================================
        //  🧩  SUPABASE CONFIG  (നിങ്ങളുടെ വിവരങ്ങൾ ഇവിടെയുണ്ട്)
        // ================================================================
        const SUPABASE_URL = "https://iaaazjetelndkroignrd.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_7BNVf0qnhk8xlpGh0Vts5w_viVZ1kpc";

        // ================================================================
        //  🧩  INIT
        // ================================================================
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ---------- DOM REFS ----------
        const $ = id => document.getElementById(id);
        const loginScreen = $('loginScreen');
        const dashboardScreen = $('dashboardScreen');
        const studentIdInput = $('studentIdInput');
        const loginBtn = $('loginBtn');
        const loginMessage = $('loginMessage');
        const debugLog = $('debugLog');
        const userNameDisplay = $('userNameDisplay');
        const timerArea = $('timerArea');
        const timerDisplay = $('timerDisplay');
        const waitingMsg = $('waitingMsg');
        const waitingTimeText = $('waitingTimeText');
        const endedMsg = $('endedMsg');
        const startArea = $('startArea');
        const startQuizBtn = $('startQuizBtn');
        const questionsArea = $('questionsArea');
        const questionsContainer = $('questionsContainer');
        const submitQuizBtn = $('submitQuizBtn');
        const submittedArea = $('submittedArea');
        const scoreDisplay = $('scoreDisplay');
        const parentModal = $('parentModal');
        const parentNameInput = $('parentNameInput');
        const saveParentBtn = $('saveParentBtn');

        // ---------- STATE ----------
        let currentUser = null;
        let currentSession = null;
        let currentAttemptId = null;
        let questions = [];
        let answers = {};
        let timerInterval = null;
        let timeLeft = 0;
        let isSubmitted = false;

        // ---------- DEBUG LOGGER ----------
        function log(msg, type = 'info') {
            const entry = document.createElement('div');
            entry.className = 'log-' + type;
            entry.textContent = '🟢 ' + new Date().toLocaleTimeString() + ' → ' + msg;
            debugLog.appendChild(entry);
            debugLog.scrollTop = debugLog.scrollHeight;
            console.log(msg);
        }

        function showMessage(msg, type = 'error') {
            loginMessage.innerHTML = '';
            const div = document.createElement('div');
            div.className = type === 'error' ? 'msg-error' : (type === 'success' ? 'msg-success' : 'msg-info');
            div.textContent = msg;
            loginMessage.appendChild(div);
        }

        // ---------- SCREEN HELPERS ----------
        function showScreen(screen) {
            loginScreen.classList.add('hidden');
            dashboardScreen.classList.add('hidden');
            if (screen === 'login') loginScreen.classList.remove('hidden');
            else if (screen === 'dashboard') dashboardScreen.classList.remove('hidden');
        }

        function formatDate(d) {
            if (!d) return '';
            return new Date(d).toLocaleString('ml-IN', { timeZone: 'Asia/Kolkata' });
        }

        // ================================================================
        //  🔐  LOGIN
        // ================================================================
        loginBtn.addEventListener('click', async function() {
            const studentId = studentIdInput.value.trim();
            loginMessage.innerHTML = '';
            log('🔍 Login attempt for: ' + studentId);

            if (!studentId) {
                showMessage('Student ID നൽകുക.', 'error');
                log('❌ Empty student ID', 'error');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = '⏳ ...';

            try {
                // 1. Get student
                log('📡 Fetching student from Supabase...');
                const { data: student, error } = await supabase
                    .from('Student')
                    .select('*')
                    .eq('studentId', studentId)
                    .single();

                if (error) {
                    log('❌ Supabase error: ' + JSON.stringify(error), 'error');
                    if (error.code === 'PGRST116') {
                        throw new Error('Student ID കണ്ടെത്താനായില്ല. ശരിയായ ID നൽകുക.');
                    }
                    throw new Error(error.message);
                }

                if (!student) {
                    throw new Error('Student ID കണ്ടെത്താനായില്ല.');
                }

                currentUser = student;
                log('✅ Student found: ' + student.name + ' (' + student.studentId + ')', 'success');

                // 2. Check daily login
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const tomorrow = new Date(today);
                tomorrow.setDate(tomorrow.getDate() + 1);

                log('📡 Checking daily login for today...');
                const { data: existing, error: lErr } = await supabase
                    .from('LoginTrack')
                    .select('id')
                    .eq('studentId', student.id)
                    .gte('loginDate', today.toISOString())
                    .lt('loginDate', tomorrow.toISOString())
                    .maybeSingle();

                if (existing) {
                    log('❌ Already logged in today', 'error');
                    throw new Error('ഇന്ന് നിങ്ങൾ ഇതിനകം ലോഗിൻ ചെയ്തു. നാളെ വീണ്ടും ശ്രമിക്കുക.');
                }

                // 3. Get current session
                log('📡 Fetching quiz sessions...');
                const { data: sessions, error: sessErr } = await supabase
                    .from('QuizSession')
                    .select('*')
                    .order('day', { ascending: true });

                if (sessErr || !sessions || sessions.length === 0) {
                    log('❌ No sessions found: ' + JSON.stringify(sessErr), 'error');
                    throw new Error('Quiz sessions ലഭ്യമല്ല. അഡ്മിനെ ബന്ധപ്പെടുക.');
                }

                log('📦 Found ' + sessions.length + ' sessions', 'success');

                const now = new Date();
                let activeSession = null;
                for (const s of sessions) {
                    const start = new Date(s.startTime);
                    const end = new Date(s.endTime);
                    if (now >= start && now <= end) {
                        activeSession = s;
                        break;
                    }
                }
                if (!activeSession) {
                    for (const s of sessions) {
                        if (new Date(s.startTime) > now) {
                            activeSession = s;
                            break;
                        }
                    }
                    if (!activeSession) activeSession = sessions[sessions.length - 1];
                }

                const day = activeSession?.day || 1;
                currentSession = activeSession;
                log('📅 Current day: ' + day + ', Session: ' + (activeSession ? 'Active' : 'Inactive'), 'info');

                // 4. Create LoginTrack
                log('📡 Creating login track...');
                await supabase.from('LoginTrack').insert({
                    studentId: student.id,
                    day: day
                });
                log('✅ Login track created', 'success');

                // 5. Parent modal (Day 1 only)
                if (day === 1 && !student.parentName) {
                    log('👪 Day 1 - Parent name required', 'info');
                    parentModal.classList.remove('hidden');
                }

                showMessage('✅ Login വിജയകരം!', 'success');
                log('✅ Login complete!', 'success');

                showScreen('dashboard');
                renderDashboard();

            } catch (err) {
                log('❌ Login error: ' + err.message, 'error');
                showMessage(err.message, 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '🔑 Login / പ്രവേശിക്കുക';
            }
        });

        // Enter key support
        studentIdInput.addEventListener('keydown', e => { if (e.key === 'Enter') loginBtn.click(); });

        // ================================================================
        //  👪  PARENT NAME
        // ================================================================
        saveParentBtn.addEventListener('click', async function() {
            const name = parentNameInput.value.trim();
            if (!name) return alert('ദയവായി പേര് നൽകുക.');
            if (!currentUser) return;

            log('👪 Saving parent name: ' + name);
            await supabase
                .from('Student')
                .update({ parentName: name })
                .eq('id', currentUser.id);

            currentUser.parentName = name;
            parentModal.classList.add('hidden');
            log('✅ Parent name saved', 'success');
            renderDashboard();
        });

        parentNameInput.addEventListener('keydown', e => { if (e.key === 'Enter') saveParentBtn.click(); });

        // ================================================================
        //  📊  RENDER DASHBOARD
        // ================================================================
        async function renderDashboard() {
            if (!currentUser || !currentSession) {
                log('❌ Cannot render: missing user or session', 'error');
                return;
            }

            userNameDisplay.textContent = currentUser.parentName || currentUser.name;
            log('📊 Rendering dashboard for: ' + currentUser.name);

            const now = new Date();
            const start = new Date(currentSession.startTime);
            const end = new Date(currentSession.endTime);

            // Hide all
            waitingMsg.classList.add('hidden');
            endedMsg.classList.add('hidden');
            startArea.classList.add('hidden');
            questionsArea.classList.add('hidden');
            timerArea.classList.add('hidden');
            submittedArea.classList.add('hidden');

            if (now < start) {
                log('⏳ Waiting: Session starts at ' + currentSession.startTime, 'info');
                waitingMsg.classList.remove('hidden');
                waitingTimeText.textContent = `ദയവായി ${formatDate(currentSession.startTime)} വരെ കാത്തിരിക്കുക.`;
                return;
            } else if (now > end) {
                log('🚫 Session ended at ' + currentSession.endTime, 'info');
                endedMsg.classList.remove('hidden');
                return;
            }

            log('✅ Session is active!', 'success');

            // Check existing attempt
            const { data: attempt } = await supabase
                .from('Attempt')
                .select('id, status, score')
                .eq('studentId', currentUser.id)
                .eq('sessionDay', currentSession.day)
                .maybeSingle();

            if (attempt && (attempt.status === 'COMPLETED' || attempt.status === 'TIMED_OUT')) {
                log('📊 Already submitted: ' + attempt.status, 'info');
                submittedArea.classList.remove('hidden');
                const totalQ = questions.length || '?';
                scoreDisplay.textContent = `നിങ്ങളുടെ സ്കോർ: ${attempt.score ?? 0} / ${totalQ}`;
                return;
            }

            if (attempt) {
                currentAttemptId = attempt.id;
                log('🔄 Resuming attempt: ' + attempt.id, 'info');
            }

            // Load questions
            log('📡 Fetching questions for day ' + currentSession.day);
            const { data: qs, error: qErr } = await supabase
                .from('Question')
                .select('*')
                .eq('sessionDay', currentSession.day)
                .order('id', { ascending: true });

            if (qErr || !qs || qs.length === 0) {
                log('❌ No questions found: ' + JSON.stringify(qErr), 'error');
                alert('ചോദ്യങ്ങൾ ലഭ്യമല്ല. അഡ്മിനെ ബന്ധപ്പെടുക.');
                return;
            }

            questions = qs;
            answers = {};
            log('📦 Loaded ' + questions.length + ' questions', 'success');

            if (!attempt) {
                log('🟢 Showing start button');
                startArea.classList.remove('hidden');
                startQuizBtn.onclick = startQuiz;
            } else {
                log('🔄 Auto-starting quiz (resume)');
                startQuiz(true);
            }
        }

        // ================================================================
        //  🚀  START QUIZ
        // ================================================================
        async function startQuiz(resume = false) {
            log('🎯 Starting quiz, resume=' + resume);
            try {
                if (!resume) {
                    const { data: att, error: aErr } = await supabase
                        .from('Attempt')
                        .insert({
                            studentId: currentUser.id,
                            sessionDay: currentSession.day,
                            status: 'STARTED'
                        })
                        .select()
                        .single();

                    if (aErr) {
                        log('❌ Attempt create error: ' + aErr.message, 'error');
                        throw new Error('Attempt create failed: ' + aErr.message);
                    }
                    currentAttemptId = att.id;
                    log('✅ Attempt created: ' + currentAttemptId, 'success');
                }

                startArea.classList.add('hidden');
                questionsArea.classList.remove('hidden');
                timerArea.classList.remove('hidden');
                renderQuestions();

                const durationSecs = currentSession.duration * 60;
                timeLeft = durationSecs;
                updateTimerDisplay();

                clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        log('⏰ Timer expired! Auto-submitting...', 'error');
                        alert('⏰ സമയം തീർന്നു. യാന്ത്രികമായി സമർപ്പിക്കുന്നു...');
                        submitQuiz(true);
                    }
                }, 1000);

                log('⏱️ Timer started: ' + durationSecs + 's', 'success');

            } catch (err) {
                log('❌ Start quiz error: ' + err.message, 'error');
                alert('Error: ' + err.message);
            }
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            if (timeLeft < 60) timerDisplay.classList.add('warning');
            else timerDisplay.classList.remove('warning');
        }

        // ================================================================
        //  📝  RENDER QUESTIONS
        // ================================================================
        function renderQuestions() {
            questionsContainer.innerHTML = '';
            questions.forEach((q, idx) => {
                const div = document.createElement('div');
                div.className = 'question-card';
                div.innerHTML = `
                    <div class="question-title">${idx + 1}. ${q.questionText}</div>
                    <div class="options-grid" id="options-${q.id}">
                        ${q.options.map((opt, oi) => `
                            <button class="opt-btn" data-qid="${q.id}" data-optidx="${oi}" ${isSubmitted ? 'disabled' : ''}>
                                ${String.fromCharCode(65 + oi)}. ${opt}
                            </button>
                        `).join('')}
                    </div>
                `;
                questionsContainer.appendChild(div);

                div.querySelectorAll('.opt-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        if (isSubmitted) return;
                        const qid = this.dataset.qid;
                        const optIdx = parseInt(this.dataset.optidx);
                        const parent = this.closest('.options-grid');
                        parent.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
                        this.classList.add('selected');
                        answers[qid] = optIdx;
                        log(`📝 Q${idx+1}: Option ${String.fromCharCode(65 + optIdx)} selected`);
                    });
                });
            });

            submitQuizBtn.onclick = () => {
                if (Object.keys(answers).length === 0) {
                    return alert('ഒരു ഉത്തരവും തിരഞ്ഞെടുത്തിട്ടില്ല.');
                }
                if (confirm('നിങ്ങളുടെ ഉത്തരങ്ങൾ സേവ് ചെയ്യണോ? (ശേഷം മാറ്റാനാവില്ല)')) {
                    submitQuiz(false);
                }
            };
            log('✅ Questions rendered', 'success');
        }

        // ================================================================
        //  📤  SUBMIT QUIZ
        // ================================================================
        async function submitQuiz(isTimeout = false) {
            if (isSubmitted) return;
            isSubmitted = true;
            clearInterval(timerInterval);
            submitQuizBtn.disabled = true;

            log('📤 Submitting quiz, timeout=' + isTimeout);

            try {
                let score = 0;
                const answerEntries = [];
                for (const q of questions) {
                    const selected = answers[q.id];
                    if (selected !== undefined) {
                        if (selected === q.correctAnswer) score++;
                        answerEntries.push({
                            attemptId: currentAttemptId,
                            questionId: q.id,
                            selectedOpt: selected
                        });
                    }
                }

                if (answerEntries.length > 0) {
                    log('📡 Saving ' + answerEntries.length + ' answers...');
                    await supabase.from('Answer').insert(answerEntries);
                }

                const status = isTimeout ? 'TIMED_OUT' : 'COMPLETED';
                await supabase
                    .from('Attempt')
                    .update({
                        endTime: new Date().toISOString(),
                        score: score,
                        status: status
                    })
                    .eq('id', currentAttemptId);

                log('✅ Score: ' + score + '/' + questions.length, 'success');

                questionsArea.classList.add('hidden');
                timerArea.classList.add('hidden');
                submittedArea.classList.remove('hidden');
                scoreDisplay.textContent = `നിങ്ങളുടെ സ്കോർ: ${score} / ${questions.length}`;

            } catch (err) {
                log('❌ Submit error: ' + err.message, 'error');
                alert('Submit error: ' + err.message);
                isSubmitted = false;
                submitQuizBtn.disabled = false;
            }
        }

        // ================================================================
        //  🏁  INIT
        // ================================================================
        showScreen('login');
        log('🚀 Quiz App Full Solution Ready!', 'success');
        log('🔑 URL: ' + SUPABASE_URL, 'info');
        log('💡 Try logging in with "admin"', 'info');
    </script>

</body>
</html>
