<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SKSBV Member Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sksbv-config.js"></script>
<style>
:root{--primary:#8b5cf6;--primary-dark:#6d28d9;--accent:#ec4899;--bg:#f8fafc;--card:#ffffff;--text:#0f172a;--dim:#64748b;--border:rgba(100,116,139,.15)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Anek Malayalam',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#loadingScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:linear-gradient(135deg,#8b5cf6,#ec4899);padding:24px;text-align:center;color:#fff}
.loader{width:56px;height:56px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.app-header{background:linear-gradient(135deg,#4c1d95,#8b5cf6);color:#fff;padding:16px 20px;padding-top:calc(16px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px -8px rgba(76,29,149,.4);border-bottom-left-radius:24px;border-bottom-right-radius:24px}
.app-header-left{display:flex;align-items:center;gap:12px}
.app-avatar{width:48px;height:48px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.2rem;border:2px solid rgba(255,255,255,.5)}
.app-avatar img{width:100%;height:100%;object-fit:cover}
.app-header h1{font-size:1.05rem;font-weight:900;margin:0;line-height:1.2}
.app-header small{font-size:.7rem;opacity:.9;display:block;margin-top:2px}
.header-btn{background:rgba(255,255,255,.2);border:none;color:#fff;width:44px;height:44px;border-radius:14px;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
.main-content{padding:16px;max-width:900px;margin:0 auto;padding-bottom:100px}
.literary-hero{position:relative;border-radius:24px;overflow:hidden;background:linear-gradient(135deg,#2e1065,#6d28d9);padding:24px 20px;color:#fff;margin-bottom:20px;box-shadow:0 15px 30px -10px rgba(109,40,217,.5)}
.literary-hero h2{position:relative;font-size:1.5rem;font-weight:900;margin:0 0 8px;line-height:1.2;z-index:2}
.literary-hero p{position:relative;font-size:.85rem;color:rgba(255,255,255,.85);margin:0 0 16px;z-index:2}
.lit-btn{position:relative;background:#fff;color:#4c1d95;border:none;padding:12px 24px;border-radius:30px;font-weight:900;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 8px 20px -5px rgba(0,0,0,.3);z-index:2;transition:transform .2s}
.lit-btn:active{transform:scale(.95)}
.card{background:var(--card);border-radius:20px;padding:20px;border:1px solid var(--border);box-shadow:0 4px 15px -10px rgba(0,0,0,.1);margin-bottom:16px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-header h3{font-size:1rem;font-weight:900;margin:0;display:flex;align-items:center;gap:8px;color:var(--text)}
.card-header h3 i{color:var(--primary)}
.badge{background:rgba(139,92,246,.1);color:var(--primary);padding:4px 12px;border-radius:20px;font-size:.68rem;font-weight:900;border:none;cursor:pointer}
.program-card{background:#fff;border-radius:20px;padding:20px;border:1px solid var(--border);box-shadow:0 4px 15px -10px rgba(0,0,0,.1);margin-bottom:16px;border-top:4px solid var(--primary)}
.program-card.is-open{border-top-color:#10b981}
.program-card.is-closed{border-top-color:#94a3b8;opacity:.92}
.program-card.is-upcoming{border-top-color:#f59e0b}
.prog-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.prog-head h3{font-size:1.15rem;font-weight:900;margin:0 0 4px;color:var(--text);line-height:1.25}
.prog-theme{display:inline-block;background:rgba(139,92,246,.1);color:#6d28d9;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:800}
.prog-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--dim);font-weight:700;margin-bottom:12px}
.prog-meta span{display:inline-flex;align-items:center;gap:5px}
.prog-meta i{color:var(--primary)}
.reg-window{padding:10px 14px;border-radius:12px;font-size:.78rem;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.reg-window.open{background:rgba(16,185,129,.1);color:#059669;border:1px solid rgba(16,185,129,.25)}
.reg-window.closed{background:rgba(148,163,184,.12);color:#64748b;border:1px solid rgba(148,163,184,.3)}
.reg-window.upcoming{background:rgba(245,158,11,.1);color:#b45309;border:1px solid rgba(245,158,11,.3)}
.prog-desc{font-size:.85rem;color:#475569;line-height:1.65;margin:0 0 14px;padding:12px;background:#f8fafc;border-radius:10px;white-space:pre-wrap;word-break:break-word}
.cat-section-label{font-size:.78rem;font-weight:900;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 10px;display:flex;align-items:center;gap:6px}
.cat-section-label i{color:var(--primary)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.cat-chip{background:#fff;border:2px solid rgba(139,92,246,.25);border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;font-family:inherit;font-weight:800;font-size:.82rem;color:var(--text);transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.cat-chip:hover:not(.disabled):not(.registered){border-color:var(--primary);background:rgba(139,92,246,.04);transform:translateY(-2px);box-shadow:0 8px 20px -10px rgba(139,92,246,.5)}
.cat-chip:active:not(.disabled):not(.registered){transform:scale(.97)}
.cat-chip .cat-ico{font-size:1.6rem;line-height:1}
.cat-chip .cat-label{font-size:.82rem}
.cat-chip .cat-hint{font-size:.6rem;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.cat-chip.disabled{background:#f8fafc;border-color:#e2e8f0;color:#94a3b8;cursor:not-allowed;opacity:.7}
.cat-chip.registered{cursor:default;border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.05)}
.cat-chip.registered .cat-status{position:absolute;top:6px;right:8px;font-size:.6rem;font-weight:900;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.5px}
.cat-chip.registered.pending .cat-status{background:rgba(245,158,11,.2);color:#b45309}
.cat-chip.registered.approved .cat-status{background:rgba(16,185,129,.2);color:#059669}
.cat-chip.registered.rejected .cat-status{background:rgba(220,38,38,.15);color:#dc2626}
.cat-chip.registered.rejected{border-color:rgba(220,38,38,.3);background:rgba(220,38,38,.03)}
.cancel-reg{background:none;border:none;color:#dc2626;font-family:inherit;font-size:.68rem;font-weight:800;cursor:pointer;padding:4px 8px;border-radius:8px;margin-top:4px;text-decoration:underline}
.cancel-reg:active{opacity:.6}
.my-regs-summary{background:#f0fdf4;border:1px solid rgba(16,185,129,.25);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:.78rem;font-weight:700;color:#047857}
.my-regs-summary i{margin-right:6px}
.notif-item{padding:10px 12px;border-left:3px solid #8b5cf6;background:#f8fafc;border-radius:8px;margin-bottom:8px}
.notif-title{font-weight:900;font-size:.84rem;color:#0f172a}
.notif-msg{font-size:.76rem;color:#475569;margin-top:3px;line-height:1.55}
.notif-date{font-size:.66rem;color:#94a3b8;margin-top:4px;font-weight:700}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.85);backdrop-filter:blur(10px);z-index:2000;display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal-card{background:#fff;border-radius:24px;padding:24px;max-width:440px;width:100%;margin:auto;box-shadow:0 40px 80px -20px rgba(0,0,0,.5);animation:slideUp .3s cubic-bezier(.34,1.4,.64,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-header h3{margin:0;font-size:1.1rem;font-weight:900;color:#0f172a}
.close-btn{background:#f1f5f9;border:none;width:36px;height:36px;border-radius:50%;font-size:1rem;cursor:pointer;color:#475569}
.reg-cat-preview{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#f3e8ff,#fce7f3);padding:16px;border-radius:14px;margin-bottom:16px}
.reg-cat-preview .cat-ico{font-size:2rem}
.reg-cat-preview .cat-name{font-weight:900;font-size:1rem;color:#6d28d9}
.reg-cat-preview .cat-sub{font-size:.72rem;color:var(--dim);font-weight:700;margin-top:2px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:.8rem;font-weight:800;color:#475569;margin-bottom:6px}
.form-label .opt{font-size:.68rem;color:#94a3b8;font-weight:700}
.form-input{width:100%;padding:12px 16px;border:1.5px solid rgba(100,116,139,.25);border-radius:12px;font-family:inherit;font-size:16px;outline:none;transition:.2s;background:#fff}
.form-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(139,92,246,.15)}
.btn-submit{width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(100deg,#8b5cf6,#ec4899);color:#fff;font-family:inherit;font-weight:900;font-size:.95rem;cursor:pointer;margin-top:4px;box-shadow:0 10px 25px -10px rgba(139,92,246,.7);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-submit:disabled{opacity:.5;cursor:not-allowed}
.btn-cancel-modal{width:100%;padding:12px;border-radius:12px;border:none;background:#f1f5f9;color:#475569;font-family:inherit;font-weight:800;font-size:.85rem;cursor:pointer;margin-top:8px}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(100px);background:#0f172a;color:#fff;padding:13px 24px;border-radius:14px;font-weight:800;font-size:.85rem;z-index:3000;box-shadow:0 20px 50px -12px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:10px;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:linear-gradient(135deg,#059669,#10b981)}
.toast.error{background:linear-gradient(135deg,#dc2626,#ef4444)}
.toast.info{background:linear-gradient(135deg,#3b82f6,#60a5fa)}
.action-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.action-tile{background:#fff;border-radius:16px;padding:14px 8px;text-align:center;cursor:pointer;border:1px solid var(--border);transition:all .2s}
.action-tile:active{transform:scale(.95)}
.action-ico{width:48px;height:48px;border-radius:14px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:#fff}
.action-tile h6{font-size:.68rem;font-weight:800;color:var(--dim);margin:0;line-height:1.2}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 0;padding-bottom:max(10px,env(safe-area-inset-bottom,10px));z-index:1000}
.bn-item{background:transparent;border:none;color:var(--dim);font-family:inherit;font-weight:800;font-size:.65rem;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.2s;flex:1}
.bn-item i{font-size:1.25rem}
.bn-item.active{color:var(--primary)}
.bn-item.active i{color:var(--primary)}
.c-purple{background:linear-gradient(135deg,#a855f7,#8b5cf6)}
.c-pink{background:linear-gradient(135deg,#ec4899,#f472b6)}
.c-blue{background:linear-gradient(135deg,#3b82f6,#60a5fa)}
.c-green{background:linear-gradient(135deg,#10b981,#34d399)}
.empty{text-align:center;padding:30px 20px;color:var(--dim);font-size:.85rem}
.empty i{font-size:2.5rem;opacity:.3;margin-bottom:10px;display:block}
.program-item{background:#f8fafc;border:1.5px solid rgba(139,92,246,.2);border-radius:14px;padding:14px;margin-bottom:10px;border-left:4px solid var(--primary)}
.program-title{font-weight:900;color:var(--text);font-size:.92rem;margin-bottom:4px}
.program-theme{font-size:.74rem;color:var(--primary-dark);font-weight:800;margin-bottom:6px}
.program-meta{font-size:.7rem;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap;font-weight:700}
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="loader"></div>
  <h2>Loading SKSBV...</h2>
</div>

<div id="appScreen" style="display:none;">
  <header class="app-header">
    <div class="app-header-left">
      <div class="app-avatar" id="hdAvatar">S</div>
      <div>
        <h1 id="hdName">Loading...</h1>
        <small id="hdMeta">SKSBV Member</small>
        <small id="hdTeam" style="display:none;margin-top:2px;"></small>
      </div>
    </div>
    <button class="header-btn" onclick="window.location.href='sksbv-home.html'"><i class="fas fa-home"></i></button>
  </header>
  <main class="main-content" id="mainContent"></main>
  <nav class="bottom-nav">
    <button class="bn-item active" data-tab="home" onclick="switchTab('home')"><i class="fas fa-home"></i>Home</button>
    <button class="bn-item" data-tab="literary" onclick="switchTab('literary')"><i class="fas fa-feather" style="color:#8b5cf6;"></i>Literary</button>
    <button class="bn-item" data-tab="events" onclick="switchTab('events')"><i class="fas fa-calendar"></i>Events</button>
    <button class="bn-item" data-tab="profile" onclick="switchTab('profile')"><i class="fas fa-user"></i>Profile</button>
  </nav>
</div>

<div class="modal-overlay" id="regModal" onclick="if(event.target===this)closeRegModal()">
  <div class="modal-card">
    <div class="modal-header">
      <h3><i class="fas fa-feather" style="color:#8b5cf6;"></i> രജിസ്ട്രേഷൻ</h3>
      <button class="close-btn" onclick="closeRegModal()">✕</button>
    </div>
    <div class="reg-cat-preview">
      <div class="cat-ico" id="regCatIcon">🎵</div>
      <div>
        <div class="cat-name" id="regCatName">—</div>
        <div class="cat-sub" id="regProgName">—</div>
      </div>
    </div>
    <form id="regForm" onsubmit="submitQuickReg(event)">
      <input type="hidden" id="regProgramId">
      <input type="hidden" id="regCategoryKey">
      <input type="hidden" id="regCategoryLabel">
      <div class="form-group">
        <label class="form-label">ഇനത്തിന്റെ പേര് <span class="opt">(ഓപ്ഷണൽ)</span></label>
        <input type="text" id="regItemTitle" class="form-input" placeholder="ഉദാ: എന്റെ ഗ്രാമം" maxlength="120" autocomplete="off">
      </div>
      <button type="submit" class="btn-submit" id="regSubmitBtn">
        <i class="fas fa-check-circle"></i> രജിസ്റ്റർ ചെയ്യുക
      </button>
      <button type="button" class="btn-cancel-modal" onclick="closeRegModal()">റദ്ദാക്കുക</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>

<script>
const CFG = window.SKSBV_CONFIG || {
  SUPABASE_URL: 'https://dmjjtmimrozzqknduqas.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_e7EXyQvriYYgw9KDlu-5dA_Jcjdw9bg'
};
const supabaseClient = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
let CURRENT_MEMBER = null;
let LITERARY_PROGRAMS = [];
let MY_REGISTRATIONS = [];
let MY_NOTIFICATIONS = [];

const CATEGORIES = [
  {key:'song',   label:'ഗാനം',    icon:'🎵'},
  {key:'speech', label:'പ്രസംഗം',  icon:'🎤'},
  {key:'poem',   label:'കവിത',    icon:'📝'},
  {key:'story',  label:'കഥ',      icon:'📖'},
  {key:'essay',  label:'ലേഖനം',   icon:'✍️'},
  {key:'quran',  label:'ഖുർആൻ',   icon:'🕌'},
  {key:'other',  label:'മറ്റുള്ളവ', icon:'🌟'}
];

function esc(s){ return s==null?'':String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtDate(d){ if(!d) return '—'; try{ const dt=new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return d; } }

function getSession(){
  try { return JSON.parse(localStorage.getItem('noor_session')); } catch(e){ return null; }
}

function showToast(msg, type='success'){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.className = 'toast ' + type + ' show';
  clearTimeout(window._toastT);
  window._toastT = setTimeout(()=>t.classList.remove('show'), 2800);
}

/* ✅ FIXED: consistent date logic with admin panel */
function getRegWindow(program){
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const start = program.registration_start
    ? new Date(String(program.registration_start).slice(0,10) + 'T00:00:00') : null;
  const end   = program.registration_end
    ? new Date(String(program.registration_end).slice(0,10)   + 'T23:59:59') : null;

  if (!start && !end){
    return { status:'open', open:true, cls:'open', label:'<i class="fas fa-circle-check"></i> രജിസ്ട്രേഷൻ തുറന്നിരിക്കുന്നു' };
  }
  if (start && todayStart < start){
    return { status:'upcoming', open:false, cls:'upcoming', label:'<i class="fas fa-clock"></i> രജിസ്ട്രേഷൻ തുറക്കുന്നത്: ' + fmtDate(start) };
  }
  if (end && new Date() > end){
    return { status:'closed', open:false, cls:'closed', label:'<i class="fas fa-lock"></i> രജിസ്ട്രേഷൻ അടച്ചു (' + fmtDate(end) + ')' };
  }
  const endMsg = end ? ' • അവസാന തീയതി: ' + fmtDate(end) : '';
  return { status:'open', open:true, cls:'open', label:'<i class="fas fa-circle-check"></i> രജിസ്ട്രേഷൻ തുറന്നിരിക്കുന്നു' + endMsg };
}

let MY_TEAM = null;

async function loadMyTeam(){
  try {
    const mr = await supabaseClient
      .from('sksbv_members')
      .select('team')
      .eq('member_id', CURRENT_MEMBER.member_id)
      .maybeSingle();
    
    if (!mr.data || !mr.data.team) {
      MY_TEAM = null;
      return;
    }
    
    const tr = await supabaseClient
      .from('sksbv_teams')
      .select('*')
      .eq('team_key', mr.data.team)
      .maybeSingle();
    
    MY_TEAM = {
      key: mr.data.team,
      name: (tr.data && tr.data.team_name) || mr.data.team,
      color: (tr.data && tr.data.color) || '#8b5cf6',
      description: (tr.data && tr.data.description) || ''
    };
  } catch(e){
    console.warn('loadMyTeam:', e);
    MY_TEAM = null;
  }
}

async function boot(){
  const student = getSession();
  if (!student || !student.studentId){
    window.location.href = 'index.html'; return;
  }
  CURRENT_MEMBER = {
    member_id: student.studentId,
    name: student.name,
    class: student.class,
    photo: student.photo
  };
  document.getElementById('hdName').textContent = CURRENT_MEMBER.name || 'Student';
  
  // Load team info
  await loadMyTeam();
  
  // Header meta
  let metaHTML = 'Class ' + (CURRENT_MEMBER.class || '—');
  if (MY_TEAM){
    metaHTML += ' • <span style="color:' + MY_TEAM.color + ';font-weight:900;">🎨 ' + esc(MY_TEAM.name) + '</span>';
  }
  document.getElementById('hdMeta').innerHTML = metaHTML;
  
  // Team badge below
  const teamEl = document.getElementById('hdTeam');
  if (teamEl){
    if (MY_TEAM){
      teamEl.style.display = 'block';
      teamEl.innerHTML = '<span style="background:' + MY_TEAM.color + ';color:#fff;padding:2px 10px;border-radius:20px;font-weight:900;font-size:.6rem;letter-spacing:.5px;">' + esc(MY_TEAM.name) + '</span>';
    } else {
      teamEl.style.display = 'none';
    }
  }
  
  const av = document.getElementById('hdAvatar');
  if (CURRENT_MEMBER.photo) av.innerHTML = `<img src="${esc(CURRENT_MEMBER.photo)}">`;
  else av.textContent = (CURRENT_MEMBER.name || 'S').charAt(0).toUpperCase();

  await loadLiteraryData();

  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  switchTab('home');
}

/* ✅ FIXED: load notifications too */
async function loadLiteraryData(){
  try {
    const [pRes, rRes, nRes] = await Promise.all([
      supabaseClient.from('sksbv_programs').select('*')
        .in('status', ['upcoming','active'])
        .order('program_date', {ascending:true}),
      supabaseClient.from('sksbv_program_registrations').select('*')
        .eq('member_id', CURRENT_MEMBER.member_id)
        .order('created_at', {ascending:false}),
      supabaseClient.from('sksbv_notifications').select('*')
        .eq('target_member', CURRENT_MEMBER.member_id)
        .order('created_at', {ascending:false})
        .limit(15)
    ]);
    LITERARY_PROGRAMS = pRes.data || [];
    MY_REGISTRATIONS = rRes.data || [];
    MY_NOTIFICATIONS = nRes.data || [];
  } catch(e){
    console.error('loadLiteraryData:', e);
    LITERARY_PROGRAMS = [];
    MY_REGISTRATIONS = [];
    MY_NOTIFICATIONS = [];
  }
}

async function switchTab(tab){
  document.querySelectorAll('.bn-item').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  const el = document.getElementById('mainContent');
  el.innerHTML = '<div style="text-align:center;padding:40px;"><div class="loader" style="margin:0 auto;width:32px;height:32px;border-color:rgba(139,92,246,.2);border-top-color:#8b5cf6;"></div></div>';
  if (tab === 'literary' || tab === 'home'){
    await loadLiteraryData();
  }
  if (tab === 'home') renderHome(el);
  else if (tab === 'literary') renderLiterary(el);
  else if (tab === 'events') renderEvents(el);
  else if (tab === 'profile') renderProfile(el);
}

function renderLiterary(el){
  if (!LITERARY_PROGRAMS.length){
    el.innerHTML = `
      <div class="card" style="background:linear-gradient(135deg,#4c1d95,#8b5cf6);color:#fff;border:none;margin-bottom:20px;">
        <h2 style="font-size:1.3rem;font-weight:900;margin-bottom:6px;"><i class="fas fa-feather"></i> സാഹിത്യ സമാജം</h2>
        <p style="font-size:.85rem;opacity:.9;">പ്രോഗ്രാമുകളിൽ പങ്കെടുത്ത് കഴിവ് തെളിയിക്കൂ</p>
      </div>
      <div class="card"><div class="empty"><i class="fas fa-feather"></i>ഇപ്പോൾ പ്രോഗ്രാമുകൾ ഇല്ല</div></div>
    `;
    return;
  }

  const regsByProgram = {};
  MY_REGISTRATIONS.forEach(r => {
    const pid = String(r.program_id);
    if (!regsByProgram[pid]) regsByProgram[pid] = [];
    regsByProgram[pid].push(r);
  });

  let html = `
    <div class="card" style="background:linear-gradient(135deg,#4c1d95,#8b5cf6);color:#fff;border:none;margin-bottom:20px;">
      <h2 style="font-size:1.3rem;font-weight:900;margin-bottom:6px;"><i class="fas fa-feather"></i> സാഹിത്യ സമാജം</h2>
      <p style="font-size:.85rem;opacity:.9;">ഇഷ്ടമുള്ള ഇനത്തിൽ ടാപ്പ് ചെയ്ത് രജിസ്റ്റർ ചെയ്യൂ ✨</p>
    </div>
  `;

  LITERARY_PROGRAMS.forEach(p => {
    const rw = getRegWindow(p);
    const pid = String(p.id);
    const myRegs = regsByProgram[pid] || [];
    const regByCat = {};
    myRegs.forEach(r => { regByCat[r.item_type] = r; });
    const cardCls = rw.open ? 'is-open' : (rw.status === 'upcoming' ? 'is-upcoming' : 'is-closed');

    const chipsHtml = CATEGORIES.map(cat => {
      const myReg = regByCat[cat.key];
      if (myReg){
        const status = myReg.status || 'pending';
        const statusLabel = status === 'approved' ? '✅' : status === 'rejected' ? '❌' : '⏳';
        return `
          <div class="cat-chip registered ${status}">
            <span class="cat-status">${statusLabel} ${status}</span>
            <span class="cat-ico">${cat.icon}</span>
            <span class="cat-label">${esc(cat.label)}</span>
            ${status === 'pending' ? `<button class="cancel-reg" onclick="cancelMyReg(${myReg.id},'${esc(cat.label)}')">റദ്ദാക്കുക</button>` : ''}
            ${status === 'approved' ? `<span class="cat-hint" style="color:#059669;">അംഗീകരിച്ചു</span>` : ''}
            ${status === 'rejected' ? `<span class="cat-hint" style="color:#dc2626;">നിരസിച്ചു</span>` : ''}
          </div>
        `;
      }
      if (!rw.open){
        return `
          <div class="cat-chip disabled">
            <span class="cat-ico">${cat.icon}</span>
            <span class="cat-label">${esc(cat.label)}</span>
            <span class="cat-hint">അടച്ചു</span>
          </div>
        `;
      }
      return `
        <button class="cat-chip" onclick="openQuickReg(${p.id}, '${cat.key}', '${esc(cat.label)}', '${esc(cat.icon)}', '${esc(p.title).replace(/'/g,'\\\'')}')">
          <span class="cat-ico">${cat.icon}</span>
          <span class="cat-label">${esc(cat.label)}</span>
          <span class="cat-hint">ടാപ്പ് ചെയ്യൂ</span>
        </button>
      `;
    }).join('');

    const summaryHtml = myRegs.length > 0 ? `
      <div class="my-regs-summary">
        <i class="fas fa-check-circle"></i> നിങ്ങൾ ${myRegs.length} ഇനത്തിൽ രജിസ്റ്റർ ചെയ്തു
      </div>
    ` : '';

    html += `
      <div class="program-card ${cardCls}">
        <div class="prog-head">
          <div style="flex:1;min-width:0;">
            <h3>📚 ${esc(p.title)}</h3>
            ${p.theme ? `<span class="prog-theme">📖 ${esc(p.theme)}</span>` : ''}
          </div>
        </div>
        <div class="prog-meta">
          <span><i class="fas fa-calendar-day"></i> ${fmtDate(p.program_date)}</span>
          ${p.venue ? `<span><i class="fas fa-map-marker-alt"></i> ${esc(p.venue)}</span>` : ''}
        </div>
        <div class="reg-window ${rw.cls}">${rw.label}</div>
        ${p.description ? `<div class="prog-desc">${esc(p.description)}</div>` : ''}
        <div class="cat-section-label"><i class="fas fa-hand-pointer"></i> ഇനം തിരഞ്ഞെടുക്കുക</div>
        <div class="cat-grid">${chipsHtml}</div>
        ${summaryHtml}
      </div>
    `;
  });
  el.innerHTML = html;
}

function openQuickReg(programId, categoryKey, categoryLabel, categoryIcon, programTitle){
  document.getElementById('regProgramId').value = programId;
  document.getElementById('regCategoryKey').value = categoryKey;
  document.getElementById('regCategoryLabel').value = categoryLabel;
  document.getElementById('regCatIcon').textContent = categoryIcon;
  document.getElementById('regCatName').textContent = categoryLabel;
  document.getElementById('regProgName').textContent = programTitle;
  document.getElementById('regItemTitle').value = '';
  document.getElementById('regModal').classList.add('open');
  setTimeout(()=>document.getElementById('regItemTitle').focus(), 200);
}

function closeRegModal(){ document.getElementById('regModal').classList.remove('open'); }

async function submitQuickReg(e){
  e.preventDefault();
  const programId = document.getElementById('regProgramId').value;
  const categoryKey = document.getElementById('regCategoryKey').value;
  const categoryLabel = document.getElementById('regCategoryLabel').value;
  const customTitle = document.getElementById('regItemTitle').value.trim();
  if (!programId || !categoryKey){ showToast('വിവരങ്ങൾ കണ്ടെത്തിയില്ല', 'error'); return; }
  const btn = document.getElementById('regSubmitBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> സമർപ്പിക്കുന്നു...';
  try {
    const { error } = await supabaseClient.from('sksbv_program_registrations').insert({
      program_id: parseInt(programId),
      member_id: CURRENT_MEMBER.member_id,
      member_name: CURRENT_MEMBER.name,
      member_class: CURRENT_MEMBER.class,
      item_type: categoryKey,
      item_title: customTitle || categoryLabel,
      item_description: null,
      status: 'pending'
    });
    if (error) throw error;
    closeRegModal();
    showToast('✅ ' + categoryLabel + ' രജിസ്റ്റർ ചെയ്തു!');
    await loadLiteraryData();
    switchTab('literary');
  } catch(err){
    showToast('❌ ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-check-circle"></i> രജിസ്റ്റർ ചെയ്യുക';
  }
}

async function cancelMyReg(regId, label){
  if (!confirm(label + ' രജിസ്ട്രേഷൻ റദ്ദാക്കണോ?')) return;
  try {
    const { error } = await supabaseClient
      .from('sksbv_program_registrations')
      .delete()
      .eq('id', regId)
      .eq('status', 'pending');
    if (error) throw error;
    showToast('റദ്ദാക്കി');
    await loadLiteraryData();
    switchTab('literary');
  } catch(e){
    showToast('❌ ' + e.message, 'error');
  }
}
