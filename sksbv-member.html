<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SKSBV Member Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sksbv-config.js"></script>
<style>
:root{
  --primary:#8b5cf6; --primary-dark:#6d28d9; --accent:#ec4899;
  --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --dim:#64748b;
  --border:rgba(100,116,139,.15);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Anek Malayalam',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

#loadingScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:linear-gradient(135deg,#8b5cf6,#ec4899);padding:24px;text-align:center;color:#fff;}
.loader{width:56px;height:56px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

.app-header{background:linear-gradient(135deg,#4c1d95,#8b5cf6);color:#fff;padding:16px 20px;padding-top:calc(16px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px -8px rgba(76,29,149,.4);border-bottom-left-radius:24px;border-bottom-right-radius:24px;}
.app-header-left{display:flex;align-items:center;gap:12px;}
.app-avatar{width:48px;height:48px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.2rem;border:2px solid rgba(255,255,255,.5);}
.app-avatar img{width:100%;height:100%;object-fit:cover;}
.app-header h1{font-size:1.05rem;font-weight:900;margin:0;line-height:1.2;}
.app-header small{font-size:.7rem;opacity:.9;display:block;margin-top:2px;}
.header-btn{background:rgba(255,255,255,.2);border:none;color:#fff;width:44px;height:44px;border-radius:14px;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);}

.main-content{padding:16px;max-width:900px;margin:0 auto;padding-bottom:100px;}

.literary-hero{position:relative;border-radius:24px;overflow:hidden;background:linear-gradient(135deg,#2e1065,#6d28d9);padding:24px 20px;color:#fff;margin-bottom:20px;box-shadow:0 15px 30px -10px rgba(109,40,217,.5);}
.literary-hero h2{position:relative;font-size:1.5rem;font-weight:900;margin:0 0 8px;line-height:1.2;z-index:2;}
.literary-hero p{position:relative;font-size:.85rem;color:rgba(255,255,255,.85);margin:0 0 16px;z-index:2;}
.lit-btn{position:relative;background:#fff;color:#4c1d95;border:none;padding:12px 24px;border-radius:30px;font-weight:900;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 8px 20px -5px rgba(0,0,0,.3);z-index:2;transition:transform .2s;}
.lit-btn:active{transform:scale(.95);}

.card{background:var(--card);border-radius:20px;padding:20px;border:1px solid var(--border);box-shadow:0 4px 15px -10px rgba(0,0,0,.1);margin-bottom:16px;}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.card-header h3{font-size:1rem;font-weight:900;margin:0;display:flex;align-items:center;gap:8px;color:var(--text);}
.card-header h3 i{color:var(--primary);}
.badge{background:rgba(139,92,246,.1);color:var(--primary);padding:4px 12px;border-radius:20px;font-size:.68rem;font-weight:900;border:none;cursor:pointer;}

.program-item{background:#f8fafc;border:1.5px solid rgba(139,92,246,.2);border-radius:14px;padding:14px;margin-bottom:10px;border-left:4px solid var(--primary);}
.program-title{font-weight:900;color:var(--text);font-size:.92rem;margin-bottom:4px;}
.program-theme{font-size:.74rem;color:var(--primary-dark);font-weight:800;margin-bottom:6px;}
.program-meta{font-size:.7rem;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap;font-weight:700;}

.action-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.action-tile{background:#fff;border-radius:16px;padding:14px 8px;text-align:center;cursor:pointer;border:1px solid var(--border);transition:all .2s;}
.action-tile:active{transform:scale(.95);}
.action-ico{width:48px;height:48px;border-radius:14px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:#fff;}
.action-tile h6{font-size:.68rem;font-weight:800;color:var(--dim);margin:0;line-height:1.2;}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 0;padding-bottom:max(10px,env(safe-area-inset-bottom,10px));z-index:1000;}
.bn-item{background:transparent;border:none;color:var(--dim);font-family:inherit;font-weight:800;font-size:.65rem;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.2s;flex:1;}
.bn-item i{font-size:1.25rem;}
.bn-item.active{color:var(--primary);}
.bn-item.active i{color:var(--primary);}

.c-purple{background:linear-gradient(135deg,#a855f7,#8b5cf6);}
.c-pink{background:linear-gradient(135deg,#ec4899,#f472b6);}
.c-blue{background:linear-gradient(135deg,#3b82f6,#60a5fa);}
.c-green{background:linear-gradient(135deg,#10b981,#34d399);}

.empty{text-align:center;padding:30px 20px;color:var(--dim);font-size:.85rem;}
.empty i{font-size:2.5rem;opacity:.3;margin-bottom:10px;display:block;}

/* ═══ MODAL (Registration) ═══ */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.85);backdrop-filter:blur(10px);z-index:2000;display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto;}
.modal-overlay.open{display:flex;}
.modal-card{background:#fff;border-radius:24px;padding:24px;max-width:480px;width:100%;margin:auto;box-shadow:0 40px 80px -20px rgba(0,0,0,.5);animation:slideUp .3s cubic-bezier(.34,1.4,.64,1);}
@keyframes slideUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.modal-header h3{margin:0;font-size:1.15rem;font-weight:900;color:#0f172a;}
.close-btn{background:#f1f5f9;border:none;width:36px;height:36px;border-radius:50%;font-size:1rem;cursor:pointer;color:#475569;}
.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:.8rem;font-weight:800;color:#475569;margin-bottom:6px;}
.form-input{width:100%;padding:12px 16px;border:1.5px solid rgba(100,116,139,.25);border-radius:12px;font-family:inherit;font-size:16px;outline:none;transition:.2s;}
.form-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(139,92,246,.15);}
textarea.form-input{min-height:80px;resize:vertical;}
.btn-submit{width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(100deg,#8b5cf6,#ec4899);color:#fff;font-family:inherit;font-weight:900;font-size:.95rem;cursor:pointer;margin-top:10px;box-shadow:0 10px 25px -10px rgba(139,92,246,.7);}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;}
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="loader"></div>
  <h2>Loading SKSBV...</h2>
</div>

<div id="appScreen" style="display:none;">
  <header class="app-header">
    <div class="app-header-left">
      <div class="app-avatar" id="hdAvatar">S</div>
      <div>
        <h1 id="hdName">Loading...</h1>
        <small id="hdMeta">SKSBV Member</small>
      </div>
    </div>
    <button class="header-btn" onclick="window.location.href='sksbv-home.html'"><i class="fas fa-home"></i></button>
  </header>

  <main class="main-content" id="mainContent"></main>

  <nav class="bottom-nav">
    <button class="bn-item active" onclick="switchTab('home')"><i class="fas fa-home"></i>Home</button>
    <button class="bn-item" onclick="switchTab('literary')"><i class="fas fa-feather" style="color:#8b5cf6;"></i>Literary</button>
    <button class="bn-item" onclick="switchTab('events')"><i class="fas fa-calendar"></i>Events</button>
    <button class="bn-item" onclick="switchTab('profile')"><i class="fas fa-user"></i>Profile</button>
  </nav>
</div>

<!-- REGISTRATION MODAL -->
<div class="modal-overlay" id="regModal" onclick="if(event.target===this)closeModal()">
  <div class="modal-card">
    <div class="modal-header">
      <h3><i class="fas fa-feather" style="color:#8b5cf6;"></i> രജിസ്ട്രേഷൻ</h3>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <form id="regForm" onsubmit="submitRegistration(event)">
      <div class="form-group">
        <label class="form-label">പരിപാടി</label>
        <input type="text" id="regProgramTitle" class="form-input" readonly style="background:#f1f5f9;font-weight:800;color:#8b5cf6;">
        <input type="hidden" id="regProgramId">
      </div>
      
      <div class="form-group">
        <label class="form-label">ഇനം തിരഞ്ഞെടുക്കുക *</label>
        <select id="regItemType" class="form-input" required>
          <option value="">-- തിരഞ്ഞെടുക്കുക --</option>
          <option value="song">🎵 ഗാനം (Song)</option>
          <option value="speech">🎤 പ്രസംഗം (Speech)</option>
          <option value="poem">📝 കവിത (Poem)</option>
          <option value="story">📖 കഥ (Story)</option>
          <option value="essay">✍️ ലേഖനം (Essay)</option>
          <option value="quran">📖 ഖുർആൻ പാരായണം</option>
          <option value="other">🌟 മറ്റുള്ളവ</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">ഇനത്തിന്റെ പേര് *</label>
        <input type="text" id="regItemTitle" class="form-input" placeholder="ഉദാ: എന്റെ ഗ്രാമം" required maxlength="100">
      </div>

      <div class="form-group">
        <label class="form-label">ചെറിയ വിവരണം (Optional)</label>
        <textarea id="regItemDesc" class="form-input" placeholder="കൂടുതൽ വിവരങ്ങൾ..." maxlength="300"></textarea>
      </div>

      <button type="submit" class="btn-submit" id="regSubmitBtn">
        <i class="fas fa-paper-plane"></i> സമർപ്പിക്കുക
      </button>
    </form>
  </div>
</div>

<script>
const CFG = window.SKSBV_CONFIG || {
  SUPABASE_URL: 'https://dmjjtmimrozzqknduqas.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_e7EXyQvriYYgw9KDlu-5dA_Jcjdw9bg'
};
const supabaseClient = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
let CURRENT_MEMBER = null;
let LITERARY_PROGRAMS = [];
let MY_REGISTRATIONS = [];

function esc(s){ return s==null?'':String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function getSession(){
  try { return JSON.parse(localStorage.getItem('noor_session')); } catch(e){ return null; }
}

async function boot(){
  const student = getSession();
  if (!student || !student.studentId) {
    window.location.href = 'index.html'; return;
  }

  CURRENT_MEMBER = {
    member_id: student.studentId, name: student.name, class: student.class, photo: student.photo
  };

  document.getElementById('hdName').textContent = CURRENT_MEMBER.name || 'Student';
  document.getElementById('hdMeta').textContent = 'Class ' + (CURRENT_MEMBER.class || '—');
  const av = document.getElementById('hdAvatar');
  if (CURRENT_MEMBER.photo) av.innerHTML = `<img src="${esc(CURRENT_MEMBER.photo)}">`;
  else av.textContent = (CURRENT_MEMBER.name || 'S').charAt(0).toUpperCase();

  // Fetch Programs & My Registrations
  try {
    const [pRes, rRes] = await Promise.all([
      supabaseClient.from('sksbv_programs').select('*').eq('is_active', true).in('status', ['upcoming', 'active']).order('program_date', {ascending:true}),
      supabaseClient.from('sksbv_program_registrations').select('*').eq('member_id', CURRENT_MEMBER.member_id)
    ]);
    LITERARY_PROGRAMS = pRes.data || [];
    MY_REGISTRATIONS = rRes.data || [];
  } catch(e) { console.error(e); }

  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  
  switchTab('home');
}

function switchTab(tab){
  document.querySelectorAll('.bn-item').forEach(b=>b.classList.remove('active'));
  const idx = {home:0, literary:1, events:2, profile:3}[tab];
  if(document.querySelectorAll('.bn-item')[idx]) document.querySelectorAll('.bn-item')[idx].classList.add('active');

  const el = document.getElementById('mainContent');
  el.innerHTML = '<div style="text-align:center;padding:40px;"><div class="loader" style="margin:0 auto; width:32px; height:32px; border-color:rgba(139,92,246,.2); border-top-color:#8b5cf6;"></div></div>';

  if (tab === 'home') renderHome(el);
  else if (tab === 'literary') renderLiterary(el);
  else if (tab === 'events') renderEvents(el);
  else if (tab === 'profile') renderProfile(el);
}

function renderHome(el){
  let progHtml = '';
  if (LITERARY_PROGRAMS.length === 0) {
    progHtml = '<div class="empty"><i class="fas fa-feather"></i>പുതിയ പ്രോഗ്രാമുകൾ ഉടൻ വരുന്നു</div>';
  } else {
    LITERARY_PROGRAMS.slice(0, 2).forEach(p => {
      progHtml += `
        <div class="program-item">
          <div class="program-title">📚 ${esc(p.title)}</div>
          ${p.theme ? `<div class="program-theme">📖 ${esc(p.theme)}</div>` : ''}
          <div class="program-meta" style="margin-bottom:0;">
            <span>📅 ${p.program_date ? new Date(p.program_date).toLocaleDateString('en-IN', {day:'2-digit', month:'short'}) : '—'}</span>
            ${p.venue ? `<span>📍 ${esc(p.venue)}</span>` : ''}
          </div>
        </div>
      `;
    });
  }

  el.innerHTML = `
    <div class="literary-hero">
      <h2>അക്ഷരങ്ങൾ <br>ചിറകടിക്കുന്നിടം.</h2>
      <p>സാഹിത്യ സമാജം — രചനയും വായനയും ഒരുമിച്ച് വളരാം</p>
      <button class="lit-btn" onclick="switchTab('literary')"><i class="fas fa-feather"></i> പ്രോഗ്രാമുകൾ കാണുക</button>
    </div>
    <div class="card">
      <div class="card-header">
        <h3><i class="fas fa-feather"></i> സാഹിത്യ സമാജം</h3>
        <button class="badge" onclick="switchTab('literary')">See all →</button>
      </div>
      ${progHtml}
    </div>
    <div class="card">
      <div class="card-header"><h3><i class="fas fa-bolt"></i> Quick Actions</h3></div>
      <div class="action-grid">
        <div class="action-tile" onclick="switchTab('literary')"><div class="action-ico c-purple"><i class="fas fa-pen-fancy"></i></div><h6>സാഹിത്യം</h6></div>
        <div class="action-tile" onclick="alert('ഉടൻ വരുന്നു')"><div class="action-ico c-pink"><i class="fas fa-images"></i></div><h6>ഗാലറി</h6></div>
        <div class="action-tile" onclick="alert('ഉടൻ വരുന്നു')"><div class="action-ico c-blue"><i class="fas fa-question-circle"></i></div><h6>ക്വിസ്</h6></div>
        <div class="action-tile" onclick="switchTab('profile')"><div class="action-ico c-green"><i class="fas fa-user"></i></div><h6>പ്രൊഫൈൽ</h6></div>
      </div>
    </div>
  `;
}

function renderLiterary(el){
  let html = `
    <div class="card" style="background:linear-gradient(135deg,#4c1d95,#8b5cf6);color:#fff;border:none;margin-bottom:20px;">
      <h2 style="font-size:1.3rem;font-weight:900;margin-bottom:6px;"><i class="fas fa-feather"></i> സാഹിത്യ സമാജം</h2>
      <p style="font-size:.85rem;opacity:.9;">പ്രോഗ്രാമുകളിൽ പങ്കെടുത്ത് നിങ്ങളുടെ കഴിവ് തെളിയിക്കൂ</p>
    </div>
  `;

  if (LITERARY_PROGRAMS.length === 0) {
    html += `<div class="card"><div class="empty"><i class="fas fa-feather"></i>ഇപ്പോൾ പ്രോഗ്രാമുകൾ ഇല്ല</div></div>`;
  } else {
    LITERARY_PROGRAMS.forEach(p => {
      // Check if registered
      const reg = MY_REGISTRATIONS.find(r => r.program_id === p.id);
      let regStatus = '';
      let btnAction = `onclick="openRegModal(${p.id}, '${esc(p.title).replace(/'/g, "\\'")}')"`;
      let btnColor = 'var(--primary)';
      
      if (reg) {
        regStatus = `<div style="background:#dcfce7;color:#065f46;padding:8px 12px;border-radius:10px;font-size:.8rem;font-weight:800;margin-bottom:12px;"><i class="fas fa-check-circle"></i> രജിസ്റ്റർ ചെയ്തു: ${esc(reg.item_title)}</div>`;
        btnAction = `disabled`;
        btnColor = '#cbd5e1';
      }

      html += `
        <div class="card">
          <div class="program-title">📚 ${esc(p.title)}</div>
          ${p.theme ? `<div class="program-theme">📖 ${esc(p.theme)}</div>` : ''}
          <p style="font-size:.82rem;color:var(--dim);margin-bottom:12px;line-height:1.5;">${esc(p.description || '')}</p>
          <div class="program-meta" style="margin-bottom:14px;">
            <span>📅 ${p.program_date ? new Date(p.program_date).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}) : '—'}</span>
            ${p.venue ? `<span>📍 ${esc(p.venue)}</span>` : ''}
          </div>
          ${regStatus}
          <button class="lit-btn" style="width:100%;justify-content:center;background:${btnColor};color:${reg ? '#64748b' : '#fff'};" ${btnAction}>
            ${reg ? 'രജിസ്റ്റർ ചെയ്തു' : 'രജിസ്റ്റർ ചെയ്യുക <i class="fas fa-arrow-right"></i>'}
          </button>
        </div>
      `;
    });
  }
  el.innerHTML = html;
}

function renderEvents(el){
  el.innerHTML = `<div class="card"><div class="empty"><i class="fas fa-calendar-alt"></i><h3>ഇവന്റുകൾ</h3><p>ഉടൻ വരുന്നു</p></div></div>`;
}

function renderProfile(el){
  const p = CURRENT_MEMBER;
  el.innerHTML = `
    <div class="card" style="text-align:center;">
      <div class="app-avatar" style="width:100px;height:100px;margin:0 auto 16px;font-size:2rem;">
        ${p.photo ? `<img src="${esc(p.photo)}">` : (p.name||'S').charAt(0).toUpperCase()}
      </div>
      <h2 style="font-size:1.2rem;font-weight:900;margin-bottom:4px;">${esc(p.name)}</h2>
      <p style="color:var(--dim);font-size:.85rem;">Class ${esc(p.class)}</p>
      <div style="margin-top:12px;background:#f1f5f9;padding:8px 16px;border-radius:20px;display:inline-block;font-family:monospace;font-weight:900;color:var(--primary);">
        ID: ${esc(p.member_id)}
      </div>
    </div>
    <div class="card">
      <button class="lit-btn" style="width:100%;background:#f1f5f9;color:#475569;justify-content:center;box-shadow:none;" onclick="logout()">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>
  `;
}

// ═══ REGISTRATION LOGIC ═══
function openRegModal(programId, title) {
  document.getElementById('regProgramId').value = programId;
  document.getElementById('regProgramTitle').value = title;
  document.getElementById('regForm').reset();
  document.getElementById('regProgramId').value = programId; // Reset clears this, so set again
  document.getElementById('regProgramTitle').value = title;
  document.getElementById('regModal').classList.add('open');
}

function closeModal() {
  document.getElementById('regModal').classList.remove('open');
}

async function submitRegistration(e) {
  e.preventDefault();
  const programId = document.getElementById('regProgramId').value;
  const itemType = document.getElementById('regItemType').value;
  const itemTitle = document.getElementById('regItemTitle').value.trim();
  const itemDesc = document.getElementById('regItemDesc').value.trim();

  if (!itemType || !itemTitle) {
    alert('എല്ലാ വിവരങ്ങളും നൽകുക'); return;
  }

  const btn = document.getElementById('regSubmitBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> സമർപ്പിക്കുന്നു...';

  try {
    const { error } = await supabaseClient.from('sksbv_program_registrations').insert({
      program_id: programId,
      member_id: CURRENT_MEMBER.member_id,
      member_name: CURRENT_MEMBER.name,
      member_class: CURRENT_MEMBER.class,
      item_type: itemType,
      item_title: itemTitle,
      item_description: itemDesc || null,
      status: 'pending'
    });

    if (error) throw error;

    alert('✅ വിജയകരമായി രജിസ്റ്റർ ചെയ്തു!');
    closeModal();
    
    // Refresh data and re-render
    const rRes = await supabaseClient.from('sksbv_program_registrations').select('*').eq('member_id', CURRENT_MEMBER.member_id);
    MY_REGISTRATIONS = rRes.data || [];
    switchTab('literary');

  } catch(err) {
    alert('❌ ' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> സമർപ്പിക്കുക';
  }
}

function logout(){
  localStorage.removeItem('noor_session');
  window.location.href = 'index.html';
}

boot();
</script>
</body>
</html>
