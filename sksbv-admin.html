<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SKSBV Admin — സാഹിത്യ സമാജം</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sksbv-config.js"></script>
<style>
:root{--primary:#6366f1;--primary-dark:#4f46e5;--accent:#8b5cf6;--success:#059669;--danger:#dc2626;--warning:#f59e0b;--bg:#f8fafc;--card:#ffffff;--text:#0f172a;--dim:#64748b;--border:rgba(100,116,139,.15);--shadow:0 10px 30px -15px rgba(15,23,42,.2)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Anek Malayalam',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#667eea,#764ba2)}
.login-card{background:#fff;border-radius:24px;padding:32px 28px;max-width:420px;width:100%;box-shadow:0 40px 80px -20px rgba(0,0,0,.4)}
.login-icon{width:80px;height:80px;margin:0 auto 20px;border-radius:20px;background:linear-gradient(140deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;font-size:2rem;color:#fff;box-shadow:0 15px 35px -10px rgba(102,126,234,.6)}
.login-card h1{text-align:center;font-size:1.4rem;font-weight:900;margin:0 0 6px}
.login-card p{text-align:center;color:var(--dim);font-size:.82rem;margin:0 0 24px}
.login-input{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:14px;font-family:inherit;font-size:16px;margin-bottom:12px;outline:none;background:#f8fafc}
.login-input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(99,102,241,.15)}
.login-btn{width:100%;padding:15px;border-radius:14px;border:none;background:linear-gradient(100deg,#6366f1,#8b5cf6);color:#fff;font-family:inherit;font-weight:900;font-size:.95rem;cursor:pointer;box-shadow:0 15px 30px -10px rgba(99,102,241,.6)}
.login-btn:active{transform:scale(.98)}
.login-error{background:#fee2e2;color:#dc2626;padding:10px 14px;border-radius:10px;font-size:.78rem;font-weight:700;margin-bottom:12px;display:none}
.login-back{text-align:center;margin-top:16px}
.login-back a{color:var(--dim);font-size:.78rem;text-decoration:none;font-weight:700}
#appScreen{display:none;min-height:100vh}
.app-header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:16px 20px;padding-top:calc(16px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px -8px rgba(0,0,0,.3)}
.app-header-left{display:flex;align-items:center;gap:12px}
.app-logo{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.app-header h1{font-size:1rem;font-weight:900;margin:0;line-height:1.2}
.app-header small{font-size:.68rem;opacity:.85;display:block;margin-top:2px}
.logout-btn{background:rgba(255,255,255,.22);border:none;color:#fff;padding:9px 16px;border-radius:10px;font-family:inherit;font-weight:800;font-size:.78rem;cursor:pointer;display:flex;align-items:center;gap:6px}
.app-layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 76px)}
.sidebar{background:#fff;border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:76px;height:calc(100vh - 76px);overflow-y:auto}
.sidebar-nav{display:flex;flex-direction:column;gap:4px}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:none;background:transparent;color:var(--dim);font-family:inherit;font-weight:700;font-size:.86rem;cursor:pointer;text-align:left;width:100%;transition:all .2s}
.sidebar-item:hover{background:#f1f5f9;color:var(--text)}
.sidebar-item.active{background:linear-gradient(100deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 6px 16px -6px rgba(99,102,241,.5)}
.sidebar-item i{width:20px;text-align:center;font-size:1rem}
.sidebar-section{font-size:.62rem;font-weight:900;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;padding:16px 14px 6px}
.sidebar-section.samajam{color:#7c3aed}
.main-content{padding:24px;overflow-y:auto}
.content-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.content-header h2{font-size:1.4rem;font-weight:900;margin:0 0 4px}
.content-header p{color:var(--dim);font-size:.82rem;margin:0}
.content-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:12px;border:none;font-family:inherit;font-weight:800;font-size:.82rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .2s;min-height:42px}
.btn-primary{background:linear-gradient(100deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 8px 20px -8px rgba(99,102,241,.6)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-success{background:linear-gradient(100deg,#059669,#34d399);color:#fff}
.btn-danger{background:linear-gradient(100deg,#dc2626,#ef4444);color:#fff}
.btn-warning{background:linear-gradient(100deg,#f59e0b,#fbbf24);color:#03132e}
.btn-ghost{background:#f1f5f9;color:var(--dim);border:1.5px solid var(--border)}
.btn-sm{padding:6px 12px;font-size:.72rem;min-height:32px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:16px;padding:20px;border:1px solid var(--border);box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:10%;right:10%;height:3px;border-radius:99px;background:linear-gradient(90deg,#6366f1,#8b5cf6)}
.stat-card.green::before{background:linear-gradient(90deg,#059669,#34d399)}
.stat-card.orange::before{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.stat-card.pink::before{background:linear-gradient(90deg,#ec4899,#f472b6)}
.stat-num{font-size:1.8rem;font-weight:900;background:linear-gradient(120deg,#1a4fc4,#2b7cf0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:.7rem;color:var(--dim);font-weight:800;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.stat-icon{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:12px;background:#e0e7ff;color:#6366f1;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.data-table{background:#fff;border-radius:16px;border:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow)}
.data-table table{width:100%;border-collapse:collapse;font-size:.84rem;min-width:600px}
.data-table th{padding:12px 14px;text-align:left;font-weight:900;font-size:.68rem;text-transform:uppercase;color:#1e40af;background:#f0f6ff;border-bottom:2px solid rgba(59,130,246,.2);letter-spacing:.5px;white-space:nowrap}
.data-table td{padding:12px 14px;border-bottom:1px solid rgba(100,116,139,.08);vertical-align:middle}
.data-table tr:hover td{background:#f8faff}
.data-table img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.5px}
.badge.success{background:rgba(5,150,105,.15);color:#059669}
.badge.danger{background:rgba(220,38,38,.15);color:#dc2626}
.badge.warning{background:rgba(245,158,11,.15);color:#b45309}
.badge.info{background:rgba(59,130,246,.15);color:#1e40af}
.badge.purple{background:rgba(139,92,246,.15);color:#7c3aed}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.9);backdrop-filter:blur(16px);z-index:1000;display:none;align-items:flex-start;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top,16px));overflow-y:auto}
.modal.open{display:flex}
.modal-card{background:#fff;border-radius:22px;padding:24px;max-width:640px;width:100%;margin:auto 0;max-height:calc(100dvh - 32px);overflow-y:auto;box-shadow:0 40px 90px -30px rgba(0,0,0,.5);animation:slideUp .35s cubic-bezier(.34,1.4,.64,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-header h3{font-size:1.1rem;font-weight:900;margin:0}
.modal-close{background:#f1f5f9;border:none;width:38px;height:38px;border-radius:50%;font-size:1rem;cursor:pointer;color:var(--dim)}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:.76rem;font-weight:800;color:var(--dim);margin-bottom:6px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:16px;background:#f8fafc;outline:none;color:var(--text)}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(99,102,241,.12)}
.form-row textarea{min-height:100px;resize:vertical}
.form-row-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions .btn{flex:1;justify-content:center}
.form-hint{font-size:.68rem;color:var(--dim);margin-top:4px;font-weight:600}
.file-upload{width:100%;aspect-ratio:16/10;border:2.5px dashed rgba(99,102,241,.4);border-radius:14px;background:#f8fafc;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative;margin-bottom:14px}
.file-upload:hover{border-color:var(--primary);background:#eff6ff}
.file-upload img{width:100%;height:100%;object-fit:cover}
.file-upload-placeholder{text-align:center;padding:20px;color:var(--dim);font-weight:700;font-size:.82rem}
.file-upload-placeholder i{font-size:2.5rem;color:var(--primary);display:block;margin-bottom:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;padding:14px 24px;border-radius:50px;font-weight:800;font-size:.86rem;z-index:2000;box-shadow:0 20px 50px -12px rgba(99,102,241,.8);transition:transform .4s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:10px;max-width:92vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:linear-gradient(135deg,#059669,#34d399)}
.toast.error{background:linear-gradient(135deg,#dc2626,#ef4444)}
.empty-state{text-align:center;padding:60px 20px;color:var(--dim)}
.empty-state i{font-size:3rem;opacity:.3;display:block;margin-bottom:12px;color:var(--primary)}
.loading{text-align:center;padding:40px}
.spinner{width:32px;height:32px;border:3px solid rgba(99,102,241,.2);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.sidebar-toggle{display:none;background:rgba(255,255,255,.22);border:none;color:#fff;width:44px;height:44px;border-radius:12px;font-size:1.1rem;cursor:pointer;align-items:center;justify-content:center}
.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:49;display:none}
.sidebar-backdrop.show{display:block}
@media(max-width:900px){
  .app-layout{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:76px;bottom:0;width:280px;z-index:50;transform:translateX(-100%);transition:transform .3s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .sidebar.open{transform:translateX(0)}
  .main-content{padding:16px}
  .content-header h2{font-size:1.15rem}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{padding:16px}
  .stat-num{font-size:1.4rem}
  .form-row-grid{grid-template-columns:1fr}
  .sidebar-toggle{display:flex}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-icon">🔐</div>
    <h1>SKSBV Admin</h1>
    <p>സാഹിത്യ സമാജം — അഡ്മിൻ പാനൽ</p>
    <div class="login-error" id="loginError"></div>
    <input type="text" class="login-input" id="admUser" placeholder="Username" autocomplete="username">
    <input type="password" class="login-input" id="admPass" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')SK_ADMIN_login()">
    <button class="login-btn" onclick="SK_ADMIN_login()">Login →</button>
    <div class="login-back"><a href="sksbv.html">← Back to SKSBV</a></div>
  </div>
</div>

<div id="appScreen">
  <header class="app-header">
    <div class="app-header-left">
      <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
      <div class="app-logo">📚</div>
      <div>
        <h1>SKSBV Admin</h1>
        <small>സാഹിത്യ സമാജം</small>
      </div>
    </div>
    <button class="logout-btn" onclick="SK_ADMIN_logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
  </header>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section samajam">📚 സാഹിത്യ സമാജം</div>
      <div class="sidebar-nav">
        <button class="sidebar-item active" data-tab="dashboard" onclick="switchTab('dashboard')"><i class="fas fa-chart-pie"></i> ഡാഷ്ബോർഡ്</button>
        <button class="sidebar-item" data-tab="programs" onclick="switchTab('programs')"><i class="fas fa-feather"></i> പ്രോഗ്രാമുകൾ</button>
        <button class="sidebar-item" data-tab="registrations" onclick="switchTab('registrations')"><i class="fas fa-clipboard-check"></i> രജിസ്ട്രേഷനുകൾ</button>
        <button class="sidebar-item" data-tab="teams" onclick="switchTab('teams')"><i class="fas fa-users-rectangle"></i> ടീമുകൾ</button>
      </div>
      <div class="sidebar-section">അംഗങ്ങൾ</div>
      <div class="sidebar-nav">
        <button class="sidebar-item" data-tab="members" onclick="switchTab('members')"><i class="fas fa-users"></i> അംഗങ്ങൾ</button>
        <button class="sidebar-item" data-tab="leaders" onclick="switchTab('leaders')"><i class="fas fa-crown"></i> ഭാരവാഹികൾ</button>
        <button class="sidebar-item" data-tab="activities" onclick="switchTab('activities')"><i class="fas fa-star"></i> പ്രവർത്തനങ്ങൾ</button>
      </div>
      <div class="sidebar-section">⚙️ സൈറ്റ്</div>
      <div class="sidebar-nav">
        <button class="sidebar-item" data-tab="settings" onclick="switchTab('settings')"><i class="fas fa-cog"></i> Settings</button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>
    <main class="main-content" id="mainContent">
      <div class="loading"><div class="spinner"></div><p>Loading...</p></div>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CFG = window.SKSBV_CONFIG || {};
const supabaseClient = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
let CURRENT_TAB = 'dashboard';
let ADMIN_SESSION = null;
const DATA_CACHE = {};
const FIELDS_CACHE = {};

function $(id){ return document.getElementById(id); }
function esc(s){ return s==null?'':String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtDate(d){ if(!d)return'—'; try{const dt=new Date(d); if(isNaN(dt))return d; return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){return d;} }
function toast(msg, type='info'){
  const t = $('toast'); if(!t) return;
  t.className = 'toast ' + type + ' show';
  const icons = {success:'✅', error:'❌', info:'ℹ️'};
  t.innerHTML = `<span>${icons[type]||'ℹ️'}</span><span>${esc(msg)}</span>`;
  clearTimeout(window._toastT);
  window._toastT = setTimeout(()=>t.classList.remove('show'), 3000);
}
function confirmDel(msg){ return confirm(msg||'ഇത് ഒഴിവാക്കണോ?'); }

async function SK_ADMIN_login(){
  const u = $('admUser').value.trim();
  const p = $('admPass').value;
  const err = $('loginError');
  err.style.display = 'none';
  if(!u || !p){ err.textContent = 'രണ്ട് ഫീൽഡുകളും പൂരിപ്പിക്കുക'; err.style.display = 'block'; return; }
  if (u === CFG.ADMIN_USERNAME && p === CFG.ADMIN_PASSWORD){
    ADMIN_SESSION = {username: u, role: 'admin', ts: Date.now()};
    localStorage.setItem('sksbv_admin_session', JSON.stringify(ADMIN_SESSION));
    showApp();
    return;
  }
  err.textContent = '❌ തെറ്റായ യൂസർനെയിം അല്ലെങ്കിൽ പാസ്‌വേഡ്';
  err.style.display = 'block';
}
function SK_ADMIN_logout(){ localStorage.removeItem('sksbv_admin_session'); location.reload(); }
function showApp(){
  $('loginScreen').style.display = 'none';
  $('appScreen').style.display = 'block';
  loadTab('dashboard');
}
(function autoLogin(){
  const s = localStorage.getItem('sksbv_admin_session');
  if (s){
    try{
      ADMIN_SESSION = JSON.parse(s);
      if (Date.now() - ADMIN_SESSION.ts < 7*24*60*60*1000){ showApp(); }
      else { localStorage.removeItem('sksbv_admin_session'); }
    }catch(e){}
  }
})();
function switchTab(tab){
  CURRENT_TAB = tab;
  document.querySelectorAll('.sidebar-item').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  if (window.innerWidth <= 900) toggleSidebar(false);
  loadTab(tab);
}
function toggleSidebar(force){
  const sb = $('sidebar'), bd = $('sidebarBackdrop');
  const open = force !== undefined ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  bd.classList.toggle('show', open);
}
function loadTab(tab){
  const el = $('mainContent');
  el.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading...</p></div>';
  const handler = TAB_HANDLERS[tab];
  if (handler) handler(el);
  else el.innerHTML = '<div class="empty-state"><i class="fas fa-wrench"></i><p>Tab not configured</p></div>';
}
async function loadTable(table, orderCol='id', ascending=true){
  try {
    const { data, error } = await supabaseClient.from(table).select('*').order(orderCol, {ascending});
    if (error) throw error;
    return data || [];
  } catch(e){ console.warn('Load error:', e); return []; }
}
async function deleteRow(table, id){
  if (!confirmDel()) return;
  try {
    const { error } = await supabaseClient.from(table).delete().eq('id', id);
    if (error) throw error;
    toast('ഒഴിവാക്കി', 'success');
    loadTab(CURRENT_TAB);
  } catch(e){ toast('❌ '+e.message, 'error'); }
}
async function upsertRow(table, row, id){
  try {
    let r;
    if (id) r = await supabaseClient.from(table).update(row).eq('id', id);
    else r = await supabaseClient.from(table).insert(row);
    if (r.error) throw r.error;
    toast(id ? 'അപ്ഡേറ്റ് ചെയ്തു' : 'ചേർത്തു', 'success');
    closeModal();
    loadTab(CURRENT_TAB);
    return true;
  } catch(e){ toast('❌ '+e.message, 'error'); return false; }
}
function addItem(table){
  const fields = FIELDS_CACHE[table];
  if (!fields){ toast('Fields not loaded', 'error'); return; }
  const titles = {
    sksbv_members: 'അംഗത്തെ ചേർക്കുക',
    sksbv_leaders: 'ഭാരവാഹിയെ ചേർക്കുക',
    sksbv_activities: 'പ്രവർത്തനം ചേർക്കുക',
    sksbv_programs: 'പ്രോഗ്രാം ചേർക്കുക'
  };
  openModal(titles[table] || 'ചേർക്കുക', fields, null, table);
}
function editItem(table, id){
  const rows = DATA_CACHE[table] || [];
  const row = rows.find(r => String(r.id) === String(id));
  const fields = FIELDS_CACHE[table];
  if (!row){ toast('റെക്കോർഡ് കണ്ടെത്തിയില്ല', 'error'); return; }
  if (!fields){ toast('Fields not loaded', 'error'); return; }
  const titles = {
    sksbv_members: 'അംഗം എഡിറ്റ്',
    sksbv_leaders: 'ഭാരവാഹി എഡിറ്റ്',
    sksbv_activities: 'പ്രവർത്തനം എഡിറ്റ്',

async function editMemberFromTeam(memberId){

  ['teamMembersModal', 'unassignedModal'].forEach(id => {

  // 1. Fetch fresh member from DB

      .from('sksbv_members')
      .select('*')
      .eq('id', memberId)
      .maybeSingle();
    if (mr.error) throw mr.error;
    member = mr.data;
  } catch(e){
    toast('❌ ' + e.message, 'error');
    return;
  }

  if (!member){

    return;
  }

  // 2. Fetch teams for dropdown
  let teamsList = [];
  try {
    const tr = await supabaseClient.from('sksbv_teams').select('*').order('team_key');
    teamsList = tr.data || [];
  } catch(e){ console.warn('Teams load:', e); }

  const teamOptions = [{value:'', label:'— ഇല്ല —'}].concat(
    teamsList.map(t => ({value:t.team_key, label:t.team_name}))
  );

  // 3. Build fields
  const FIELDS = [
    {name:'member_id', label:'Student UID *', required:true, placeholder:'e.g., NSM001'},
    {name:'name', label:'പൂർണ്ണ നാമം *', required:true},
    {name:'class', label:'ക്ലാസ്'},
    {name:'roll_number', label:'Roll No'},
    {name:'phone', label:'ഫോൺ'},
    {name:'team', label:'🎨 ടീം', type:'select', options: teamOptions},
    {name:'role', label:'Role', type:'select', options:[
      {value:'member', label:'Member'},
      {value:'leader', label:'Leader'},
      {value:'admin', label:'Admin'}
    ]},
    {name:'position', label:'Position'},
    {name:'is_active', label:'Status', type:'boolean'},
    {name:'photo', label:'ഫോട്ടോ', type:'file'}
  ];

  // 4. Populate caches (so saveCrud + openModal work)
  DATA_CACHE['sksbv_members'] = DATA_CACHE['sksbv_members'] || [];
  const idx = DATA_CACHE['sksbv_members'].findIndex(x => String(x.id) === String(memberId));

  // 5. Open edit modal
  openModal('✏️ അംഗം എഡിറ്റ്', FIELDS, member, 'sksbv_members');
}

function openModal(title, fields, existing, tableName){
  const modal = document.createElement('div');
  modal.className = 'modal open';
  modal.id = 'crudModal';
  const d = existing || {};
  MODAL_FORM_DATA = {fields, existing: d, table: tableName, id: d.id};

  modal.innerHTML = `

}

/* ✅ FIXED: date ISO→YYYY-MM-DD, boolean select */
function renderField(f, val){
  if (f.type === 'date' && val) val = String(val).slice(0, 10);

  if (f.type === 'textarea'){
    return `<div class="form-row"><label>${esc(f.label)}${f.required?' *':''}</label>
      <textarea name="${f.name}" id="f_${f.name}" ${f.required?'required':''} placeholder="${esc(f.placeholder||'')}">${esc(val||'')}</textarea>
      ${f.hint ? `<div class="form-hint">${esc(f.hint)}</div>` : ''}</div>`;
  }
  if (f.type === 'select'){
    return `<div class="form-row"><label>${esc(f.label)}${f.required?' *':''}</label>
      <select name="${f.name}" id="f_${f.name}" ${f.required?'required':''}>
        <option value="">— തിരഞ്ഞെടുക്കുക —</option>
        ${(f.options||[]).map(o=>`<option value="${esc(o.value)}" ${String(val)===String(o.value)?'selected':''}>${esc(o.label)}</option>`).join('')}
      </select></div>`;
  }
  if (f.type === 'boolean'){
    const isActive = (val === true || val === 'true' || val === 1 || val === '1' || val == null);
    return `<div class="form-row"><label>${esc(f.label)}</label>
      <select name="${f.name}" id="f_${f.name}">
        <option value="true"  ${isActive ?'selected':''}>✅ Active</option>
        <option value="false" ${!isActive?'selected':''}>❌ Inactive</option>
      </select></div>`;
  }
  if (f.type === 'file'){
    return `<div class="form-row"><label>${esc(f.label)}</label>
      <div class="file-upload" id="f_${f.name}_wrap" onclick="document.getElementById('f_${f.name}').click()">
        ${val ? `<img src="${esc(val)}">` : `<div class="file-upload-placeholder"><i class="fas fa-cloud-upload-alt"></i>${esc(f.placeholder||'Tap to upload')}</div>`}
      </div>
      <input type="file" id="f_${f.name}" accept="${f.accept||'image/*'}" style="display:none" onchange="SK_handleUpload(this,'${f.name}')">
      <input type="hidden" name="${f.name}" id="f_${f.name}_url" value="${esc(val||'')}">
    </div>`;
  }
  return `<div class="form-row"><label>${esc(f.label)}${f.required?' *':''}</label>
    <input type="${f.type||'text'}" name="${f.name}" id="f_${f.name}" value="${esc(val||'')}" ${f.required?'required':''} placeholder="${esc(f.placeholder||'')}">
    ${f.hint ? `<div class="form-hint">${esc(f.hint)}</div>` : ''}</div>`;
}

async function SK_handleUpload(input, fieldName){
  const file = input.files[0];
  if (!file) return;
  toast('അപ്‌ലോഡ് ചെയ്യുന്നു...', 'info');
  try {
    const ext = (file.name.split('.').pop()||'jpg').toLowerCase();
    const fn = `sksbv_${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
    const { error } = await supabaseClient.storage.from(CFG.STORAGE_BUCKET).upload(fn, file);
    if (error) throw error;
    const { data } = supabaseClient.storage.from(CFG.STORAGE_BUCKET).getPublicUrl(fn);
    const url = data.publicUrl;
    $(`f_${fieldName}_url`).value = url;
    $(`f_${fieldName}_wrap`).innerHTML = `<img src="${url}">`;
    toast('അപ്‌ലോഡ് ചെയ്തു ✅', 'success');
  } catch(e){ toast('❌ '+e.message, 'error'); }
}

/* ✅ FIXED: types handled properly */
async function saveCrud(){
  const { fields, table, id } = MODAL_FORM_DATA;
  const row = {};
  fields.forEach(f => {
    const el = $(`f_${f.name}`);
    if (f.type === 'file') {
      row[f.name] = $(`f_${f.name}_url`).value || null;
    } else if (f.type === 'boolean') {
      row[f.name] = el.value === 'true';
    } else if (f.type === 'number') {
      const v = (el.value || '').trim();
      row[f.name] = v === '' ? null : Number(v);
    } else {
      row[f.name] = (el.value || '').trim() || null;
    }
  });
  await upsertRow(table, row, id);
}

async function saveSettings(){
  const form = document.getElementById('settingsForm');
  if (!form) return;
  const rows = [];
  SETTINGS_FIELDS.forEach(([key]) => {
    const input = form.elements[key];
    if (input) rows.push({ key, value: (input.value || '').trim() || null, updated_at: new Date().toISOString() });
  });
  try {
    const { error } = await supabaseClient.from('sksbv_settings').upsert(rows, { onConflict: 'key' });
    if (error) throw error;
    toast('✅ Settings saved — reload sksbv.html to see changes', 'success');
  } catch(e){ toast('❌ ' + e.message, 'error'); }
}

function filterMembersAdmin(){
  const q = (document.getElementById('memberSearchInput')?.value || '').toLowerCase().trim();
  const teamFilter = document.getElementById('memberTeamFilter')?.value || 'all';
  const data = (DATA_CACHE['sksbv_members'] || []).filter(m => {
    if (teamFilter === '__none__' && m.team) return false;
    if (teamFilter !== 'all' && teamFilter !== '__none__' && m.team !== teamFilter) return false;
    if (!q) return true;
    return ((m.name||'') + ' ' + (m.member_id||'') + ' ' + (m.class||'')).toLowerCase().indexOf(q) > -1;
  });
  
  // Get team map from cache
  const wrap = document.getElementById('membersTableWrap');
  if (!wrap) return;
  
  // Rebuild team map
  const teamMap = {};
  document.querySelectorAll('#memberTeamFilter option').forEach(opt => {
    if (opt.value && opt.value !== '__none__' && opt.value !== 'all'){
      teamMap[opt.value] = { team_key: opt.value, team_name: opt.textContent, color: '#8b5cf6' };
    }
  });
  
  // Better: refetch team colors from cache
  Promise.resolve().then(async () => {
    const tr = await supabaseClient.from('sksbv_teams').select('*');
    const realMap = {};
    (tr.data || []).forEach(t => realMap[t.team_key] = t);
    wrap.innerHTML = renderMembersTable(data, realMap);
  });
}

/* ✅ FIXED: matches member portal logic */
function getRegistrationStatus(p){
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const start = p.registration_start
    ? new Date(String(p.registration_start).slice(0,10) + 'T00:00:00') : null;
  const end   = p.registration_end
    ? new Date(String(p.registration_end).slice(0,10) + 'T23:59:59') : null;
  if (!start && !end) return {label:'തീയതി നൽകിയിട്ടില്ല', badge:'info'};
  if (start && todayStart < start) return {label:'🔒 ഇനിയും തുറന്നിട്ടില്ല', badge:'warning'};
  if (end && new Date() > end)     return {label:'🔒 രജിസ്ട്രേഷൻ അടച്ചു',   badge:'danger'};
  return {label:'🟢 രജിസ്ട്രേഷൻ തുറന്നിരിക്കുന്നു', badge:'success'};
}

/* ═══ REGISTRATIONS ═══ */
async function renderRegistrations(el){
  const [regRes, progRes] = await Promise.all([
    supabaseClient.from('sksbv_program_registrations').select('*').order('created_at', {ascending:false}),
    supabaseClient.from('sksbv_programs').select('id,title,registration_start,registration_end')
  ]);
  const regs = regRes.data || [];
  const programs = progRes.data || [];
  const progMap = {};
  const progDateMap = {};
  programs.forEach(p => {
    progMap[p.id] = p.title;
    progDateMap[p.id] = {start: p.registration_start, end: p.registration_end};
  });
  const pending = regs.filter(r => r.status === 'pending').length;
  const approved = regs.filter(r => r.status === 'approved').length;
  const rejected = regs.filter(r => r.status === 'rejected').length;
  const typeIcons = {song:'🎵', speech:'🎤', poem:'📝', story:'📖', essay:'✍️', quran:'📖', other:'🌟'};
  const typeLabels = {song:'ഗാനം', speech:'പ്രസംഗം', poem:'കവിത', story:'കഥ', essay:'ലേഖനം', quran:'ഖുർആൻ', other:'മറ്റുള്ളവ'};
  el.innerHTML = `
    <div class="content-header">
      <div><h2>📋 രജിസ്ട്രേഷനുകൾ</h2><p>${regs.length} ആകെ</p></div>
    </div>
    <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px;">
      <div class="stat-card orange"><div class="stat-num">${pending}</div><div class="stat-label">⏳ പെൻഡിംഗ്</div></div>
      <div class="stat-card green"><div class="stat-num">${approved}</div><div class="stat-label">✅ അംഗീകരിച്ചത്</div></div>
      <div class="stat-card pink"><div class="stat-num">${rejected}</div><div class="stat-label">❌ നിരസിച്ചത്</div></div>
    </div>
    <div style="background:#fff;padding:14px;border-radius:12px;border:1px solid var(--border);margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;">
      <select id="regFilterProgram" onchange="filterRegistrations()" style="flex:1;min-width:180px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--border);font-family:inherit;font-size:14px;">
        <option value="all">എല്ലാ പ്രോഗ്രാമുകളും</option>
        ${programs.map(p => `<option value="${p.id}">${esc(p.title)}</option>`).join('')}
      </select>
      <select id="regFilterStatus" onchange="filterRegistrations()" style="padding:9px 12px;border-radius:10px;border:1.5px solid var(--border);font-family:inherit;font-size:14px;">
        <option value="all">എല്ലാ Status</option>
        <option value="pending">⏳ പെൻഡിംഗ്</option>
        <option value="approved">✅ അംഗീകരിച്ചത്</option>
        <option value="rejected">❌ നിരസിച്ചത്</option>
      </select>
    </div>
    <div id="regListWrap">
      ${regs.length === 0 ? '<div class="empty-state"><i class="fas fa-clipboard"></i><p>രജിസ്ട്രേഷനുകൾ ഇല്ല</p></div>' : renderRegList(regs, progMap, typeIcons, typeLabels, progDateMap)}
    </div>
  `;
  window._regsCache = regs;
  window._progMapCache = progMap;
  window._typeIconsCache = typeIcons;
  window._typeLabelsCache = typeLabels;
  window._progDateCache = progDateMap;

function renderRegList(regs, progMap, typeIcons, typeLabels, progDateMap){
  if (!regs || regs.length === 0) return '<div class="empty-state"><i class="fas fa-inbox"></i><p>രജിസ്ട്രേഷനുകൾ ഇല്ല</p></div>';
  return `<div style="display:flex;flex-direction:column;gap:10px;">
    ${regs.map(r => {
      const sc = r.status==='approved'?'success':r.status==='rejected'?'danger':'warning';
      const si = r.status==='approved'?'✅':r.status==='rejected'?'❌':'⏳';
      const pd = progDateMap && progDateMap[r.program_id];
      const regDates = pd && (pd.start || pd.end)
        ? `<div style="font-size:.68rem;color:#7c3aed;font-weight:700;margin-top:3px;">📝 രജിസ്ട്രേഷൻ: ${fmtDate(pd.start)} → ${fmtDate(pd.end)}</div>`
        : '';
      return `<div style="background:#fff;border-radius:14px;padding:14px;border:1px solid var(--border);border-left:4px solid ${r.status==='approved'?'#059669':r.status==='rejected'?'#dc2626':'#f59e0b'};">
        <div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap;">
          <div style="flex:1;min-width:180px;">
            <div style="font-weight:900;font-size:.92rem;margin-bottom:3px;">${typeIcons[r.item_type]||'📝'} ${esc(r.item_title)}</div>
            <div style="font-size:.72rem;color:var(--dim);font-weight:700;">👤 ${esc(r.member_name||'—')} • ക്ലാസ് ${esc(r.member_class||'—')} • 🏷️ ${typeLabels[r.item_type]||r.item_type}</div>
            <div style="font-size:.72rem;color:#0891b2;font-weight:700;margin-top:4px;">📚 ${esc(progMap[r.program_id]||'—')}</div>
            ${regDates}
          </div>
          <span class="badge ${sc}">${si} ${r.status}</span>
        </div>
        ${r.item_description ? `<p style="font-size:.8rem;color:#475569;margin:0 0 10px;line-height:1.5;padding:10px;background:#f8fafc;border-radius:8px;white-space:pre-wrap;">${esc(r.item_description)}</p>` : ''}
        ${r.admin_note ? `<div style="font-size:.74rem;color:#7c3aed;font-weight:700;margin-bottom:8px;"><i class="fas fa-comment"></i> കുറിപ്പ്: ${esc(r.admin_note)}</div>` : ''}
        <div style="display:flex;gap:6px;flex-wrap:wrap;padding-top:8px;border-top:1px solid rgba(100,116,139,.08);">
          <small style="color:var(--dim);font-size:.68rem;align-self:center;flex:1;">⏱️ ${r.duration_minutes||'—'} min • ${fmtDate(r.created_at)}</small>
          ${r.status === 'pending' ? `
            <button class="btn btn-success btn-sm" onclick="approveRegistration(${r.id})">✅ അംഗീകരിക്കുക</button>
            <button class="btn btn-danger btn-sm" onclick="rejectRegistration(${r.id})">❌ നിരസിക്കുക</button>
          ` : `<button class="btn btn-ghost btn-sm" onclick="deleteRow('sksbv_program_registrations',${r.id})">🗑️</button>`}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function filterRegistrations(){
  const progFilter = document.getElementById('regFilterProgram')?.value || 'all';
  const statusFilter = document.getElementById('regFilterStatus')?.value || 'all';
  let filtered = window._regsCache || [];
  if (progFilter !== 'all') filtered = filtered.filter(r => String(r.program_id) === String(progFilter));
  if (statusFilter !== 'all') filtered = filtered.filter(r => r.status === statusFilter);
  const wrap = document.getElementById('regListWrap');
  if (wrap) wrap.innerHTML = renderRegList(filtered, window._progMapCache, window._typeIconsCache, window._typeLabelsCache, window._progDateCache);
}

async function approveRegistration(id){
  try {
    const { data: reg } = await supabaseClient.from('sksbv_program_registrations').select('*').eq('id',id).single();
    const { data: prog } = await supabaseClient.from('sksbv_programs').select('title,program_date').eq('id',reg.program_id).single();
    await supabaseClient.from('sksbv_program_registrations').update({status:'approved', reviewed_at:new Date().toISOString()}).eq('id', id);
    try {
      await supabaseClient.from('sksbv_notifications').insert({
        title: '✅ Literary Registration Approved',
        message: `നിങ്ങളുടെ "${reg.item_title}" (${reg.item_type}) — "${prog?.title}" program-ൽ approve ചെയ്തു! 📅 ${fmtDate(prog?.program_date)}`,
        target_type: 'member',
        target_member: reg.member_id
      });
    } catch(e){}

/* ═══ 👑 ASSIGN LEADER/ASSISTANT ═══ */
async function assignTeamRole(teamKey, roleType){
  // roleType: 'leader' | 'assistant'
  try {
    const tr = await supabaseClient.from('sksbv_teams').select('*').eq('team_key', teamKey).single();
    if (tr.error || !tr.data){ toast('❌ Team not found', 'error'); return; }
    const team = tr.data;

    const mr = await supabaseClient.from('sksbv_members').select('*').eq('team', teamKey).order('name');
    const members = mr.data || [];
    if (members.length === 0){ toast('❌ Team-ൽ അംഗങ്ങളില്ല', 'error'); return; }

    const currentId = roleType === 'leader' ? team.leader_id : team.assistant_id;
    const otherId = roleType === 'leader' ? team.assistant_id : team.leader_id;
    const roleLabel = roleType === 'leader' ? '👑 ലീഡർ' : '⭐ അസിസ്റ്റന്റ് ലീഡർ';
    const roleColor = roleType === 'leader' ? '#f59e0b' : '#0891b2';

    const modal = document.createElement('div');
    modal.className = 'modal open';
    modal.id = 'assignRoleModal';
    modal.innerHTML = `
      <div class="modal-card">
        <div class="modal-header">
          <h3 style="color:${roleColor};">${roleLabel} — ${esc(team.team_name)}</h3>
          <button class="modal-close" onclick="document.getElementById('assignRoleModal').remove()">✕</button>
        </div>

        <div style="background:${roleColor}15;border:1.5px solid ${roleColor}44;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.78rem;color:#475569;font-weight:700;line-height:1.5;">
          <i class="fas fa-info-circle" style="color:${roleColor};"></i>
          ${roleType === 'leader'
            ? 'ടീമിലെ ഒരാളെ ലീഡർ ആയി തിരഞ്ഞെടുക്കുക. Leader-നു 👑 badge കാണിക്കും.'
            : 'ടീമിലെ ഒരാളെ അസിസ്റ്റന്റ് ലീഡർ ആയി തിരഞ്ഞെടുക്കുക. Assistant-നു ⭐ badge കാണിക്കും.'}
          ${otherId ? `<br><small style="color:#dc2626;">⚠️ ഒരാൾ ഒരേസമയം leader-ഉം assistant-ഉം ആകാൻ പറ്റില്ല.</small>` : ''}
        </div>

        <div style="display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto;margin-bottom:16px;">
          ${members.map(m => {
            const isCurrent = m.member_id === currentId;
            const isOther = m.member_id === otherId;
            return `
              <label style="display:flex;align-items:center;gap:12px;padding:12px 14px;
                           background:${isCurrent ? roleColor + '15' : '#f8fafc'};
                           border:2px solid ${isCurrent ? roleColor : 'rgba(100,116,139,.15)'};
                           border-radius:12px;cursor:${isOther ? 'not-allowed' : 'pointer'};
                           opacity:${isOther ? '0.5' : '1'};">
                <input type="radio" name="teamRolePick" value="${esc(m.member_id)}"
                       ${isCurrent ? 'checked' : ''} ${isOther ? 'disabled' : ''}
                       style="width:20px;height:20px;accent-color:${roleColor};flex-shrink:0;cursor:${isOther ? 'not-allowed' : 'pointer'};">
                <div style="width:40px;height:40px;border-radius:50%;overflow:hidden;background:linear-gradient(140deg,${roleColor},${roleColor}cc);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:.9rem;flex-shrink:0;">
                  ${m.photo ? `<img src="${esc(m.photo)}" style="width:100%;height:100%;object-fit:cover;">` : esc((m.name||'M').charAt(0))}
                </div>
                <div style="flex:1;min-width:0;">
                  <div style="font-weight:900;color:#0f172a;font-size:.9rem;">
                    ${esc(m.name)}
                    ${isOther ? `<span style="font-size:.6rem;color:#dc2626;margin-left:6px;">(Already ${roleType === 'leader' ? 'Assistant' : 'Leader'})</span>` : ''}
                  </div>
                  <div style="font-size:.7rem;color:var(--dim);font-weight:700;">${esc(m.member_id)} • Class ${esc(m.class||'—')}</div>
                </div>
                ${isCurrent ? `<span style="background:${roleColor};color:#fff;padding:3px 10px;border-radius:20px;font-size:.6rem;font-weight:900;">CURRENT</span>` : ''}
              </label>
            `;
          }).join('')}
        </div>

        <div class="modal-actions">
          ${currentId ? `<button type="button" class="btn btn-danger btn-sm" onclick="clearTeamRole('${teamKey}','${roleType}')" style="flex:.5;justify-content:center;"><i class="fas fa-times"></i> Clear</button>` : ''}

            <i class="fas fa-save"></i> Save

    `;
    document.body.appendChild(modal);
    modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
  } catch(e){ toast('❌ ' + e.message, 'error'); }

async function saveTeamRole(teamKey, roleType){
  const picked = document.querySelector('input[name="teamRolePick"]:checked');
  if (!picked){ toast('⚠️ ഒരാളെ തിരഞ്ഞെടുക്കുക', 'error'); return; }

  const memberId = picked.value;
  const col = roleType === 'leader' ? 'leader_id' : 'assistant_id';

  try {
    const update = {};
    update[col] = memberId;
    update.updated_at = new Date().toISOString();

    const r = await supabaseClient.from('sksbv_teams').update(update).eq('team_key', teamKey);
    if (r.error) throw r.error;

    // Get member name for toast
    const mr = await supabaseClient.from('sksbv_members').select('name').eq('member_id', memberId).single();
    const name = mr.data ? mr.data.name : memberId;

    toast('✅ ' + (roleType === 'leader' ? '👑 Leader' : '⭐ Assistant') + ' → ' + name, 'success');
    document.getElementById('assignRoleModal').remove();
    loadTab('teams');
  } catch(e){ toast('❌ ' + e.message, 'error'); }
}

async function clearTeamRole(teamKey, roleType){
  if (!confirm('ഈ ' + (roleType === 'leader' ? 'ലീഡർ' : 'അസിസ്റ്റന്റ്') + '-നെ remove ചെയ്യണോ?')) return;

  const col = roleType === 'leader' ? 'leader_id' : 'assistant_id';
  try {
    const update = {};
    update[col] = null;
    update.updated_at = new Date().toISOString();

    const r = await supabaseClient.from('sksbv_teams').update(update).eq('team_key', teamKey);
    if (r.error) throw r.error;

    toast('✅ Removed', 'success');
    document.getElementById('assignRoleModal').remove();
    loadTab('teams');
  } catch(e){ toast('❌ ' + e.message, 'error'); }
}

async function autoSplitTeams(){
  if (!confirm('⚡ Auto Split?\n\nഎല്ലാ അംഗങ്ങളെയും ബാലൻസ്ഡ് ആയി 2 ടീമുകളിലേക്ക് വിഭജിക്കും.\n\n⚠️ നിലവിലുള്ള team assignments overwrite ചെയ്യും.')) return;
  
  try {
    const teams = await loadTable('sksbv_teams', 'team_key');
    if (teams.length !== 2){ toast('❌ കൃത്യം 2 ടീമുകൾ വേണം', 'error'); return; }
    
    const members = await loadTable('sksbv_members', 'name');
    if (members.length === 0){ toast('❌ അംഗങ്ങളില്ല', 'error'); return; }
    
    // Sort members by name for consistent distribution
    const sorted = members.slice().sort((a,b) => (a.name || '').localeCompare(b.name || ''));
    
    // Alternate assignment
    const t1 = teams[0].team_key;
    const t2 = teams[1].team_key;
    
    toast('⏳ Splitting ' + sorted.length + ' members...', 'info');
    
    // Update in batches
    for (let i = 0; i < sorted.length; i++){
      const m = sorted[i];
      const newTeam = i % 2 === 0 ? t1 : t2;
      await supabaseClient.from('sksbv_members').update({ team: newTeam }).eq('id', m.id);
    }
    
    toast('✅ ' + sorted.length + ' അംഗങ്ങളെ 2 ടീമുകളായി വിഭജിച്ചു', 'success');
    setTimeout(() => loadTab('teams'), 500);
  } catch(e){ toast('❌ ' + e.message, 'error'); }
}

          ${members.map(m => {
            const isLeader = m.member_id === leaderId;
            const isAssistant = m.member_id === assistantId;
            const badge = isLeader
              ? '<span style="background:linear-gradient(140deg,#fbbf24,#f59e0b);color:#03132e;padding:2px 8px;border-radius:20px;font-size:.58rem;font-weight:900;margin-left:6px;">👑 LEADER</span>'
              : isAssistant
              ? '<span style="background:linear-gradient(140deg,#22d3ee,#0891b2);color:#fff;padding:2px 8px;border-radius:20px;font-size:.58rem;font-weight:900;margin-left:6px;">⭐ ASSISTANT</span>'
              : '';
            const borderColor = isLeader ? '#f59e0b' : isAssistant ? '#0891b2' : 'var(--border)';
            const bgColor = isLeader ? 'linear-gradient(140deg,#fef3c7,#fde68a)' : isAssistant ? 'linear-gradient(140deg,#ecfeff,#cffafe)' : '#f8fafc';
            return `
              <div style="display:flex;align-items:center;gap:12px;padding:10px 12px;background:${bgColor};border-radius:12px;border:1.5px solid ${borderColor};">
                <div style="width:40px;height:40px;border-radius:50%;overflow:hidden;background:linear-gradient(140deg,${t.color},${t.color}cc);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:.9rem;flex-shrink:0;">
                  ${m.photo ? `<img src="${esc(m.photo)}" style="width:100%;height:100%;object-fit:cover;">` : esc((m.name||'M').charAt(0))}
                </div>
                <div style="flex:1;min-width:0;">
                  <div style="font-weight:900;color:#0f172a;font-size:.88rem;">${esc(m.name)}${badge}</div>
                  <div style="font-size:.7rem;color:var(--dim);font-weight:700;">${esc(m.member_id)} • Class ${esc(m.class||'—')}</div>
                </div>
                <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); editMemberFromTeam(${m.id})" title="Edit member">✏️</button>
              </div>
            `;
          }).join('')}
        </div>
      `}
      <div class="modal-actions" style="margin-top:16px;">
        <button type="button" class="btn btn-ghost" style="flex:1;justify-content:center;" onclick="document.getElementById('teamMembersModal').remove()">Close</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
}

async function viewUnassignedMembers(){
  const mr = await supabaseClient.from('sksbv_members').select('*').is('team', null).order('name');
  const members = mr.data || [];
  
  const modal = document.createElement('div');
  modal.className = 'modal open';
  modal.id = 'unassignedModal';
  modal.innerHTML = `
    <div class="modal-card">
      <div class="modal-header">
        <h3 style="color:#dc2626;">⚠️ Team ല്ലാത്തവർ — ${members.length}</h3>
        <button class="modal-close" onclick="document.getElementById('unassignedModal').remove()">✕</button>
      </div>
      ${members.length === 0 ? '<div class="empty-state"><i class="fas fa-check-circle"></i><p>എല്ലാവർക്കും team ഉണ്ട് ✅</p></div>' : `
        <div style="display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto;">
          ${members.map(m => `
            <div style="display:flex;align-items:center;gap:12px;padding:10px 12px;background:#fef2f2;border-radius:12px;border:1px solid rgba(220,38,38,.2);">
              <div style="flex:1;min-width:0;">
                <div style="font-weight:900;color:#0f172a;font-size:.88rem;">${esc(m.name)}</div>
                <div style="font-size:.7rem;color:var(--dim);font-weight:700;">${esc(m.member_id)} • Class ${esc(m.class||'—')}</div>
              </div>
              <button class="btn btn-primary btn-sm" onclick="event.stopPropagation(); editMemberFromTeam(${m.id})">➕ Assign</button>
            </div>
          `).join('')}
        </div>
      `}
      <div class="modal-actions" style="margin-top:16px;">
        <button type="button" class="btn btn-ghost" style="flex:1;justify-content:center;" onclick="document.getElementById('unassignedModal').remove()">Close</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

<!-- ═══ SKSBV → Login XP Bridge ═══ -->
<script id="sksbv-xp-bridge">
(function(){
  'use strict';
  console.log('🎁 SKSBV XP Bridge loading...');

  // ─── Level math (matches login.html v126) ───
  function totalXPForLevel(n){ return (n * (n + 1) / 2) * 100; }
  function levelFromTotal(t){
    var lvl = 1;
    while (totalXPForLevel(lvl + 1) <= t) lvl++;
    return lvl;
  }

  // ─── Open XP modal ───
  function openXPModal(reg){
    var old = document.getElementById('sksbvXPModal');
    if (old) old.remove();

    var presets = [5, 10, 25, 50, 100, 200];
    var presetsHTML = presets.map(function(v){
      return '<button type="button" class="sksbv-xp-preset" data-v="' + v + '" ' +
             'onclick="SKSBV_XP_pick(this,' + v + ')" ' +
             'style="padding:12px 6px;border-radius:12px;border:2px solid #e2e8f0;' +
             'background:#fff;font-family:inherit;font-weight:900;cursor:pointer;' +
             'font-size:.9rem;color:#0f172a;min-height:48px;">+' + v + '</button>';
    }).join('');

    var modal = document.createElement('div');
    modal.id = 'sksbvXPModal';
    modal.style.cssText =
      'position:fixed;inset:0;background:rgba(3,8,28,.9);backdrop-filter:blur(14px);' +
      'z-index:100500;display:flex;align-items:flex-start;justify-content:center;' +
      'padding:16px;padding-top:max(16px,env(safe-area-inset-top,16px));' +
      'overflow-y:auto;';

    modal.innerHTML =
      '<div style="background:#fff;border-radius:22px;max-width:440px;width:100%;' +
                  'padding:24px;margin:auto 0;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);">' +

        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">' +
          '<h3 style="margin:0;font-size:1.1rem;font-weight:900;color:#0f172a;">🎁 Give SKSBV XP</h3>' +
          '<button onclick="document.getElementById(\'sksbvXPModal\').remove()" ' +
                  'style="background:#f1f5f9;border:none;width:38px;height:38px;' +
                         'border-radius:50%;cursor:pointer;font-size:1rem;">✕</button>' +
        '</div>' +

        // Student info
        '<div style="background:#f0fdf4;padding:12px 14px;border-radius:12px;' +
                    'margin-bottom:16px;border:1.5px solid rgba(5,150,105,.3);">' +
          '<div style="font-weight:900;color:#0f172a;font-size:.94rem;">' +
            escapeHtml(reg.member_name || '') + '</div>' +
          '<div style="font-size:.72rem;color:#64748b;margin-top:3px;font-weight:700;">' +
            '🆔 ' + escapeHtml(reg.member_id || '') + ' • Class ' + escapeHtml(reg.member_class || '') + '</div>' +
          '<div style="font-size:.72rem;color:#0891b2;margin-top:2px;font-weight:700;">' +
            '📝 ' + escapeHtml(reg.item_title || '') + ' — ' + escapeHtml(reg.item_type || '') + '</div>' +
        '</div>' +

        // Quick presets
        '<div style="font-size:.74rem;font-weight:900;color:#475569;' +
                    'text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">' +
          '⚡ Quick Amount</div>' +
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;' +
                    'margin-bottom:16px;" id="sksbvXPPresets">' + presetsHTML + '</div>' +

        // Custom
        '<label style="display:block;font-size:.78rem;font-weight:800;' +
                      'color:#475569;margin-bottom:6px;">✏️ Custom Amount</label>' +
        '<input type="number" id="sksbvXPCustom" min="1" max="1000" value="25" ' +
               'style="width:100%;padding:13px;border:1.5px solid #cbd5e1;' +
                      'border-radius:10px;font-family:inherit;font-size:18px;' +
                      'font-weight:900;text-align:center;color:#0f172a;' +
                      'outline:none;margin-bottom:16px;">' +

        // Reason
        '<label style="display:block;font-size:.78rem;font-weight:800;' +
                      'color:#475569;margin-bottom:6px;">📝 Reason (optional)</label>' +
        '<input type="text" id="sksbvXPReason" maxlength="100" ' +
               'placeholder="e.g., മികച്ച പങ്കാളിത്തം 🎉" ' +
               'style="width:100%;padding:12px;border:1.5px solid #cbd5e1;' +
                      'border-radius:10px;font-family:inherit;font-size:15px;' +
                      'color:#0f172a;outline:none;margin-bottom:16px;">' +

        // Buttons
        '<div style="display:flex;gap:8px;">' +
          '<button onclick="document.getElementById(\'sksbvXPModal\').remove()" ' +
                  'style="flex:.6;padding:13px;border-radius:12px;' +
                         'border:1.5px solid #cbd5e1;background:#f8fafc;' +
                         'font-family:inherit;font-weight:800;cursor:pointer;' +
                         'min-height:48px;">Cancel</button>' +
          '<button onclick="SKSBV_XP_give(' + reg.id + ')" id="sksbvXPSubmitBtn" ' +
                  'style="flex:1.4;padding:13px;border-radius:12px;border:none;' +
                         'background:linear-gradient(100deg,#8b5cf6,#a78bfa);' +
                         'color:#fff;font-family:inherit;font-weight:900;' +
                         'cursor:pointer;min-height:48px;' +
                         'box-shadow:0 8px 20px -8px rgba(139,92,246,.7);">' +
            '✅ Give XP</button>' +
        '</div>' +
      '</div>';

    document.body.appendChild(modal);
    modal.addEventListener('click', function(e){
      if (e.target === modal) modal.remove();
    });

    window._sksbvXPCurrentReg = reg;
  }

  // ─── Preset picker ───
  window.SKSBV_XP_pick = function(btn, val){
    document.querySelectorAll('#sksbvXPPresets .sksbv-xp-preset').forEach(function(b){
      b.style.background = '#fff';
      b.style.borderColor = '#e2e8f0';
      b.style.color = '#0f172a';
    });
    btn.style.background = '#8b5cf6';
    btn.style.borderColor = '#7c3aed';
    btn.style.color = '#fff';
    document.getElementById('sksbvXPCustom').value = val;
    if (navigator.vibrate) try { navigator.vibrate(10); } catch(e){}
  };

  // ─── Award XP ───
  window.SKSBV_XP_give = async function(regId){
    var reg = window._sksbvXPCurrentReg;
    if (!reg) return;

    var amount = parseInt(document.getElementById('sksbvXPCustom').value) || 0;
    var reason = (document.getElementById('sksbvXPReason').value || '').trim();
    var sid = reg.member_id;

    if (amount <= 0){ alert('Amount required'); return; }
    if (!sid){ alert('Student ID missing'); return; }

    var btn = document.getElementById('sksbvXPSubmitBtn');
    if (btn){ btn.disabled = true; btn.innerHTML = '⏳ Saving...'; }

    try {
      // Fetch current XP
      var xr = await supabaseClient.from('student_xp')
        .select('xp, level, total_earned')
        .eq('studentid', sid).maybeSingle();

      var old = xr.data || { xp: 0, level: 1, total_earned: 0 };
      var newTotal = (old.total_earned || 0) + amount;
      var newLevel = levelFromTotal(newTotal);
      var levelStartXP = totalXPForLevel(newLevel);
      var curXP = newTotal - levelStartXP;

      // Update
      var up = await supabaseClient.from('student_xp').upsert({
        studentid: sid,
        xp: curXP,
        level: newLevel,
        total_earned: newTotal,
        last_earned_at: new Date().toISOString(),
        updated_at: new Date().toISOString()
      }, { onConflict: 'studentid' });

      if (up.error) throw up.error;

      // Notify student (shows in login.html notifications)
      try {
        await supabaseClient.from('notifications').insert({
          title: '🎁 +' + amount + ' XP — SKSBV Program',
          message: '"' + (reg.item_title || 'Program') + '" — ' +
                   (reason || 'മികച്ച പങ്കാളിത്തത്തിന് 🎉') +
                   ' (+' + amount + ' XP)',
          type: 'important',
          target_type: 'student',
          target_student: sid,
          link_url: null
        });
      } catch(ne) {}

      // Optional: log to a tracking table
      try {
        await supabaseClient.from('sksbv_xp_log').insert({
          member_id: sid,
          program_id: reg.program_id,
          registration_id: reg.id,
          xp_amount: amount,
          reason: reason || null,
          awarded_at: new Date().toISOString()
        });
      } catch(e) {}

      document.getElementById('sksbvXPModal').remove();
      alert('✅ +' + amount + ' XP → ' + (reg.member_name || sid));

      if (typeof confetti !== 'undefined') {
        confetti({ particleCount: 100, spread: 80,
                   origin: { y: .7 },
                   colors: ['#8b5cf6','#a78bfa','#34d399','#fbbf24'] });
      }
    } catch(e){
      alert('❌ ' + e.message);
      if (btn){ btn.disabled = false; btn.innerHTML = '✅ Give XP'; }
    }
  };

  // ─── Inject XP button into approved registrations ───
  function injectXPButtons(){
    var wrap = document.getElementById('regListWrap');
    if (!wrap) return;

    // Approved regs = have delete button but NOT approve button
    wrap.querySelectorAll('[onclick*="deleteRow(\'sksbv_program_registrations\'"]').forEach(function(delBtn){
      if (delBtn._xpInjected) return;

      var match = delBtn.getAttribute('onclick').match(/deleteRow\('sksbv_program_registrations',(\d+)\)/);
      if (!match) return;

      var regId = parseInt(match[1]);
      var regs = window._regsCache || [];
      var reg = regs.find(function(r){ return r.id === regId; });
      if (!reg || reg.status !== 'approved') return;

      delBtn._xpInjected = true;

      var xpBtn = document.createElement('button');
      xpBtn.className = 'btn btn-sm';
      xpBtn.style.cssText = 'background:linear-gradient(100deg,#8b5cf6,#a78bfa);' +
                            'color:#fff;padding:6px 12px;border-radius:8px;' +
                            'font-weight:800;border:none;cursor:pointer;' +
                            'display:inline-flex;align-items:center;gap:4px;' +
                            'min-height:32px;';
      xpBtn.innerHTML = '🎁 XP';
      xpBtn.onclick = function(e){
        e.preventDefault(); e.stopPropagation();
        openXPModal(reg);
      };

      delBtn.parentNode.insertBefore(xpBtn, delBtn);
    });
  }

  // Hook: run on every render
  var _origFilter = window.filterRegistrations;
  if (typeof _origFilter === 'function'){
    window.filterRegistrations = function(){
      var r = _origFilter.apply(this, arguments);
      setTimeout(injectXPButtons, 200);
      return r;
    };
  }

  // Periodic safety
  setInterval(function(){
    if (document.getElementById('regListWrap')) injectXPButtons();
  }, 1500);

  // Expose manual trigger
  window.SKSBV_INJECT_XP = injectXPButtons;

  console.log('✅ SKSBV XP Bridge ready');
  console.log('   💡 Approved registrations-ൽ 🎁 XP button');
  console.log('   💡 SKSBV_INJECT_XP() — manual');
})();
</script>
