<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SKSBV Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sksbv-config.js"></script>
<style>
:root{
  --primary:#6366f1; --primary-dark:#4f46e5; --accent:#8b5cf6;
  --success:#059669; --danger:#dc2626; --warning:#f59e0b;
  --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --dim:#64748b;
  --border:rgba(100,116,139,.15);
  --shadow:0 10px 30px -15px rgba(15,23,42,.2);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Anek Malayalam',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh}

/* LOGIN */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#667eea,#764ba2)}
.login-card{background:#fff;border-radius:24px;padding:32px 28px;max-width:420px;width:100%;box-shadow:0 40px 80px -20px rgba(0,0,0,.4)}
.login-icon{width:80px;height:80px;margin:0 auto 20px;border-radius:20px;background:linear-gradient(140deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;font-size:2rem;color:#fff;box-shadow:0 15px 35px -10px rgba(102,126,234,.6)}
.login-card h1{text-align:center;font-size:1.4rem;font-weight:900;margin:0 0 6px}
.login-card p{text-align:center;color:var(--dim);font-size:.82rem;margin:0 0 24px}
.login-input{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:14px;font-family:inherit;font-size:16px;margin-bottom:12px;outline:none;background:#f8fafc}
.login-input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(99,102,241,.15)}
.login-btn{width:100%;padding:15px;border-radius:14px;border:none;background:linear-gradient(100deg,#6366f1,#8b5cf6);color:#fff;font-family:inherit;font-weight:900;font-size:.95rem;cursor:pointer;box-shadow:0 15px 30px -10px rgba(99,102,241,.6)}
.login-btn:active{transform:scale(.98)}
.login-error{background:#fee2e2;color:#dc2626;padding:10px 14px;border-radius:10px;font-size:.78rem;font-weight:700;margin-bottom:12px;display:none}
.login-back{text-align:center;margin-top:16px}
.login-back a{color:var(--dim);font-size:.78rem;text-decoration:none;font-weight:700}

/* APP */
#appScreen{display:none;min-height:100vh}
.app-header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:16px 20px;padding-top:calc(16px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px -8px rgba(0,0,0,.3)}
.app-header-left{display:flex;align-items:center;gap:12px}
.app-logo{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.app-header h1{font-size:1rem;font-weight:900;margin:0;line-height:1.2}
.app-header small{font-size:.68rem;opacity:.85;display:block;margin-top:2px}
.logout-btn{background:rgba(255,255,255,.22);border:none;color:#fff;padding:9px 16px;border-radius:10px;font-family:inherit;font-weight:800;font-size:.78rem;cursor:pointer;display:flex;align-items:center;gap:6px}

.app-layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 76px)}
.sidebar{background:#fff;border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:76px;height:calc(100vh - 76px);overflow-y:auto}
.sidebar-nav{display:flex;flex-direction:column;gap:4px}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:none;background:transparent;color:var(--dim);font-family:inherit;font-weight:700;font-size:.86rem;cursor:pointer;text-align:left;width:100%;transition:all .2s}
.sidebar-item:hover{background:#f1f5f9;color:var(--text)}
.sidebar-item.active{background:linear-gradient(100deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 6px 16px -6px rgba(99,102,241,.5)}
.sidebar-item i{width:20px;text-align:center;font-size:1rem}
.sidebar-section{font-size:.62rem;font-weight:900;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;padding:16px 14px 6px}

.main-content{padding:24px;overflow-y:auto}
.content-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.content-header h2{font-size:1.4rem;font-weight:900;margin:0 0 4px}
.content-header p{color:var(--dim);font-size:.82rem;margin:0}
.content-actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{padding:10px 18px;border-radius:12px;border:none;font-family:inherit;font-weight:800;font-size:.82rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .2s;min-height:42px}
.btn-primary{background:linear-gradient(100deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 8px 20px -8px rgba(99,102,241,.6)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-success{background:linear-gradient(100deg,#059669,#34d399);color:#fff}
.btn-danger{background:linear-gradient(100deg,#dc2626,#ef4444);color:#fff}
.btn-warning{background:linear-gradient(100deg,#f59e0b,#fbbf24);color:#03132e}
.btn-ghost{background:#f1f5f9;color:var(--dim);border:1.5px solid var(--border)}
.btn-sm{padding:6px 12px;font-size:.72rem;min-height:32px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:16px;padding:20px;border:1px solid var(--border);box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:10%;right:10%;height:3px;border-radius:99px;background:linear-gradient(90deg,#6366f1,#8b5cf6)}
.stat-card.green::before{background:linear-gradient(90deg,#059669,#34d399)}
.stat-card.orange::before{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.stat-card.pink::before{background:linear-gradient(90deg,#ec4899,#f472b6)}
.stat-num{font-size:1.8rem;font-weight:900;background:linear-gradient(120deg,#1a4fc4,#2b7cf0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:.7rem;color:var(--dim);font-weight:800;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.stat-icon{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:12px;background:#e0e7ff;color:#6366f1;display:flex;align-items:center;justify-content:center;font-size:1.1rem}

.data-table{background:#fff;border-radius:16px;border:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow)}
.data-table table{width:100%;border-collapse:collapse;font-size:.84rem;min-width:600px}
.data-table th{padding:12px 14px;text-align:left;font-weight:900;font-size:.68rem;text-transform:uppercase;color:#1e40af;background:#f0f6ff;border-bottom:2px solid rgba(59,130,246,.2);letter-spacing:.5px;white-space:nowrap}
.data-table td{padding:12px 14px;border-bottom:1px solid rgba(100,116,139,.08);vertical-align:middle}
.data-table tr:hover td{background:#f8faff}
.data-table img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.5px}
.badge.success{background:rgba(5,150,105,.15);color:#059669}
.badge.danger{background:rgba(220,38,38,.15);color:#dc2626}
.badge.warning{background:rgba(245,158,11,.15);color:#b45309}
.badge.info{background:rgba(59,130,246,.15);color:#1e40af}
.badge.purple{background:rgba(139,92,246,.15);color:#7c3aed}

.modal{position:fixed;inset:0;background:rgba(15,23,42,.9);backdrop-filter:blur(16px);z-index:1000;display:none;align-items:flex-start;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top,16px));overflow-y:auto}
.modal.open{display:flex}
.modal-card{background:#fff;border-radius:22px;padding:24px;max-width:640px;width:100%;margin:auto 0;max-height:calc(100dvh - 32px);overflow-y:auto;box-shadow:0 40px 90px -30px rgba(0,0,0,.5);animation:slideUp .35s cubic-bezier(.34,1.4,.64,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-header h3{font-size:1.1rem;font-weight:900;margin:0}
.modal-close{background:#f1f5f9;border:none;width:38px;height:38px;border-radius:50%;font-size:1rem;cursor:pointer;color:var(--dim)}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:.76rem;font-weight:800;color:var(--dim);margin-bottom:6px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:16px;background:#f8fafc;outline:none;color:var(--text)}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(99,102,241,.12)}
.form-row textarea{min-height:80px;resize:vertical}
.form-row-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions .btn{flex:1;justify-content:center}

.file-upload{width:100%;aspect-ratio:16/10;border:2.5px dashed rgba(99,102,241,.4);border-radius:14px;background:#f8fafc;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative;margin-bottom:14px}
.file-upload:hover{border-color:var(--primary);background:#eff6ff}
.file-upload img{width:100%;height:100%;object-fit:cover}
.file-upload-placeholder{text-align:center;padding:20px;color:var(--dim);font-weight:700;font-size:.82rem}
.file-upload-placeholder i{font-size:2.5rem;color:var(--primary);display:block;margin-bottom:8px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;padding:14px 24px;border-radius:50px;font-weight:800;font-size:.86rem;z-index:2000;box-shadow:0 20px 50px -12px rgba(99,102,241,.8);transition:transform .4s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:10px}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:linear-gradient(135deg,#059669,#34d399)}
.toast.error{background:linear-gradient(135deg,#dc2626,#ef4444)}

.empty-state{text-align:center;padding:60px 20px;color:var(--dim)}
.empty-state i{font-size:3rem;opacity:.3;display:block;margin-bottom:12px;color:var(--primary)}
.loading{text-align:center;padding:40px}
.spinner{width:32px;height:32px;border:3px solid rgba(99,102,241,.2);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:900px){
  .app-layout{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:76px;bottom:0;width:280px;z-index:50;transform:translateX(-100%);transition:transform .3s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .sidebar.open{transform:translateX(0)}
  .main-content{padding:16px}
  .content-header h2{font-size:1.15rem}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{padding:16px}
  .stat-num{font-size:1.4rem}
  .form-row-grid{grid-template-columns:1fr}
  .sidebar-toggle{display:flex!important}
}
.sidebar-toggle{display:none;background:rgba(255,255,255,.22);border:none;color:#fff;width:44px;height:44px;border-radius:12px;font-size:1.1rem;cursor:pointer;align-items:center;justify-content:center}
.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:49;display:none}
.sidebar-backdrop.show{display:block}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-icon">🔐</div>
    <h1>SKSBV Admin</h1>
    <p>Super Admin Access</p>
    <div class="login-error" id="loginError"></div>
    <input type="text" class="login-input" id="admUser" placeholder="Username" autocomplete="username">
    <input type="password" class="login-input" id="admPass" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')SK_ADMIN_login()">
    <button class="login-btn" onclick="SK_ADMIN_login()">Login →</button>
    <div class="login-back"><a href="sksbv.html">← Back to SKSBV</a></div>
  </div>
</div>

<div id="appScreen">
  <header class="app-header">
    <div class="app-header-left">
      <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
      <div class="app-logo">👑</div>
      <div>
        <h1>SKSBV Admin</h1>
        <small>Super Admin Panel</small>
      </div>
    </div>
    <button class="logout-btn" onclick="SK_ADMIN_logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
  </header>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">Overview</div>
      <div class="sidebar-nav">
        <button class="sidebar-item active" data-tab="dashboard" onclick="switchTab('dashboard')"><i class="fas fa-chart-pie"></i> Dashboard</button>
      </div>
      <div class="sidebar-section">📚 സാഹിത്യ സമാജം</div>
      <div class="sidebar-nav">
        <button class="sidebar-item" data-tab="programs" onclick="switchTab('programs')"><i class="fas fa-feather"></i> Literary Programs</button>
        <button class="sidebar-item" data-tab="registrations" onclick="switchTab('registrations')"><i class="fas fa-clipboard-check"></i> Registrations</button>
      </div>
      <div class="sidebar-section">People</div>
      <div class="sidebar-nav">
        <button class="sidebar-item" data-tab="members" onclick="switchTab('members')"><i class="fas fa-users"></i> Members</button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>

    <main class="main-content" id="mainContent">
      <div class="loading"><div class="spinner"></div><p>Loading...</p></div>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CFG = window.SKSBV_CONFIG || {};
const supabaseClient = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
let CURRENT_TAB = 'dashboard';
let ADMIN_SESSION = null;

function $(id){ return document.getElementById(id); }
function esc(s){ return s==null?'':String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function fmtDate(d){ if(!d)return'—'; try{const dt=new Date(d); if(isNaN(dt))return d; return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){return d;} }
function toast(msg, type='info'){
  const t = $('toast'); if(!t) return;
  t.className = 'toast ' + type + ' show';
  const icons = {success:'✅', error:'❌', info:'ℹ️'};
  t.innerHTML = `<span>${icons[type]||'ℹ️'}</span><span>${esc(msg)}</span>`;
  clearTimeout(window._toastT);
  window._toastT = setTimeout(()=>t.classList.remove('show'), 3000);
}
function confirmDel(msg){ return confirm(msg||'Delete this item?'); }

async function SK_ADMIN_login(){
  const u = $('admUser').value.trim();
  const p = $('admPass').value;
  const err = $('loginError');
  err.style.display = 'none';
  if(!u || !p){ err.textContent = 'Fill both fields'; err.style.display = 'block'; return; }

  if (u === CFG.ADMIN_USERNAME && p === CFG.ADMIN_PASSWORD){
    ADMIN_SESSION = {username: u, role: 'admin', ts: Date.now()};
    localStorage.setItem('sksbv_admin_session', JSON.stringify(ADMIN_SESSION));
    showApp();
    return;
  }
  err.textContent = '❌ Invalid credentials';
  err.style.display = 'block';
}

function SK_ADMIN_logout(){
  localStorage.removeItem('sksbv_admin_session');
  location.reload();
}

function showApp(){
  $('loginScreen').style.display = 'none';
  $('appScreen').style.display = 'block';
  loadTab('dashboard');
}

(function autoLogin(){
  const s = localStorage.getItem('sksbv_admin_session');
  if (s){
    try{
      ADMIN_SESSION = JSON.parse(s);
      if (Date.now() - ADMIN_SESSION.ts < 7*24*60*60*1000){
        showApp();
      } else {
        localStorage.removeItem('sksbv_admin_session');
      }
    }catch(e){}
  }
})();

function switchTab(tab){
  CURRENT_TAB = tab;
  document.querySelectorAll('.sidebar-item').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  if (window.innerWidth <= 900) toggleSidebar(false);
  loadTab(tab);
}
function toggleSidebar(force){
  const sb = $('sidebar'), bd = $('sidebarBackdrop');
  const open = force !== undefined ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  bd.classList.toggle('show', open);
}

function loadTab(tab){
  const el = $('mainContent');
  el.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading...</p></div>';
  const handler = TAB_HANDLERS[tab];
  if (handler) handler(el);
  else el.innerHTML = '<div class="empty-state"><i class="fas fa-wrench"></i><p>Tab not configured</p></div>';
}

async function loadTable(table, orderCol='id', ascending=true){
  try {
    const { data, error } = await supabaseClient.from(table).select('*').order(orderCol, {ascending});
    if (error) throw error;
    return data || [];
  } catch(e){
    console.warn('Load error:', e);
    return [];
  }
}

async function deleteRow(table, id){
  if (!confirmDel()) return;
  try {
    const { error } = await supabaseClient.from(table).delete().eq('id', id);
    if (error) throw error;
    toast('Deleted', 'success');
    loadTab(CURRENT_TAB);
  } catch(e){ toast('❌ '+e.message, 'error'); }
}

async function upsertRow(table, row, id){
  try {
    let r;
    if (id) r = await supabaseClient.from(table).update(row).eq('id', id);
    else r = await supabaseClient.from(table).insert(row);
    if (r.error) throw r.error;
    toast(id ? 'Updated' : 'Added', 'success');
    closeModal();
    loadTab(CURRENT_TAB);
    return true;
  } catch(e){
    toast('❌ '+e.message, 'error');
    return false;
  }
}

let MODAL_FORM_DATA = {};
function openModal(title, fields, existing, onSave){
  const modal = document.createElement('div');
  modal.className = 'modal open';
  modal.id = 'crudModal';
  const d = existing || {};
  MODAL_FORM_DATA = {fields, existing: d, onSave, table: onSave.table, id: d.id};

  const htmlFields = fields.map(f => renderField(f, d[f.name])).join('');

  modal.innerHTML = `
    <div class="modal-card">
      <div class="modal-header">
        <h3>${esc(title)}</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <form id="crudForm" onsubmit="event.preventDefault();saveCrud()">
        ${htmlFields}
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
        </div>
      </form>
    </div>
  `;
  modal.addEventListener('click', e => { if(e.target===modal) closeModal(); });
  document.body.appendChild(modal);
}
function closeModal(){
  const m = $('crudModal');
  if (m) m.remove();
}
function renderField(f, val){
  if (f.type === 'textarea'){
    return `<div class="form-row"><label>${esc(f.label)}${f.required?' *':''}</label>
      <textarea name="${f.name}" id="f_${f.name}" ${f.required?'required':''} placeholder="${esc(f.placeholder||'')}">${esc(val||'')}</textarea></div>`;
  }
  if (f.type === 'select'){
    return `<div class="form-row"><label>${esc(f.label)}${f.required?' *':''}</label>
      <select name="${f.name}" id="f_${f.name}" ${f.required?'required':''}>
        <option value="">— Select —</option>
        ${(f.options||[]).map(o=>`<option value="${esc(o.value)}" ${val==o.value?'selected':''}>${esc(o.label)}</option>`).join('')}
      </select></div>`;
  }
  if (f.type === 'file'){
    return `<div class="form-row"><label>${esc(f.label)}</label>
      <div class="file-upload" id="f_${f.name}_wrap" onclick="document.getElementById('f_${f.name}').click()">
        ${val ? `<img src="${esc(val)}">` : `<div class="file-upload-placeholder"><i class="fas fa-cloud-upload-alt"></i>${esc(f.placeholder||'Tap to upload')}</div>`}
      </div>
      <input type="file" id="f_${f.name}" accept="${f.accept||'image/*'}" style="display:none" onchange="SK_handleUpload(this,'${f.name}')">
      <input type="hidden" name="${f.name}" id="f_${f.name}_url" value="${esc(val||'')}">
    </div>`;
  }
  return `<div class="form-row"><label>${esc(f.label)}${f.required?' *':''}</label>
    <input type="${f.type||'text'}" name="${f.name}" id="f_${f.name}" value="${esc(val||'')}" ${f.required?'required':''} placeholder="${esc(f.placeholder||'')}"></div>`;
}
async function SK_handleUpload(input, fieldName){
  const file = input.files[0];
  if (!file) return;
  toast('Uploading...', 'info');
  try {
    const ext = (file.name.split('.').pop()||'jpg').toLowerCase();
    const fn = `sksbv_${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
    const { error } = await supabaseClient.storage.from(CFG.STORAGE_BUCKET).upload(fn, file);
    if (error) throw error;
    const { data } = supabaseClient.storage.from(CFG.STORAGE_BUCKET).getPublicUrl(fn);
    const url = data.publicUrl;
    $(`f_${fieldName}_url`).value = url;
    const wrap = $(`f_${fieldName}_wrap`);
    wrap.innerHTML = `<img src="${url}">`;
    toast('Uploaded ✅', 'success');
  } catch(e){
    toast('❌ '+e.message, 'error');
  }
}
async function saveCrud(){
  const { fields, existing, table, id } = MODAL_FORM_DATA;
  const row = {};
  fields.forEach(f => {
    if (f.type === 'file') row[f.name] = $(`f_${f.name}_url`).value || null;
    else row[f.name] = $(`f_${f.name}`).value.trim() || null;
  });
  await upsertRow(table, row, id);
}

function viewRegistrations(programId){
  switchTab('registrations');
  setTimeout(()=>{
    const f = document.getElementById('regFilterProgram');
    if (f){ f.value = programId; filterRegistrations(); }
  }, 400);
}

async function renderRegistrations(el){
  const [regRes, progRes] = await Promise.all([
    supabaseClient.from('sksbv_program_registrations').select('*').order('created_at', {ascending:false}),
    supabaseClient.from('sksbv_programs').select('id,title')
  ]);
  const regs = regRes.data || [];
  const programs = progRes.data || [];
  const progMap = {};
  programs.forEach(p => progMap[p.id] = p.title);

  const pending = regs.filter(r => r.status === 'pending').length;
  const approved = regs.filter(r => r.status === 'approved').length;
  const rejected = regs.filter(r => r.status === 'rejected').length;

  const typeIcons = {song:'🎵', speech:'🎤', poem:'📝', story:'📖', essay:'✍️', quran:'📖', other:'🌟'};
  const typeLabels = {song:'ഗാനം', speech:'പ്രസംഗം', poem:'കവിത', story:'കഥ', essay:'ലേഖനം', quran:'ഖുർആൻ', other:'മറ്റുള്ളവ'};

  el.innerHTML = `
    <div class="content-header">
      <div><h2>📋 Registrations</h2><p>${regs.length} total</p></div>
    </div>

    <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px;">
      <div class="stat-card orange"><div class="stat-num">${pending}</div><div class="stat-label">⏳ Pending</div></div>
      <div class="stat-card green"><div class="stat-num">${approved}</div><div class="stat-label">✅ Approved</div></div>
      <div class="stat-card pink"><div class="stat-num">${rejected}</div><div class="stat-label">❌ Rejected</div></div>
    </div>

    <div style="background:#fff;padding:14px;border-radius:12px;border:1px solid var(--border);margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;">
      <select id="regFilterProgram" onchange="filterRegistrations()" style="flex:1;min-width:180px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--border);font-family:inherit;font-size:14px;">
        <option value="all">All Programs</option>
        ${programs.map(p => `<option value="${p.id}">${esc(p.title)}</option>`).join('')}
      </select>
      <select id="regFilterStatus" onchange="filterRegistrations()" style="padding:9px 12px;border-radius:10px;border:1.5px solid var(--border);font-family:inherit;font-size:14px;">
        <option value="all">All Status</option>
        <option value="pending">⏳ Pending</option>
        <option value="approved">✅ Approved</option>
        <option value="rejected">❌ Rejected</option>
      </select>
    </div>

    <div id="regListWrap">
      ${regs.length === 0 ? '<div class="empty-state"><i class="fas fa-clipboard"></i><p>No registrations yet</p></div>' : renderRegList(regs, progMap, typeIcons, typeLabels)}
    </div>
  `;

  window._regsCache = regs;
  window._progMapCache = progMap;
  window._typeIconsCache = typeIcons;
  window._typeLabelsCache = typeLabels;
}

function renderRegList(regs, progMap, typeIcons, typeLabels){
  if (!regs || regs.length === 0) return '<div class="empty-state"><i class="fas fa-inbox"></i><p>No registrations</p></div>';
  return `<div style="display:flex;flex-direction:column;gap:10px;">
    ${regs.map(r => {
      const sc = r.status==='approved'?'success':r.status==='rejected'?'danger':'warning';
      const si = r.status==='approved'?'✅':r.status==='rejected'?'❌':'⏳';
      return `<div style="background:#fff;border-radius:14px;padding:14px;border:1px solid var(--border);border-left:4px solid ${r.status==='approved'?'#059669':r.status==='rejected'?'#dc2626':'#f59e0b'};">
        <div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap;">
          <div style="flex:1;min-width:180px;">
            <div style="font-weight:900;font-size:.92rem;margin-bottom:3px;">${typeIcons[r.item_type]||'📝'} ${esc(r.item_title)}</div>
            <div style="font-size:.72rem;color:var(--dim);font-weight:700;">
              👤 ${esc(r.member_name||'—')} • Class ${esc(r.member_class||'—')} • 🏷️ ${typeLabels[r.item_type]||r.item_type}
            </div>
            <div style="font-size:.72rem;color:#0891b2;font-weight:700;margin-top:4px;">📚 ${esc(progMap[r.program_id]||'—')}</div>
          </div>
          <span class="badge ${sc}">${si} ${r.status}</span>
        </div>
        ${r.item_description ? `<p style="font-size:.8rem;color:#475569;margin:0 0 10px;line-height:1.5;padding:10px;background:#f8fafc;border-radius:8px;">${esc(r.item_description)}</p>` : ''}
        ${r.admin_note ? `<div style="font-size:.74rem;color:#7c3aed;font-weight:700;margin-bottom:8px;"><i class="fas fa-comment"></i> Your note: ${esc(r.admin_note)}</div>` : ''}
        <div style="display:flex;gap:6px;flex-wrap:wrap;padding-top:8px;border-top:1px solid rgba(100,116,139,.08);">
          <small style="color:var(--dim);font-size:.68rem;align-self:center;flex:1;">⏱️ ${r.duration_minutes||'—'} min • ${fmtDate(r.created_at)}</small>
          ${r.status === 'pending' ? `
            <button class="btn btn-success btn-sm" onclick="approveRegistration(${r.id})">✅ Approve</button>
            <button class="btn btn-danger btn-sm" onclick="rejectRegistration(${r.id})">❌ Reject</button>
          ` : `<button class="btn btn-ghost btn-sm" onclick="deleteRow('sksbv_program_registrations',${r.id})">🗑️</button>`}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function filterRegistrations(){
  const progFilter = document.getElementById('regFilterProgram')?.value || 'all';
  const statusFilter = document.getElementById('regFilterStatus')?.value || 'all';
  let filtered = window._regsCache || [];
  if (progFilter !== 'all') filtered = filtered.filter(r => String(r.program_id) === String(progFilter));
  if (statusFilter !== 'all') filtered = filtered.filter(r => r.status === statusFilter);
  const wrap = document.getElementById('regListWrap');
  if (wrap) wrap.innerHTML = renderRegList(filtered, window._progMapCache, window._typeIconsCache, window._typeLabelsCache);
}

async function approveRegistration(id){
  try {
    const { data: reg } = await supabaseClient.from('sksbv_program_registrations').select('*').eq('id',id).single();
    const { data: prog } = await supabaseClient.from('sksbv_programs').select('title,program_date').eq('id',reg.program_id).single();
    await supabaseClient.from('sksbv_program_registrations').update({status:'approved', reviewed_at:new Date().toISOString()}).eq('id', id);
    
    // Notify member
    try {
      await supabaseClient.from('sksbv_notifications').insert({
        title: '✅ Literary Registration Approved',
        message: `നിങ്ങളുടെ "${reg.item_title}" (${reg.item_type}) — "${prog?.title}" program-ൽ approve ചെയ്തു! 📅 ${fmtDate(prog?.program_date)}`,
        target_type: 'member',
        target_member: reg.member_id
      });
    } catch(e){}
    
    toast('✅ Approved & notified', 'success');
    loadTab('registrations');
  } catch(e){ toast('❌ '+e.message, 'error'); }
}

async function rejectRegistration(id){
  const note = prompt('Rejection reason (optional — will be shown to student):');
  try {
    const { data: reg } = await supabaseClient.from('sksbv_program_registrations').select('*').eq('id',id).single();
    await supabaseClient.from('sksbv_program_registrations').update({
      status:'rejected', admin_note: note||null, reviewed_at: new Date().toISOString()
    }).eq('id', id);
    
    try {
      await supabaseClient.from('sksbv_notifications').insert({
        title: '❌ Registration Not Approved',
        message: `നിങ്ങളുടെ "${reg.item_title}" — ${note ? 'കാരണം: '+note : 'admin-മായി ബന്ധപ്പെടുക.'}`,
        target_type: 'member',
        target_member: reg.member_id
      });
    } catch(e){}
    
    toast('Rejected & notified', 'success');
    loadTab('registrations');
  } catch(e){ toast('❌ '+e.message, 'error'); }
}

  const data = await loadTable('sksbv_members', 'name');
  el.innerHTML = `
    <div class="content-header">
      <div><h2>👥 Members</h2><p>${data.length} members</p></div>
    </div>
    ${data.length === 0 ? '<div class="empty-state"><i class="fas fa-users"></i><p>No members</p></div>' : `

const TAB_HANDLERS = {
  dashboard: renderDashboard,
  programs: renderPrograms,
  registrations: renderRegistrations,
  members: renderMembers
};

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});
