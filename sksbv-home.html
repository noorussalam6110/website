<!doctype html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#140523">
<title>SKSBV — സാഹിത്യ സമാജം</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="sksbv-config.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --plum: #3a1258;
  --violet: #6d2c96;
  --coral: #f66d50;
  --gold: #f8b733;
  --paper: #fff9f3;
  --font: 'Anek Malayalam', system-ui, -apple-system, sans-serif;
}
body {
  min-width: 320px;
  font-family: var(--font);
  color: #fffaf4;
  background: #140523;
  overflow-x: hidden;
}

/* ═══ BACKGROUND ═══ */
.hero {
  position: relative;
  isolation: isolate;
  display: grid;
  min-height: 100svh;
  padding: 24px clamp(20px, 4vw, 60px) 32px;
  background: #140523 url('https://i.postimg.cc/zfSFL15X/sahithya-bg-jpg.png') center right / cover no-repeat;
  overflow: hidden;
}

/* ടെക്സ്റ്റ് വ്യക്തമായി കാണാൻ ഇടതുവശത്ത് ഡാർക്ക് ഓവർലേ */
.hero::before {
  position: absolute;
  z-index: -1;
  inset: 0;
  content: "";
  background: linear-gradient(90deg, 
    rgba(10, 2, 20, 0.95) 0%, 
    rgba(20, 5, 35, 0.85) 40%, 
    rgba(20, 5, 35, 0.2) 70%, 
    transparent 100%
  );
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  position: relative;
  z-index: 10;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  color: #fff;
  font-size: .85rem;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  text-decoration: none;
}
.brand-logo {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: #fff;
  padding: 3px;
  object-fit: contain;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
.brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1.2;
}
.brand-text span:first-child { font-size: 1rem; letter-spacing: .15em; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
.brand-text span:last-child { font-size: .65rem; color: #ffdd83; letter-spacing: .1em; }

.btn-top {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 24px;
  border: none;
  border-radius: 999px;
  background: #fffaf4;
  color: #3d1a61;
  font-family: inherit;
  font-weight: 900;
  font-size: .85rem;
  cursor: pointer;
  box-shadow: 0 10px 25px -10px rgba(255,255,255,0.3);
  transition: transform .2s, background .2s;
}
.btn-top:hover { transform: translateY(-2px); background: #ffdd83; }

/* ═══ MAIN CONTENT ═══ */
.hero-content {
  display: grid;
  grid-template-columns: minmax(320px, 1fr) 1fr;
  align-items: center;
  max-width: 1300px;
  width: 100%;
  margin: auto;
  position: relative;
  z-index: 2;
}

.intro { 
  max-width: 580px; 
  position: relative; 
  z-index: 5;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: .55rem;
  margin: 0 0 16px;
  color: #ffdd83;
  font-size: .85rem;
  font-weight: 800;
  letter-spacing: .18em;
  text-transform: uppercase;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}
.eyebrow::before { width: 30px; height: 2px; content: ""; background: currentColor; }

h1 {
  margin: 0;
  color: #fff;
  font-size: clamp(2.4rem, 5vw, 4.8rem);
  font-weight: 900;
  letter-spacing: -.04em;
  line-height: 1.05;
  text-shadow: 0 4px 20px rgba(0,0,0,0.6);
}
h1 em {
  display: block;
  color: #ffc864;
  font-family: Georgia, serif;
  font-weight: 600;
  font-style: italic;
  margin-top: 4px;
  text-shadow: 0 4px 20px rgba(0,0,0,0.8);
}

.subtitle {
  margin: 20px 0 0;
  max-width: 480px;
  font-size: clamp(1rem, 1.5vw, 1.15rem);
  color: rgba(255,250,244,.9);
  line-height: 1.6;
  font-weight: 600;
  text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}

/* ═══ STUDENT PROFILE CARD ═══ */
.student-card {
  display: inline-flex;
  align-items: center;
  gap: 16px;
  margin-top: 30px;
  padding: 14px 24px 14px 14px;
  background: rgba(20, 5, 35, 0.6);
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 24px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 15px 35px -10px rgba(0,0,0,.6);
}
.student-avatar {
  width: 60px;
  height: 60px;
  border-radius: 18px;
  overflow: hidden;
  background: linear-gradient(140deg, #f8b733, #f66d50);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 1.6rem;
  color: #3d1a61;
  flex-shrink: 0;
  border: 2px solid rgba(255,255,255,.5);
}
.student-avatar img { width: 100%; height: 100%; object-fit: cover; }
.student-info { display: flex; flex-direction: column; gap: 3px; }
.student-name { font-size: 1.15rem; font-weight: 900; color: #fff; line-height: 1.2; letter-spacing: .02em; }
.student-meta { font-size: .75rem; font-weight: 800; color: #ffdd83; letter-spacing: .05em; text-transform: uppercase; }
.student-uid {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
  padding: 4px 12px;
  background: rgba(248, 183, 51, 0.2);
  border: 1px solid rgba(248, 183, 51, 0.4);
  border-radius: 999px;
  font-family: 'Courier New', monospace;
  font-size: .75rem;
  font-weight: 900;
  color: #ffdd83;
  letter-spacing: 1px;
  width: fit-content;
}

/* ═══ ENTER BUTTON ═══ */
.cta-group { margin-top: 32px; }
.btn-enter {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 18px 36px;
  border: none;
  border-radius: 999px;
  background: linear-gradient(100deg, #ffc864, #f66d50);
  color: #3d1a61;
  font-family: inherit;
  font-weight: 900;
  font-size: 1.05rem;
  letter-spacing: .02em;
  cursor: pointer;
  box-shadow: 0 20px 40px -12px rgba(246,109,80,0.6);
  transition: transform .2s, box-shadow .2s;
}
.btn-enter:hover { transform: translateY(-3px); box-shadow: 0 25px 45px -12px rgba(246,109,80,0.8); }
.btn-enter i { font-size: 1rem; }

/* ═══ FLOATING IMAGE & NOTES ═══ */
.performance {
  position: relative;
  width: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 3;
  min-height: 400px;
}
.performance::after {
  position: absolute;
  bottom: 0;
  left: 10%;
  right: 10%;
  height: 40px;
  border-radius: 50%;
  content: "";
  background: rgba(0,0,0,.6);
  filter: blur(25px);
  z-index: 0;
}
.student-art {
  position: relative;
  width: 115%;
  max-width: 650px;
  height: auto;
  filter: drop-shadow(0 25px 35px rgba(0,0,0,.6));
  animation: floatArt 5s ease-in-out infinite;
  transform-origin: 50% 90%;
  z-index: 1;
}
@keyframes floatArt {
  0%, 100% { transform: translateY(0) rotate(-0.5deg); }
  50% { transform: translateY(-15px) rotate(0.5deg); }
}

/* ✨ Floating elements */
.float-el {
  position: absolute;
  z-index: 2;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(8px);
  color: #fff;
  box-shadow: 0 10px 20px rgba(0,0,0,0.3);
  animation: floatEl 4s ease-in-out infinite;
}
.el-1 { top: 5%; right: 15%; width: 50px; height: 50px; font-size: 1.4rem; animation-delay: -1s; }
.el-2 { top: 35%; left: 0%; width: 40px; height: 40px; font-size: 1rem; animation-delay: -2.5s; }
.el-3 { bottom: 20%; right: 5%; width: 45px; height: 45px; font-size: 1.1rem; color: #ffdd83; animation-delay: -0.5s; }
@keyframes floatEl {
  0%, 100% { transform: translateY(0) rotate(-10deg); opacity: 0.7; }
  50% { transform: translateY(-20px) rotate(10deg); opacity: 1; }
}

.footer-copy {
  align-self: end;
  margin-top: 30px;
  text-align: center;
  position: relative;
  z-index: 5;
  color: #ffdd83;
  font-size: clamp(.8rem, 1.2vw, .95rem);
  font-weight: 800;
  letter-spacing: .15em;
  text-transform: uppercase;
  text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}

/* ═══ MOBILE ═══ */
@media (max-width: 850px) {
  .hero { 
    padding: 16px 16px 24px; 
    background-position: center top; 
  }
  .hero::before {
    background: linear-gradient(180deg, 
      rgba(10, 2, 20, 0.95) 0%, 
      rgba(15, 3, 30, 0.85) 40%, 
      rgba(20, 5, 35, 0.5) 100%
    );
  }
  
  .brand-logo { width: 40px; height: 40px; }
  .brand-text span:first-child { font-size: .85rem; }
  .btn-top { padding: 10px 16px; font-size: .75rem; }
  
  .hero-content {
    grid-template-columns: 1fr;
    text-align: center;
    margin-top: 20px;
    gap: 10px;
  }
  .intro { margin: 0 auto; }
  .eyebrow { justify-content: center; font-size: .75rem; }
  .eyebrow::before { display: none; }
  h1 { font-size: clamp(2.2rem, 9vw, 3.2rem); }
  .subtitle { margin: 16px auto 0; font-size: .95rem; }
  
  .student-card {
    margin: 24px auto 0;
    text-align: left;
  }
  .cta-group { margin-top: 24px; }
  .btn-enter { padding: 16px 28px; font-size: .95rem; }
  
  /* മൊബൈലിൽ PNG ചിത്രവും ആനിമേഷനും കാണിക്കുന്നു */
  .performance { 
    display: flex; 
    margin-top: 20px;
    min-height: 250px;
  }
  .student-art { 
    width: 100%; 
    max-width: 400px; 
  }
  .el-1 { right: 5%; top: 5%; }
  .el-2 { left: 5%; top: 30%; }
  .el-3 { right: 5%; bottom: 15%; }
}
@media (max-width: 390px) {
  .brand-text { display: none; }
  .student-avatar { width: 50px; height: 50px; font-size: 1.3rem; }
  .student-name { font-size: 1rem; }
}
</style>
</head>
<body>
<main class="hero">
  <header class="topbar">
    <a class="brand" href="sksbv.html">
      <img class="brand-logo" src="https://i.postimg.cc/DznFT7L9/IMG-3167.png" alt="SKSBV Logo" onerror="this.style.display='none'">
      <div class="brand-text">
        <span>SKSBV</span>
        <span>Sahithya Samajam</span>
      </div>
    </a>
    <button class="btn-top" onclick="enterPortal()">
      Student Portal <i class="fas fa-arrow-right"></i>
    </button>
  </header>

  <section class="hero-content">
    <div class="intro">
      <p class="eyebrow">Arts & Literature Festival</p>
      <h1>Where voices <em>become memories.</em></h1>
      <p class="subtitle">Celebrating the joy of recitation, song, storytelling, and creative expression on one beautiful stage.</p>

      <!-- ലോഗിൻ ചെയ്ത കുട്ടിയുടെ വിവരങ്ങൾ -->
      <div class="student-card" id="studentCard" style="display: none;">
        <div class="student-avatar" id="studentAvatar">…</div>
        <div class="student-info">
          <div class="student-name" id="studentName">Loading…</div>
          <div class="student-meta" id="studentClass">Class —</div>
          <div class="student-uid" id="studentUid">
            <i class="fas fa-id-card"></i> —
          </div>
        </div>
      </div>

      <div class="cta-group">
        <button class="btn-enter" onclick="enterPortal()">
          Enter SKSBV Portal <i class="fas fa-arrow-right"></i>
        </button>
      </div>
    </div>

    <!-- 3 കുട്ടികളുടെ ഫ്ലോട്ടിംഗ് PNG ചിത്രം -->
    <div class="performance">
      <span class="float-el el-1">🎵</span>
      <span class="float-el el-2">📖</span>
      <span class="float-el el-3">✨</span>
      
      <!-- ചിത്രത്തിന്റെ പേര് sksbv-students.png എന്നാണെന്ന് ഉറപ്പാക്കുക -->
      <img class="student-art" src="sksbv-students.png" alt="SKSBV Students" onerror="this.style.display='none';">
    </div>
  </section>

  <p class="footer-copy">SKSBV · SAHITHYA SAMAJAM · NOORUSSALAM UNIT</p>
</main>

<script>
// സെഷൻ പരിശോധന (UID വീണ്ടും ചോദിക്കാതിരിക്കാൻ)
function getSession() {
  try { return JSON.parse(localStorage.getItem('noor_session')); }
  catch (e) { return null; }
}

const session = getSession();

if (session && session.studentId) {
  document.getElementById('studentCard').style.display = 'inline-flex';
  document.getElementById('studentName').textContent = session.name || 'Student';
  document.getElementById('studentClass').textContent = session.class ? 'Class ' + session.class : 'SKSBV Member';
  document.getElementById('studentUid').innerHTML = '<i class="fas fa-id-card"></i> ' + (session.studentId || '—');

  const av = document.getElementById('studentAvatar');
  if (session.photo) {
    av.innerHTML = `<img src="${session.photo}" alt="">`;
  } else {
    av.textContent = (session.name || 'S').charAt(0).toUpperCase();
  }
}

function enterPortal() {
  if (!session || !session.studentId) {
    window.location.href = 'login.html'; // സെഷൻ ഇല്ലെങ്കിൽ ലോഗിനിലേക്ക്
  } else {
    window.location.href = 'sksbv-member.html'; // സെഷൻ ഉണ്ടെങ്കിൽ നേരെ അകത്തേക്ക് (UID ചോദിക്കില്ല)
  }
}
</script>
</body>
</html>
