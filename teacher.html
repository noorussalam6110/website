<!-- 📢 TEACHER → ADMIN NOTIFICATION SYSTEM v140             -->
<!-- Password change, Login, Data saves → Super Admin alert  -->
<!-- ═══════════════════════════════════════════════════════ -->
<script id="teacher-admin-notify-v140">
(function(){
  'use strict';
  console.log('📢 Teacher→Admin Notify v140 loading...');

  // ─── Helpers ───
  function getDevice(){
    var ua = navigator.userAgent || '';
    if (/Android/i.test(ua)) return 'Android';
    if (/iPhone|iPad|iPod/i.test(ua)) return 'iOS';
    if (/Windows/i.test(ua)) return 'Windows';
    if (/Mac/i.test(ua)) return 'Mac';
    return 'Web';
  }
  function getTeacher(){
    return window.currentTeacher || (window.TV60 && window.TV60.teacher) || null;
  }
  function getClasses(){
    var t = getTeacher();
    return t ? ((t.classes || []).join(', ') || '—') : '—';
  }

  // ═══════════════════════════════════════════════════════
  // 🔔 CORE: notifyAdmin()
  // Inserts into notifications table with target_type='admin'
  // Students won't see these — only Super Admin
  // ═══════════════════════════════════════════════════════
  window.notifyAdmin = async function(opts){
    if (!opts || !opts.title) return false;
    if (typeof supabaseClient === 'undefined' || !supabaseClient) return false;

    var t = getTeacher();
    var payload = {
      title: opts.title,
      message: opts.message || '',
      type: opts.type || 'general',
      target_type: 'admin',           // ← Special marker for admin only
      target_class: null,
      target_student: null,
      link_url: opts.link || null
    };

    try {
      var r = await supabaseClient.from('notifications').insert(payload);
      if (r.error) throw r.error;
      console.log('✅ Admin notified:', opts.title, '| action:', opts.action || '-');
      return true;
    } catch(e) {
      console.warn('notifyAdmin failed:', e.message);
      return false;
    }
  };

  // ═══════════════════════════════════════════════════════
  // 🔑 MAIN: PASSWORD CHANGE → notify admin
  // Uses MutationObserver on the success box (reliable)
  // ═══════════════════════════════════════════════════════
  function hookPasswordChange(){
    var sucBox = document.getElementById('tsSuccessBox');
    if (!sucBox) { setTimeout(hookPasswordChange, 1500); return; }
    if (sucBox._v140watched) return;
    sucBox._v140watched = true;

    new MutationObserver(function(muts){
      muts.forEach(function(m){
        if (m.type === 'attributes' && m.attributeName === 'class') {
          if (sucBox.classList.contains('show')) {
            var t = getTeacher();
            if (!t) return;

            // Prevent duplicate notify (5s window)
            var key = 'pwd_notified_' + t.teacher_id + '_' + Math.floor(Date.now() / 5000);
            try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch(e) {}

            setTimeout(function(){
              notifyAdmin({
                title: '🔑 Teacher Password Changed',
                message:
                  '👨‍🏫 ' + t.name + '\n' +
                  '🆔 ID: ' + t.teacher_id + '\n' +
                  '📚 Class: ' + getClasses() + '\n' +
                  '📖 Subject: ' + (t.subject || '—') + '\n' +
                  '📱 Device: ' + getDevice() + '\n' +
                  '📅 ' + new Date().toLocaleString('en-IN', {
                    day: '2-digit', month: 'short', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                  }),
                type: 'important',
                action: 'password_change'
              });

              // Extra safety: log to teacher_login_logs as backup
              try {
                supabaseClient.from('teacher_login_logs').insert({
                  teacher_id: t.teacher_id,
                  name: t.name,
                  device: getDevice() + ' • Password Change',
                  user_agent: navigator.userAgent.substring(0, 200)
                });
              } catch(e) {}
            }, 300);
          }
        }
      });
    }).observe(sucBox, { attributes: true, attributeFilter: ['class'] });

    console.log('✅ Password change watcher ready');
  }

  // ═══════════════════════════════════════════════════════
  // 🟢 HOOK: Login → notify admin
  // ═══════════════════════════════════════════════════════
  var _origEnter = window.enterTeacherDashboard;
  if (typeof _origEnter === 'function' && !_origEnter._v140) {
    window.enterTeacherDashboard = async function(teacher){
      var r = await _origEnter.apply(this, arguments);
      if (teacher) {
        setTimeout(function(){
          notifyAdmin({
            title: '🟢 Teacher Login',
            message:
              '👨‍🏫 ' + teacher.name + '\n' +
              '🆔 ' + teacher.teacher_id + '\n' +
              '📚 Class: ' + ((teacher.classes || []).join(', ') || '—') + '\n' +
              '📱 ' + getDevice() + '\n' +
              '📅 ' + new Date().toLocaleString('en-IN', {
                day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
              }),
            type: 'general',
            action: 'login'
          });
        }, 1500);
      }
      return r;
    };
    window.enterTeacherDashboard._v140 = true;
    console.log('✅ Login hook active');
  }

  // ═══════════════════════════════════════════════════════
  // 🕐 HOOK: Timetable save
  // ═══════════════════════════════════════════════════════
  var _origTT = window.teacherTTSave;
  if (typeof _origTT === 'function' && !_origTT._v140) {
    window.teacherTTSave = async function(cls){
      var r = await _origTT.apply(this, arguments);
      var t = getTeacher();
      if (t) {
        setTimeout(function(){
          notifyAdmin({
            title: '🕐 Timetable Updated',
            message: '👨‍🏫 ' + t.name + ' (ID: ' + t.teacher_id + ') updated Class ' + cls + ' timetable',
            type: 'general',
            action: 'timetable_save'
          });
        }, 1800);
      }
      return r;
    };
    window.teacherTTSave._v140 = true;
    console.log('✅ Timetable save hook active');
  }

  // ═══════════════════════════════════════════════════════
  // 📅 HOOK: Attendance Save
  // ═══════════════════════════════════════════════════════
  function hookAttendanceSave(){
    var panel = document.getElementById('td60Panel');
    if (!panel || panel._v140att) return;
    panel._v140att = true;

    panel.addEventListener('click', function(e){
      var btn = e.target.closest('#td60AttSave');
      if (!btn) return;
      var t = getTeacher();
      if (!t) return;

      setTimeout(function(){
        var month = document.getElementById('td60AttMonth');
        var monthVal = month ? month.value : '?';
        notifyAdmin({
          title: '📆 Attendance Saved',
          message:
            '👨‍🏫 ' + t.name + '\n' +
            '📚 Class: ' + (window.TV60 && TV60.activeClass || '?') + '\n' +
            '📅 Month: ' + monthVal,
          type: 'general',
          action: 'attendance_save'
        });
      }, 2500);
    }, true);

    console.log('✅ Attendance save hook active');
  }

  // ═══════════════════════════════════════════════════════
  // 📝 HOOK: Marks Save
  // ═══════════════════════════════════════════════════════
  function hookMarksSave(){
    var panel = document.getElementById('td60Panel');
    if (!panel || panel._v140marks) return;
    panel._v140marks = true;

    panel.addEventListener('click', function(e){
      var btn = e.target.closest('#td60MarksSave');
      if (!btn) return;
      var t = getTeacher();
      if (!t) return;

      setTimeout(function(){
        var exam = document.getElementById('td60MarksExam');
        var examVal = exam ? exam.value : '?';
        notifyAdmin({
          title: '📝 Marks Saved',
          message:
            '👨‍🏫 ' + t.name + '\n' +
            '📚 Class: ' + (window.TV60 && TV60.activeClass || '?') + '\n' +
            '📝 Exam: ' + examVal,
          type: 'general',
          action: 'marks_save'
        });
      }, 2500);
    }, true);

    console.log('✅ Marks save hook active');
  }

  // ═══════════════════════════════════════════════════════
  // 📖 HOOK: Homework/Notice form submissions (via modal)
  // ═══════════════════════════════════════════════════════
  function watchModalForms(){
    var modalBody = document.getElementById('modalContentBody');
    if (!modalBody || modalBody._v140forms) return;
    modalBody._v140forms = true;

    new MutationObserver(function(){
      modalBody.querySelectorAll('form').forEach(function(form){
        if (form._v140formHooked) return;
        form._v140formHooked = true;

        form.addEventListener('submit', function(){
          var modal = document.getElementById('globalModal');
          var titleEl = document.getElementById('modalTitle');
          var titleText = titleEl ? titleEl.textContent.trim() : '';

          setTimeout(function(){
            if (modal && modal.style.display === 'none') {
              var t = getTeacher();
              if (!t) return;
              if (titleText.indexOf('Homework') > -1) {
                notifyAdmin({
                  title: '📖 Homework Added',
                  message: '👨‍🏫 ' + t.name + ' added homework in Class ' +
                           (window.TV60 && TV60.activeClass || '?'),
                  type: 'general',
                  action: 'homework_add'
                });
              } else if (titleText.indexOf('Notice') > -1) {
                notifyAdmin({
                  title: '📌 Notice Posted',
                  message: '👨‍🏫 ' + t.name + ' posted a notice in Class ' +
                           (window.TV60 && TV60.activeClass || '?'),
                  type: 'important',
                  action: 'notice_add'
                });
              }
            }
          }, 1200);
        });
      });
    }).observe(modalBody, { childList: true });

    console.log('✅ Modal form watcher ready');
  }

  // ═══════════════════════════════════════════════════════
  // 🧪 DEBUG helpers
  // ═══════════════════════════════════════════════════════
  window.NOTIFY_admin = async function(title, message, type, action){
    var r = await notifyAdmin({
      title: title || '🧪 Test from Teacher',
      message: message || 'Test notification',
      type: type || 'general',
      action: action || 'test'
    });
    if (typeof showToast === 'function') {
      showToast(r ? '✅ Sent to admin' : '❌ Failed', r ? 'success' : 'error');
    }
    return r;
  };

  window.NOTIFY_debug = function(){
    console.log('=== NOTIFY DEBUG v140 ===');
    console.log('Current teacher:', getTeacher());
    console.log('notifyAdmin ready:', typeof window.notifyAdmin === 'function');
  };

  // ═══════════════════════════════════════════════════════
  // 🚀 INIT
  // ═══════════════════════════════════════════════════════
  function init(){
    hookPasswordChange();
    watchModalForms();
    hookAttendanceSave();
    hookMarksSave();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){
      setTimeout(init, 1500);
      setTimeout(init, 3500);
    });
  } else {
    setTimeout(init, 1500);
    setTimeout(init, 3500);
  }

  // Safety net — re-hook periodic
  setInterval(hookPasswordChange, 5000);
  setInterval(watchModalForms, 5000);
  setInterval(hookAttendanceSave, 5000);
  setInterval(hookMarksSave, 5000);

  console.log('✅ Teacher→Admin Notify v140 ready');
  console.log('   💡 NOTIFY_admin("title","message") — manual test');
  console.log('   💡 NOTIFY_debug() — check status');
})();
</script>

<script id="complaints-teacher-js">
(function(){
  'use strict';
  console.log('📮 Complaints Teacher v1.0 loading...');

  var TST = {
    all: [],
    filter: 'pending',
    currentId: null
  };

  // ═══════════════════════════════════════════════════
  // 🎛️ ADD TAB BUTTON
  // ═══════════════════════════════════════════════════
  function addTab(){
    var tabsInner = document.getElementById('td60TabsInner');
    if (!tabsInner) return;
    if (tabsInner.querySelector('[data-tab="complaints"]')) return;

    var btn = document.createElement('button');
    btn.className = 'td60-tab';
    btn.dataset.tab = 'complaints';
    btn.innerHTML = '<i class="fas fa-envelope-open-text"></i> പരാതികൾ <span id="tstBadge" style="display:none;background:#dc2626;color:#fff;border-radius:50%;min-width:18px;height:18px;font-size:.6rem;font-weight:900;align-items:center;justify-content:center;margin-left:5px;padding:0 5px;"></span>';
    btn.onclick = function(){
      tabsInner.querySelectorAll('.td60-tab').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      window.TV60.activeTab = 'complaints';
      openComplaintsPanel();
    };
    tabsInner.appendChild(btn);

    console.log('✅ Complaints tab added');
  }

  // ═══════════════════════════════════════════════════
  // 📊 OPEN PANEL
  // ═══════════════════════════════════════════════════
  async function openComplaintsPanel(){
    var panel = document.getElementById('td60Panel');
    if (!panel) return;
    panel.innerHTML = '<div style="text-align:center;padding:30px;"><div class="td60-spinner"></div></div>';

    var teacher = window.currentTeacher || (window.TV60 && TV60.teacher);
    if (!teacher) {
      panel.innerHTML = '<div class="td60-empty">Teacher session missing</div>';
      return;
    }

    try {
      // Fetch complaints where target is this teacher
      var r = await supabaseClient.from('complaints')
        .select('*')
        .eq('target_id', teacher.teacher_id)
        .order('created_at', { ascending: false })
        .limit(200);
      TST.all = r.data || [];

      renderPanel(panel);
    } catch(e) {
      console.error('complaints load:', e);
      panel.innerHTML = '<div class="td60-empty">Error: ' + escapeHtml(e.message) + '</div>';
    }
  }

  function renderPanel(panel){
    var pending = TST.all.filter(function(c){ return c.status === 'pending'; }).length;
    var seen = TST.all.filter(function(c){ return c.status === 'seen'; }).length;
    var progress = TST.all.filter(function(c){ return c.status === 'in_progress'; }).length;
    var resolved = TST.all.filter(function(c){ return c.status === 'resolved' || c.status === 'closed'; }).length;

    var filtered = TST.all;
    if (TST.filter === 'pending') filtered = TST.all.filter(function(c){ return c.status === 'pending'; });
    else if (TST.filter === 'seen') filtered = TST.all.filter(function(c){ return c.status === 'seen'; });
    else if (TST.filter === 'in_progress') filtered = TST.all.filter(function(c){ return c.status === 'in_progress'; });
    else if (TST.filter === 'resolved') filtered = TST.all.filter(function(c){ return c.status === 'resolved' || c.status === 'closed'; });

    var h = '';

    // Stats
    h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px;">';
    h += statBox('📮 Total', TST.all.length, '#8b5cf6');
    h += statBox('🆕 Pending', pending, '#dc2626');
    h += statBox('👁️ Seen', seen, '#0891b2');
    h += statBox('⏳ Progress', progress, '#f59e0b');
    h += statBox('✅ Resolved', resolved, '#059669');
    h += '</div>';

    // Filter chips
    h += '<div style="display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;">';
    [['pending','🆕 Pending'],['seen','👁️ Seen'],['in_progress','⏳ Progress'],['resolved','✅ Resolved'],['all','📋 All']].forEach(function(f){
      var active = TST.filter === f[0] ? 'active' : '';
      var style = active ?
        'background:linear-gradient(100deg,#0891b2,#22d3ee);color:#fff;border-color:transparent;' :
        'background:#fff;color:#475569;border:1.5px solid rgba(100,116,139,.2);';
      h += '<button onclick="TST_FILTER(\'' + f[0] + '\')" style="' + style + 'padding:8px 14px;border-radius:20px;font-family:inherit;font-weight:800;font-size:.72rem;cursor:pointer;white-space:nowrap;min-height:36px;">' + f[1] + '</button>';
    });
    h += '</div>';

    // Privacy note
    h += '<div style="background:#ecfeff;border:1px solid rgba(8,145,178,.3);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.74rem;color:#0891b2;font-weight:700;line-height:1.55;">' +
      '<i class="fas fa-shield-alt"></i> ' +
      '<b>Confidential:</b> ഈ പരാതികൾ നിങ്ങൾക്ക് മാത്രം കാണാം. നിങ്ങൾ <b>Seen</b> അടിച്ചാൽ student-നു "Seen" badge കാണും.' +
    '</div>';

    // List
    if (!filtered.length) {
      h += '<div class="td60-empty"><i class="fas fa-inbox"></i><div>ഈ filter-ൽ പരാതികൾ ഇല്ല</div></div>';
    } else {
      h += '<div style="display:flex;flex-direction:column;gap:10px;">';
      filtered.forEach(function(c){
        var typeIcon = c.type === 'suggestion' ? '💡' : '😟';
        var typeLabel = c.type === 'suggestion' ? 'Suggestion' : 'Complaint';
        var typeColor = c.type === 'suggestion' ? '#0891b2' : '#dc2626';
        var statusBadge = {
          pending: '<span style="background:rgba(220,38,38,.15);color:#dc2626;padding:3px 10px;border-radius:20px;font-size:.6rem;font-weight:900;text-transform:uppercase;">🆕 New</span>',
          seen: '<span style="background:rgba(8,145,178,.15);color:#0891b2;padding:3px 10px;border-radius:20px;font-size:.6rem;font-weight:900;">👁️ Seen</span>',
          in_progress: '<span style="background:rgba(245,158,11,.15);color:#b45309;padding:3px 10px;border-radius:20px;font-size:.6rem;font-weight:900;">⏳ Progress</span>',
          resolved: '<span style="background:rgba(5,150,105,.15);color:#059669;padding:3px 10px;border-radius:20px;font-size:.6rem;font-weight:900;">✅ Resolved</span>',
          closed: '<span style="background:rgba(100,116,139,.15);color:#64748b;padding:3px 10px;border-radius:20px;font-size:.6rem;font-weight:900;">🔒 Closed</span>'
        }[c.status] || '';

        h += '<div onclick="TST_OPEN(' + c.id + ')" style="background:#fff;border:1.5px solid rgba(180,200,230,.5);border-left:4px solid ' + (c.status === 'pending' ? '#dc2626' : c.status === 'seen' ? '#0891b2' : c.status === 'in_progress' ? '#f59e0b' : '#059669') + ';border-radius:14px;padding:14px 16px;cursor:pointer;transition:all .2s;">' +
          '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px;">' +
            '<div style="font-weight:900;color:#0f172a;font-size:.9rem;flex:1;word-break:break-word;">' + typeIcon + ' ' + escapeHtml(c.subject) + '</div>' +
            statusBadge +
          '</div>' +
          '<div style="display:flex;gap:10px;font-size:.7rem;color:#64748b;font-weight:700;flex-wrap:wrap;">' +
            '<span><i class="fas fa-user"></i> ' + escapeHtml(c.is_anonymous ? '🕵️ Anonymous' : (c.student_name || '—')) + '</span>' +
            '<span><i class="fas fa-graduation-cap"></i> Class ' + escapeHtml(c.student_class || '—') + '</span>' +
            '<span><i class="far fa-clock"></i> ' + timeAgo(c.created_at) + '</span>' +
            '<span style="color:' + typeColor + ';background:' + typeColor + '15;padding:2px 8px;border-radius:20px;font-size:.62rem;">' + typeLabel + '</span>' +
          '</div>' +
          '<div style="font-size:.8rem;color:#475569;line-height:1.5;margin-top:8px;padding-top:8px;border-top:1px solid rgba(100,116,139,.08);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">' + escapeHtml(c.message) + '</div>' +
        '</div>';
      });
      h += '</div>';
    }

    panel.innerHTML = h;
    updateBadge();
  }

  function statBox(label, num, color){
    return '<div style="background:' + color + '10;border:1.5px solid ' + color + '40;border-radius:14px;padding:12px;text-align:center;">' +
      '<div style="font-size:1.5rem;font-weight:900;color:' + color + ';line-height:1;">' + num + '</div>' +
      '<div style="font-size:.64rem;color:#475569;margin-top:5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;">' + label + '</div>' +
    '</div>';
  }

  function updateBadge(){
    var cnt = TST.all.filter(function(c){ return c.status === 'pending'; }).length;
    var badge = document.getElementById('tstBadge');
    if (badge) {
      if (cnt > 0) {
        badge.textContent = cnt;
        badge.style.display = 'inline-flex';
      } else {
        badge.style.display = 'none';
      }
    }
  }

  window.TST_FILTER = function(f){
    TST.filter = f;
    var panel = document.getElementById('td60Panel');
    if (panel) renderPanel(panel);
  };

  // ═══════════════════════════════════════════════════
  // 📂 OPEN DETAIL MODAL
  // ═══════════════════════════════════════════════════
  window.TST_OPEN = async function(id){
    TST.currentId = id;
    var c = TST.all.find(function(x){ return x.id === id; });
    if (!c) return;

    // Auto-mark as seen if pending
    if (c.status === 'pending') {
      await markSeen(c);
    }

    var modal = document.getElementById('globalModal');
    var titleEl = document.getElementById('modalTitle');
    var bodyEl = document.getElementById('modalContentBody');
    if (!modal || !bodyEl) return;

    var teacher = window.currentTeacher || (window.TV60 && TV60.teacher);
    if (titleEl) titleEl.innerText = '📮 ' + (c.type === 'suggestion' ? 'Suggestion' : 'Complaint') + ' — ' + c.subject;

    bodyEl.innerHTML = '<div style="text-align:center;padding:30px;"><div class="spinner-sm" style="margin:0 auto;"></div></div>';
    modal.style.display = 'flex';

    try {
      var rr = await supabaseClient.from('complaint_replies')
        .select('*').eq('complaint_id', id)
        .order('created_at', { ascending: true });
      var replies = rr.data || [];

      var typeIcon = c.type === 'suggestion' ? '💡' : '😟';
      var typeLabel = c.type === 'suggestion' ? 'Suggestion' : 'Complaint';
      var typeColor = c.type === 'suggestion' ? '#0891b2' : '#dc2626';

      var html = '';
      // Header
      html += '<div style="background:linear-gradient(135deg,#ede9fe,#fce7f3);padding:16px;border-radius:16px;margin-bottom:16px;border:1.5px solid rgba(139,92,246,.3);">';
      html += '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px;">';
      html += '<h3 style="font-weight:900;color:#0f172a;font-size:1.1rem;margin:0;line-height:1.3;">' + typeIcon + ' ' + escapeHtml(c.subject) + '</h3>';
      html += '<span style="background:' + typeColor + '20;color:' + typeColor + ';padding:3px 10px;border-radius:20px;font-size:.62rem;font-weight:900;text-transform:uppercase;">' + typeLabel + '</span>';
      html += '</div>';
      html += '<div style="display:flex;gap:12px;font-size:.75rem;color:#64748b;font-weight:800;flex-wrap:wrap;">';
      html += '<span>👤 ' + escapeHtml(c.is_anonymous ? '🕵️ Anonymous' : (c.student_name || '—')) + '</span>';
      html += '<span>📚 Class ' + escapeHtml(c.student_class || '—') + '</span>';
      html += '<span>🕐 ' + formatDate(c.created_at) + '</span>';
      html += '</div>';
      html += '</div>';

      // Anonymous warning
      if (c.is_anonymous) {
        html += '<div style="background:#fef3c7;border:1.5px solid rgba(180,83,9,.35);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.76rem;color:#78350f;font-weight:700;">' +
          '<i class="fas fa-mask"></i> <b>Anonymous:</b> Student-ന്റെ പേര് hide ചെയ്തിരിക്കുന്നു. Actual ID Super Admin-നു മാത്രം കാണാം.' +
        '</div>';
      }

      // Message
      html += '<div style="background:#f8fafc;border-radius:14px;padding:16px;font-size:.9rem;line-height:1.7;color:#0f172a;white-space:pre-wrap;word-break:break-word;margin-bottom:16px;border:1px solid rgba(100,116,139,.12);">' + escapeHtml(c.message) + '</div>';

      // Status actions
      html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">';
      if (c.status !== 'in_progress' && c.status !== 'resolved' && c.status !== 'closed') {
        html += '<button onclick="TST_SETSTATUS(' + c.id + ',\'in_progress\')" style="padding:9px 14px;border-radius:10px;border:none;background:linear-gradient(100deg,#f59e0b,#fbbf24);color:#03132e;font-family:inherit;font-weight:800;font-size:.74rem;cursor:pointer;">⏳ In Progress</button>';
      }
      if (c.status !== 'resolved') {
        html += '<button onclick="TST_SETSTATUS(' + c.id + ',\'resolved\')" style="padding:9px 14px;border-radius:10px;border:none;background:linear-gradient(100deg,#059669,#34d399);color:#fff;font-family:inherit;font-weight:800;font-size:.74rem;cursor:pointer;">✅ Resolve</button>';
      }
      html += '</div>';

      // Replies
      html += '<div style="margin-top:16px;">';
      html += '<div style="font-weight:900;color:#0f172a;margin-bottom:12px;font-size:.9rem;"><i class="fas fa-comments" style="color:#8b5cf6;"></i> Replies (' + replies.length + ')</div>';

      if (!replies.length) {
        html += '<div style="text-align:center;padding:20px;color:#94a3b8;font-size:.82rem;font-style:italic;">No replies yet</div>';
      } else {
        replies.forEach(function(rep){
          var rc = rep.author_role === 'teacher' ? 'teacher' : rep.author_role === 'admin' ? 'admin' : 'student';
          var rl = rep.author_role === 'teacher' ? '👨‍🏫 Teacher' : rep.author_role === 'admin' ? '👑 Admin' : '👤 Student';
          var bgColors = { teacher:'#ecfeff', admin:'#fef2f2', student:'#f5f3ff' };
          var borderColors = { teacher:'#0891b2', admin:'#dc2626', student:'#8b5cf6' };
          html += '<div style="background:' + bgColors[rc] + ';border:1px solid rgba(100,116,139,.12);border-left:3px solid ' + borderColors[rc] + ';border-radius:12px;padding:12px 14px;margin-bottom:10px;">' +
            '<div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap;">' +
              '<div style="font-weight:900;color:#0f172a;font-size:.82rem;">' + escapeHtml(rep.author_name || '—') + ' <span style="font-size:.6rem;color:#64748b;font-weight:800;">' + rl + '</span></div>' +
              '<div style="font-size:.66rem;color:#94a3b8;font-weight:700;">' + timeAgo(rep.created_at) + '</div>' +
            '</div>' +
            '<div style="font-size:.84rem;color:#475569;line-height:1.55;white-space:pre-wrap;word-break:break-word;">' + escapeHtml(rep.reply_text) + '</div>' +
          '</div>';
        });
      }

      // Reply input
      if (c.status !== 'closed') {
        html += '<div style="display:flex;gap:8px;align-items:center;background:#f1f5f9;border:1.5px solid rgba(100,116,139,.2);border-radius:30px;padding:5px 5px 5px 16px;margin-top:12px;">' +
          '<input type="text" id="tstReplyInput" placeholder="മറുപടി എഴുതുക..." maxlength="500" style="flex:1;background:transparent;border:none;outline:none;font-family:inherit;font-size:16px;color:#0f172a;padding:8px 0;min-width:0;">' +
          '<button onclick="TST_SENDREPLY()" style="width:42px;height:42px;border-radius:50%;border:none;background:linear-gradient(140deg,#8b5cf6,#a855f7);color:#fff;font-size:.95rem;cursor:pointer;flex-shrink:0;"><i class="fas fa-paper-plane"></i></button>' +
        '</div>';
      }
      html += '</div>';

      bodyEl.innerHTML = html;
    } catch(e) {
      bodyEl.innerHTML = '<div style="color:#dc2626;padding:20px;">Error: ' + escapeHtml(e.message) + '</div>';
    }
  };

  // ═══════════════════════════════════════════════════
  // 👁️ MARK SEEN
  // ═══════════════════════════════════════════════════
  async function markSeen(c){
    if (c.status !== 'pending') return;
    var teacher = window.currentTeacher || (window.TV60 && TV60.teacher);
    if (!teacher) return;
    try {
      await supabaseClient.from('complaints').update({
        status: 'seen',
        seen_at: new Date().toISOString(),
        seen_by: teacher.teacher_id,
        seen_by_name: teacher.name,
        updated_at: new Date().toISOString()
      }).eq('id', c.id);
      c.status = 'seen';
      c.seen_by_name = teacher.name;
      c.seen_at = new Date().toISOString();
      // Update badge
      updateBadge();
      var panel = document.getElementById('td60Panel');
      if (panel && window.TV60 && TV60.activeTab === 'complaints') renderPanel(panel);
      console.log('✅ Marked seen:', c.id);
    } catch(e) { console.warn('markSeen:', e); }
  }

  // ═══════════════════════════════════════════════════
  // 🔄 SET STATUS
  // ═══════════════════════════════════════════════════
  window.TST_SETSTATUS = async function(id, status){
    if (!confirm('Status change to ' + status + '?')) return;
    try {
      var upd = { status: status, updated_at: new Date().toISOString() };
      if (status === 'resolved') {
        var teacher = window.currentTeacher || (window.TV60 && TV60.teacher);
        upd.resolved_at = new Date().toISOString();
        upd.resolved_by = teacher ? teacher.teacher_id : 'teacher';
      }
      await supabaseClient.from('complaints').update(upd).eq('id', id);
      showToast('✅ Status updated', 'success');
      if (typeof confetti !== 'undefined' && status === 'resolved') {
        confetti({ particleCount: 60, spread: 70, origin: { y: .7 } });
      }
      await openComplaintsPanel();
      closeModal('globalModal');
    } catch(e) { showToast('❌ ' + e.message, 'error'); }
  };

  // ═══════════════════════════════════════════════════
  // 💬 SEND REPLY
  // ═══════════════════════════════════════════════════
  window.TST_SENDREPLY = async function(){
    if (!TST.currentId) return;
    var inp = document.getElementById('tstReplyInput');
    var text = (inp && inp.value || '').trim();
    if (!text) return;

    var teacher = window.currentTeacher || (window.TV60 && TV60.teacher);
    if (!teacher) { showToast('❌ Session missing', 'error'); return; }

    inp.value = '';
    try {
      await supabaseClient.from('complaint_replies').insert({
        complaint_id: TST.currentId,
        author_id: teacher.teacher_id,
        author_name: teacher.name,
        author_role: 'teacher',
        reply_text: text
      });

      // Notify student
      try {
        var c = TST.all.find(function(x){ return x.id === TST.currentId; });
        if (c && c.studentid) {
          await supabaseClient.from('notifications').insert({
            title: '💬 പരാതിക്ക് മറുപടി',
            message: 'നിങ്ങളുടെ "' + (c.subject || '') + '" എന്ന പരാതിക്ക് ' + teacher.name + ' മറുപടി നൽകി.',
            type: 'important',
            target_type: 'student',
            target_student: c.studentid,
            link_url: null
          });
        }
      } catch(e) {}

      showToast('✅ Reply sent', 'success');
      TST_OPEN(TST.currentId);
    } catch(e) { showToast('❌ ' + e.message, 'error'); }
  };

  // ═══════════════════════════════════════════════════
  // 🚀 INIT
  // ═══════════════════════════════════════════════════
  function init(){ addTab(); }

  var td = document.getElementById('teacherDashboardV60');
  if (td) {
    new MutationObserver(function(){
      if (td.classList.contains('open')) {
        setTimeout(init, 800);
        setTimeout(init, 2500);
      }
    }).observe(td, { attributes: true, attributeFilter: ['class'] });
  }

  // Hook enterTeacherDashboard
  var _orig = window.enterTeacherDashboard;
  if (typeof _orig === 'function' && !_orig._cmp) {
    window.enterTeacherDashboard = async function(t){
      var r = await _orig.apply(this, arguments);
      setTimeout(init, 2000);
      // Preload for badge
      setTimeout(function(){
        if (window.TV60 && TV60.teacher) {
          supabaseClient.from('complaints').select('id', { count: 'exact', head: true })
            .eq('target_id', TV60.teacher.teacher_id).eq('status', 'pending')
            .then(function(res){
              var badge = document.getElementById('tstBadge');
              if (badge && res.count > 0) {
                badge.textContent = res.count;
                badge.style.display = 'inline-flex';
              }
            });
        }
      }, 3000);
      return r;
    };
    window.enterTeacherDashboard._cmp = true;
  }

  setTimeout(init, 2500);

  console.log('✅ Complaints Teacher v1.0 ready');
})();
</script>

<script id="teacher-enhance-v200-js">
(function(){
  'use strict';
  console.log('🚀 Teacher Enhancement v200 loading...');

  // ═══════════════════════════════════════════════════════
  // 🛠️ SHARED HELPERS
  // ═══════════════════════════════════════════════════════
  function $id(id){ return document.getElementById(id); }
  function esc(s){
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function(m){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m];
    });
  }
  function toast(m,t){ if (typeof showToast === 'function') showToast(m,t); }
  function getTeacher(){
    return window.currentTeacher || (window.TV60 && window.TV60.teacher) || null;
  }
  function getActiveClass(){
    return (window.TV60 && window.TV60.activeClass) || null;
  }
  function fmtDate(d){
    if (!d) return '—';
    try { return new Date(d).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' }); }
    catch(e) { return d; }
  }

  // ═══════════════════════════════════════════════════════
  // 📖 HOMEWORK — Full Panel with Edit/Delete
  // ═══════════════════════════════════════════════════════
  window.TD200_renderHomework = async function(cls){
    var panel = $id('td60Panel');
    if (!panel) return;
    panel.innerHTML = '<div style="text-align:center;padding:30px;"><div class="td60-spinner"></div></div>';

    try {
      var r = await supabaseClient.from('homework')
        .select('*').eq('class', cls)
        .order('due_date', { ascending: false })
        .limit(100);
      var list = r.data || [];

      // Stats
      var today = new Date().toISOString().split('T')[0];
      var overdue = list.filter(function(h){ return h.due_date && h.due_date < today; }).length;
      var upcoming = list.filter(function(h){ return h.due_date && h.due_date >= today; }).length;

      var h = '';

      // Bulk action bar
      h += '<div class="td60-bulk-bar">' +
        '<span class="label"><i class="fas fa-bolt"></i> Actions</span>' +
        '<button class="td60-bulk-btn primary" onclick="TD200_openHwForm(null, \'' + cls + '\')">' +
          '<i class="fas fa-plus"></i> പുതിയ Homework</button>' +
        '<button class="td60-bulk-btn" onclick="TD200_renderHomework(\'' + cls + '\')">' +
          '<i class="fas fa-sync-alt"></i> Refresh</button>' +
        '<div style="flex:1;"></div>' +
        '<button class="td60-bulk-btn danger" onclick="TD200_deleteAllOverdue(\'' + cls + '\')" title="Delete overdue">' +
          '<i class="fas fa-broom"></i> Clear Overdue</button>' +
      '</div>';

      // Mini stats
      h += '<div class="td60-mini-stats">' +
        '<div class="td60-mini-stat"><div class="n" style="color:#0891b2;">' + list.length + '</div><div class="l">Total</div></div>' +
        '<div class="td60-mini-stat"><div class="n" style="color:#b45309;">' + upcoming + '</div><div class="l">Upcoming</div></div>' +
        '<div class="td60-mini-stat"><div class="n" style="color:#dc2626;">' + overdue + '</div><div class="l">Overdue</div></div>' +
      '</div>';

      if (!list.length) {
        h += '<div class="td60-empty"><i class="fas fa-book"></i>No homework yet</div>';
      } else {
        list.forEach(function(hw){
          var isOverdue = hw.due_date && hw.due_date < today;
          var accent = isOverdue ? '#dc2626' : '#0891b2';
          h += '<div class="td60-hw-card" style="background:#f8fafc;border-left:4px solid ' + accent + ';border-radius:12px;padding:12px 14px;margin-bottom:8px;">' +
            '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;">' +
              '<strong style="color:#0f172a;">' + esc(hw.subject || '') + ' — ' + esc(hw.title) + '</strong>' +
              '<small style="color:#64748b;"><i class="far fa-calendar"></i> ' + fmtDate(hw.due_date) + (isOverdue ? ' ⚠️ Overdue' : '') + '</small>' +
            '</div>' +
            (hw.description ? '<div style="margin-top:6px;color:#475569;font-size:.82rem;line-height:1.5;">' + esc(hw.description) + '</div>' : '') +
            '<div class="td60-card-actions">' +
              '<button class="td60-card-btn edit" onclick="TD200_openHwForm(' + hw.id + ', \'' + cls + '\')">' +
                '<i class="fas fa-pen"></i> Edit</button>' +
              '<button class="td60-card-btn delete" onclick="TD200_deleteHw(' + hw.id + ', \'' + cls + '\')">' +
                '<i class="fas fa-trash"></i> Delete</button>' +
            '</div>' +
          '</div>';
        });
      }

      panel.innerHTML = h;

        var row = [i + 1, s.roll || '—', s.name || ''];
        var tot = 0, maxTot = 0;
        subjects.forEach(function(sub){
          var v = (mmap[s.studentid] || {})[sub];
          row.push(v != null ? v : '—');
          if (v != null) { tot += Number(v); maxTot += 50; }
        });
        row.push(maxTot > 0 ? tot + '/' + maxTot : '—');
        return row;
      });

      doc.autoTable({
        startY: 125,
        head: head,
        body: rows,
        theme: 'grid',
        styles: { fontSize: 8, cellPadding: 4 },
        headStyles: { fillColor: [8, 145, 178], textColor: 255, fontStyle: 'bold', halign: 'center' },
        columnStyles: {

          2: { cellWidth: 130 },
          [head[0].length - 1]: { halign: 'center', fontStyle: 'bold', textColor: [5, 150, 105] }
        }
      });

      doc.setFontSize(8);
      doc.setTextColor(150, 150, 150);
      doc.text('Computer-generated report', pw / 2, ph - 18, { align: 'center' });

      var safeExam = exam.replace(/\s+/g, '_');
      doc.save('Marks_Class' + cls + '_' + safeExam + '.pdf');

      if (typeof confetti !== 'undefined') confetti({ particleCount: 80, spread: 70, origin: { y: .7 } });

  // ─── Student List PDF ───
  window.TD200_studentListPDF = async function(){

    if (!cls) { toast('❌ Class select ചെയ്യൂ', 'error'); return; }
    if (!checkPDFLibs()) return;

    if (typeof showLoading === 'function') showLoading(true);
    try {

      doc.setFillColor(8, 145, 178);

      doc.text('Computer-generated report', pw / 2, ph - 18, { align: 'center' });

    } catch(e) {

    if (typeof showLoading === 'function') showLoading(false);

  // ─── Individual Student Report PDF ───
  window.TD200_studentReportPDF = async function(sid){
    if (!sid) { toast('❌ Student ID missing', 'error'); return; }
    if (!checkPDFLibs()) return;

    if (typeof showLoading === 'function') showLoading(true);
    try {
      var sr = await supabaseClient.from('students').select('*').eq('studentid', sid).maybeSingle();
      var s = sr.data;
      if (!s) throw new Error('Student not found');

      var mr = await supabaseClient.from('exam_marks').select('*').eq('studentid', sid);
      var ar = await supabaseClient.from('attendance_records').select('*').eq('studentid', sid);
      var marks = mr.data || [];
      var atts = ar.data || [];

      var jsPDF = window.jspdf.jsPDF;
      var doc = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4' });
      var pw = doc.internal.pageSize.getWidth();
      var ph = doc.internal.pageSize.getHeight();

      // Header
      doc.setFillColor(139, 92, 246);
      doc.rect(0, 0, pw, 70, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(16);
      doc.setFont(undefined, 'bold');
      doc.text('Student Report', pw / 2, 35, { align: 'center' });

      // Student info
      doc.setTextColor(0, 0, 0);
      doc.setFontSize(12);
      doc.setFont(undefined, 'bold');
      doc.text(String(s.name || '—'), 40, 105);
      doc.setFontSize(9);
      doc.setFont(undefined, 'normal');
      doc.text('Class ' + (s.class || '—') + ' • Roll ' + (s.roll || '—') + ' • ID: ' + (s.studentid || ''), 40, 122);

      // Stats
      var totalMarks = 0, totalMax = 0;
      marks.forEach(function(m){
        if (Number(m.max_marks) > 0) {
          totalMarks += Number(m.obtained_marks) || 0;
          totalMax += Number(m.max_marks) || 0;
        }
      });
      var pct = totalMax > 0 ? Math.round(totalMarks / totalMax * 100) : 0;

      var totalPres = 0, totalDays = 0;
      atts.forEach(function(a){
        totalPres += Number(a.present_days) || 0;
        totalDays += Number(a.total_days) || 0;
      });
      var attPct = totalDays > 0 ? Math.round(totalPres / totalDays * 100) : 0;

      // Summary box
      doc.setFillColor(240, 245, 255);
      doc.rect(40, 140, pw - 80, 60, 'F');
      doc.setFontSize(11);
      doc.setFont(undefined, 'bold');
      doc.text('Academic Score:', 55, 165);
      doc.setFont(undefined, 'normal');
      doc.text(pct + '%  (' + totalMarks + '/' + totalMax + ')', 180, 165);
      doc.setFont(undefined, 'bold');
      doc.text('Attendance:', 55, 185);
      doc.setFont(undefined, 'normal');
      doc.text(attPct + '%  (' + totalPres + '/' + totalDays + ')', 180, 185);

      // Marks table
      if (marks.length > 0) {
        var rows = marks.map(function(m){
          var mx = Number(m.max_marks) || 0;
          var ob = Number(m.obtained_marks) || 0;
          var g = 'D';
          if (mx > 0) {
            var score = (ob / mx) * 50;
            if (score >= 45) g = 'A+'; else if (score >= 40) g = 'A';
            else if (score >= 35) g = 'B+'; else if (score >= 30) g = 'B';
            else if (score >= 25) g = 'C+'; else if (score >= 20) g = 'C';
            else if (score >= 18) g = 'D+';
          }
          return [m.exam_name || '', m.subject || '', ob + '/' + mx, g];
        });

        doc.autoTable({
          startY: 220,
          head: [['Exam', 'Subject', 'Marks', 'Grade']],
          body: rows,
          theme: 'grid',
          styles: { fontSize: 9, cellPadding: 5 },
          headStyles: { fillColor: [139, 92, 246], textColor: 255, fontStyle: 'bold' },
          columnStyles: {
            0: { cellWidth: 140 },
            1: { cellWidth: 'auto' },
            2: { cellWidth: 80, halign: 'center', fontStyle: 'bold' },
            3: { cellWidth: 60, halign: 'center', fontStyle: 'bold' }
          }
        });
      }

      doc.setFontSize(8);
      doc.setTextColor(150, 150, 150);
      doc.text('Computer-generated report', pw / 2, ph - 18, { align: 'center' });

      var safeName = String(s.name || 'report').replace(/\s+/g, '_');
      doc.save('Student_' + safeName + '_' + s.studentid + '.pdf');
      toast('✅ Report downloaded', 'success');
      if (typeof confetti !== 'undefined') confetti({ particleCount: 100, spread: 80, origin: { y: .7 } });
    } catch(e) {
      console.error('Student Report PDF:', e);
      toast('❌ ' + (e.message || 'PDF error'), 'error');
    }
    if (typeof showLoading === 'function') showLoading(false);
  };

  // ═══════════════════════════════════════════════════════
  // 🔄 LIVE DATA SYNC — Auto-refresh on admin changes
  // ═══════════════════════════════════════════════════════
  var _liveChannel = null;
  var _liveDebounce = null;
  var LIVE_TABLES = ['homework', 'notice_board', 'exam_marks', 'attendance_records', 'timetable', 'namaz_log'];
  var REFRESH_TABS = ['homework', 'notice', 'students', 'timetable', 'namaz'];

  function attachLiveSync(){
    var teacher = getTeacher();
    var cls = getActiveClass();
    if (!teacher || !cls) return;
    if (typeof supabaseClient === 'undefined' || !supabaseClient) return;

    if (_liveChannel) {
      try { supabaseClient.removeChannel(_liveChannel); } catch(e) {}
      _liveChannel = null;
    }

    try {
      _liveChannel = supabaseClient.channel('teacher_live_' + teacher.teacher_id);
      LIVE_TABLES.forEach(function(tbl){
        _liveChannel = _liveChannel.on('postgres_changes',
          { event: '*', schema: 'public', table: tbl },
          function(){ scheduleRefresh(); });
      });
      _liveChannel.subscribe();
      console.log('✅ Live sync attached');
    } catch(e) { console.warn('Live sync error:', e); }
  }

  function scheduleRefresh(){
    if (_liveDebounce) clearTimeout(_liveDebounce);
    _liveDebounce = setTimeout(function(){
      _liveDebounce = null;
      var tab = window.TV60 && window.TV60.activeTab;
      if (!tab) return;
      // Skip if user is typing
      var active = document.activeElement;
      if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;

      if (tab === 'homework') TD200_renderHomework(getActiveClass());
      else if (tab === 'notice') TD200_renderNotice(getActiveClass());
      else if (REFRESH_TABS.indexOf(tab) > -1) {
        var tabBtn = document.querySelector('.td60-tab[data-tab="' + tab + '"]');
        if (tabBtn && !tabBtn._dontRefresh) tabBtn.click();
      }
    }, 2500);
  }

  // Attach on class change
  var _origOpenClass = window.openClass;
  // openClass is not exposed, so watch the panel

  // ═══════════════════════════════════════════════════════
  // 📤 EXPORT DROPDOWN
  // ═══════════════════════════════════════════════════════
  window.TD200_toggleExportMenu = function(btn){
    var menu = btn.parentNode.querySelector('.td60-export-menu');
    if (!menu) return;
    var isOpen = menu.classList.contains('show');
    document.querySelectorAll('.td60-export-menu.show').forEach(function(m){ m.classList.remove('show'); });
    if (!isOpen) menu.classList.add('show');
  };

  // Close on outside click
  document.addEventListener('click', function(e){
    if (e.target.closest('.td60-export-wrap')) return;
    document.querySelectorAll('.td60-export-menu.show').forEach(function(m){ m.classList.remove('show'); });
  });

  // ═══════════════════════════════════════════════════════
  // 🐛 DEBUG
  // ═══════════════════════════════════════════════════════
  window.TD200_debug = function(){
    console.log('=== TEACHER ENHANCE v200 DEBUG ===');
    console.log('Teacher:', getTeacher());
    console.log('Active class:', getActiveClass());
    console.log('Active tab:', window.TV60 && window.TV60.activeTab);
    console.log('Live channel:', _liveChannel ? 'attached' : 'none');
    console.log('PDF libs:', typeof window.jspdf !== 'undefined');
  };

  // ═══════════════════════════════════════════════════════
  // 🚀 INIT
  // ═══════════════════════════════════════════════════════
  function init(){
    // Attach live sync when teacher enters
    if (getTeacher()) {
      setTimeout(attachLiveSync, 2000);
    }
  }

  // Hook enterTeacherDashboard
  var _origEnter = window.enterTeacherDashboard;
  if (typeof _origEnter === 'function' && !_origEnter._v200) {
    window.enterTeacherDashboard = async function(t){
      var r = await _origEnter.apply(this, arguments);
      setTimeout(attachLiveSync, 2500);
      return r;
    };
    window.enterTeacherDashboard._v200 = true;
  }

  // Watch for teacher dashboard opening
  var td = $id('teacherDashboardV60');
  if (td) {
    new MutationObserver(function(){
      if (td.classList.contains('open')) {
        setTimeout(attachLiveSync, 2000);
      }
    }).observe(td, { attributes: true, attributeFilter: ['class'] });
  }

  setTimeout(init, 3000);
  setTimeout(init, 6000);

  console.log('✅ Teacher Enhancement v200 ready');
  console.log('   💡 TD200_debug() — check status');
  console.log('   💡 TD200_attendancePDF() — download');
  console.log('   💡 TD200_marksPDF() — download');
  console.log('   💡 TD200_studentListPDF() — download');
  console.log('   💡 TD200_studentReportPDF(sid) — single student');
})();
</script>

<script id="teacher-xp-reward-js">
(function(){
  'use strict';
  console.log('🎁 Teacher XP Reward v1.0 loading...');

  // ═══════════════════════════════════════════════════════
  // 🌐 STATE
  // ═══════════════════════════════════════════════════════
  var TXP = {
    students: [],           // Student list with XP
    xpMap: {},              // studentid → { xp, level, total_earned }
    selected: new Set(),    // Selected student IDs
    amount: 0,              // Selected XP amount
    reason: '',
    class_: null,
    recent: []              // Recent awards (this session)
  };
  window.TXP_STATE = TXP;

  // ═══════════════════════════════════════════════════════
  // 🎯 LEVEL MATH (matches v28/v126 XP system)
  // ═══════════════════════════════════════════════════════
  function totalXPForLevel(n){ return (n * (n + 1) / 2) * 100; }
  function levelFromTotalXP(t){
    var lvl = 1;
    while (totalXPForLevel(lvl + 1) <= t) lvl++;
    return lvl;
  }
  function progressForTotal(total){
    var lvl = levelFromTotalXP(total);
    var start = totalXPForLevel(lvl);
    var end = totalXPForLevel(lvl + 1);
    return {
      level: lvl,
      xp: total - start,
      needed: end - start,
      percent: Math.min(100, Math.round((total - start) / (end - start) * 100))
    };
  }

  // ═══════════════════════════════════════════════════════
  // 🎨 TOAST
  // ═══════════════════════════════════════════════════════
  function txpToast(msg, type){
    var old = document.querySelector('.txp-toast');
    if (old) old.remove();
    var t = document.createElement('div');
    t.className = 'txp-toast';
    var icon = type === 'error' ? '❌' : type === 'info' ? 'ℹ️' : '✅';
    t.innerHTML = '<span class="icon">' + icon + '</span><span>' + msg + '</span>';
    if (type === 'error') t.style.background = 'linear-gradient(135deg, #dc2626, #ef4444)';
    document.body.appendChild(t);
    setTimeout(function(){ t.classList.add('show'); }, 30);
    setTimeout(function(){
      t.classList.remove('show');
      setTimeout(function(){ t.remove(); }, 500);
    }, 3200);
  }

  // ═══════════════════════════════════════════════════════
  // 🎛️ ADD TAB BUTTON
  // ═══════════════════════════════════════════════════════
  function addXpTabButton(){
    var tabsInner = document.getElementById('td60TabsInner');
    if (!tabsInner) return false;
    if (tabsInner.querySelector('[data-tab="xpreward"]')) return true;

    var btn = document.createElement('button');
    btn.className = 'td60-tab';
    btn.dataset.tab = 'xpreward';
    btn.innerHTML = '<i class="fas fa-gift"></i> XP Reward';
    btn.onclick = function(){
      tabsInner.querySelectorAll('.td60-tab').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      if (window.TV60) window.TV60.activeTab = 'xpreward';
      openXpPanel();
    };
    tabsInner.appendChild(btn);
    console.log('✅ XP Reward tab added');
    return true;
  }

  // ═══════════════════════════════════════════════════════
  // 📊 OPEN PANEL
  // ═══════════════════════════════════════════════════════
  async function openXpPanel(){
    var panel = document.getElementById('td60Panel');
    if (!panel) return;
    var cls = window.TV60 && window.TV60.activeClass;
    if (!cls) {
      panel.innerHTML = '<div class="td60-empty">Class select ചെയ്യൂ</div>';
      return;
    }
    TXP.class_ = cls;
    panel.innerHTML = '<div style="text-align:center;padding:30px;"><div class="td60-spinner"></div></div>';

    try {
      // Fetch students
      var sr = await supabaseClient.from('students')
        .select('studentid, name, roll, class')
        .eq('class', cls)
        .order('roll');

      var students = sr.data || [];
      if (!students.length) {
        panel.innerHTML = '<div class="td60-empty"><i class="fas fa-users"></i>No students</div>';
        return;
      }
      TXP.students = students;

      // Fetch XP for all
      var ids = students.map(function(s){ return s.studentid; });
      var xr = await supabaseClient.from('student_xp')
        .select('*').in('studentid', ids);
      TXP.xpMap = {};
      (xr.data || []).forEach(function(x){
        TXP.xpMap[x.studentid] = {
          xp: x.xp || 0,
          level: x.level || 1,
          total_earned: x.total_earned || 0
        };
      });

      // Ensure all students have entry
      students.forEach(function(s){
        if (!TXP.xpMap[s.studentid]) {
          TXP.xpMap[s.studentid] = { xp: 0, level: 1, total_earned: 0 };
        }
      });

      TXP.selected = new Set();
      renderPanel(panel);
    } catch(e) {
      console.error('XP panel error:', e);
      panel.innerHTML = '<div class="td60-empty">Error: ' + (e.message || 'unknown') + '</div>';
    }
  }
  window.TXP_OPEN = openXpPanel;

  // ═══════════════════════════════════════════════════════
  // 🎨 RENDER PANEL
  // ═══════════════════════════════════════════════════════
  function renderPanel(panel){
    var students = TXP.students;
    var xpMap = TXP.xpMap;

    // Summary
    var totalXP = 0, maxXP = 0, topName = '—';
    var avgXP = 0;
    students.forEach(function(s){
      var x = xpMap[s.studentid] || { total_earned: 0 };
      totalXP += x.total_earned || 0;
      if ((x.total_earned || 0) > maxXP) {
        maxXP = x.total_earned;
        topName = s.name;
      }
    });
    avgXP = students.length > 0 ? Math.round(totalXP / students.length) : 0;

    var h = '';

    // ─── XP Panel ───
    h += '<div class="txp-panel">';
    h += '<div class="txp-title"><i class="fas fa-gift"></i> XP Reward — Class ' + esc(String(TXP.class_)) + '</div>';
    h += '<div class="txp-sub">' +
      'Students-നു XP bonus നൽകാം. Preset click ചെയ്യൂ അല്ലെങ്കിൽ custom amount type ചെയ്യൂ. ' +
      'Students-നു <b>notification</b> auto-pോകും. 🌟' +
    '</div>';

    // Stats
    h += '<div class="txp-stats">' +
      '<div class="txp-stat"><div class="n" style="color:#2563eb;">' + students.length + '</div><div class="l">Students</div></div>' +
      '<div class="txp-stat"><div class="n" style="color:#f59e0b;">' + totalXP.toLocaleString() + '</div><div class="l">Total XP</div></div>' +
      '<div class="txp-stat"><div class="n" style="color:#059669;">' + avgXP + '</div><div class="l">Avg XP</div></div>' +
      '<div class="txp-stat"><div class="n" style="color:#8b5cf6;font-size:.8rem;">' + esc((topName || '').split(' ')[0]) + '</div><div class="l">Top (' + maxXP + ')</div></div>' +
    '</div>';

    // Presets
    h += '<div class="txp-presets" id="txpPresets">' +
      presetBtn(5, '⭐', 'Small') +
      presetBtn(10, '🌟', 'Good') +
      presetBtn(25, '✨', 'Great') +
      presetBtn(50, '💫', 'Excellent') +
      presetBtn(100, '🏆', 'Best') +
      presetBtn(200, '👑', 'Legendary') +
    '</div>';

    // Custom + Reason
    h += '<div class="txp-form">' +
      '<div class="txp-row">' +
        '<div class="txp-field">' +
          '<label><i class="fas fa-edit" style="color:#f59e0b;"></i> Custom XP Amount</label>' +
          '<input type="number" id="txpCustom" min="1" max="10000" placeholder="e.g., 75" oninput="TXP_setCustom(this.value)">' +
        '</div>' +
      '</div>' +
      '<div class="txp-field">' +
        '<label><i class="fas fa-comment" style="color:#0891b2;"></i> Reason (Optional — student-നു കാണിക്കും)</label>' +
        '<textarea id="txpReason" maxlength="200" placeholder="e.g., മികച്ച പെരുമാറ്റത്തിന് 🏆"></textarea>' +
      '</div>' +
    '</div>';

    // Selection Info
    h += '<div class="txp-sel-info" id="txpSelInfo">' +
      '<i class="fas fa-info-circle"></i>' +
      '<span>Students select ചെയ്തിട്ടില്ല — table-ൽ checkbox ✅</span>' +
    '</div>';

    // Actions
    h += '<div class="txp-actions">' +
      '<button class="txp-btn info" onclick="TXP_loadData()"><i class="fas fa-sync-alt"></i> Refresh</button>' +
      '<button class="txp-btn success" id="txpGiveSelectedBtn" onclick="TXP_applySelected()" disabled><i class="fas fa-user-plus"></i> Give to Selected</button>' +
      '<button class="txp-btn warn" onclick="TXP_applyClass()"><i class="fas fa-users"></i> Give to Entire Class</button>' +
    '</div>';

    // Info note
    h += '<div style="background:#fff;border-radius:12px;padding:12px 14px;border-left:4px solid #059669;font-size:.74rem;color:#475569;line-height:1.6;margin-bottom:14px;">' +
      '<strong style="color:#059669;">💡 എങ്ങനെ ഉപയോഗിക്കാം:</strong><br>' +
      '1️⃣ Students-നെ table-ൽ നിന്ന് select ചെയ്യൂ<br>' +
      '2️⃣ Preset button or custom amount type ചെയ്യൂ<br>' +
      '3️⃣ Reason (optional) എഴുതൂ<br>' +
      '4️⃣ <b>Give to Selected</b> അമർത്തൂ → XP + notification! 🎉' +
    '</div>';

    h += '</div>'; // end panel

    // ─── Student Table ───
    h += '<div style="margin:16px 0 10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">' +
      '<div style="font-weight:900;color:#0f172a;font-size:.92rem;">' +
        '<i class="fas fa-users" style="color:#0891b2;"></i> Student XP Status' +
      '</div>' +
      '<div style="display:flex;gap:6px;">' +
        '<button onclick="TXP_selectAll(true)" style="padding:6px 12px;border-radius:20px;border:1.5px solid rgba(100,116,139,.2);background:#fff;color:#475569;font-family:inherit;font-weight:800;font-size:.7rem;cursor:pointer;">✓ All</button>' +
        '<button onclick="TXP_selectAll(false)" style="padding:6px 12px;border-radius:20px;border:1.5px solid rgba(100,116,139,.2);background:#fff;color:#475569;font-family:inherit;font-weight:800;font-size:.7rem;cursor:pointer;">✕ Clear</button>' +
      '</div>' +
    '</div>';

    h += '<div class="txp-table-wrap"><table class="txp-table">' +
      '<thead><tr>' +
        '<th style="width:40px;text-align:center;">✓</th>' +
        '<th style="width:60px;">Roll</th>' +
        '<th>Name</th>' +
        '<th style="text-align:center;">Level</th>' +
        '<th style="text-align:center;">XP</th>' +
        '<th style="text-align:center;">Total</th>' +
      '</tr></thead><tbody>';

    students.forEach(function(s){
      var x = xpMap[s.studentid] || { xp: 0, level: 1, total_earned: 0 };
      var lvl = x.level || 1;
      var total = x.total_earned || 0;
      var prog = progressForTotal(total);
      var medal = lvl >= 50 ? '👑' : lvl >= 30 ? '🏆' : lvl >= 20 ? '⭐' : lvl >= 10 ? '🌟' : '✨';

      h += '<tr data-sid="' + esc(s.studentid) + '" class="' + (TXP.selected.has(s.studentid) ? 'selected' : '') + '">' +
        '<td style="text-align:center;">' +
          '<input type="checkbox" class="txp-check" ' +
                 (TXP.selected.has(s.studentid) ? 'checked' : '') +
                 ' onchange="TXP_toggle(\'' + esc(s.studentid) + '\', this.checked)">' +
        '</td>' +
        '<td style="font-weight:800;color:#0891b2;">' + esc(s.roll || '—') + '</td>' +
        '<td><strong>' + esc(s.name) + '</strong></td>' +
        '<td style="text-align:center;">' +
          '<span class="txp-lvl-badge">' + medal + ' Lv ' + lvl + '</span>' +
        '</td>' +
        '<td style="text-align:center;color:#0891b2;font-weight:800;font-size:.78rem;">' + prog.xp + '/' + prog.needed + '</td>' +
        '<td style="text-align:center;" class="txp-xp-num">' + total + '</td>' +
      '</tr>';
    });

    h += '</tbody></table></div>';

    // Recent awards
    if (TXP.recent.length > 0) {
      h += '<div class="txp-recent">' +
        '<div class="txp-recent-title"><i class="fas fa-history"></i> Recent Awards (this session)</div>';
      TXP.recent.slice(0, 10).forEach(function(r){
        var ini = (r.name || 'S').charAt(0).toUpperCase();
        h += '<div class="txp-award-item">' +
          '<div class="avatar">' + ini + '</div>' +
          '<div class="info">' +
            '<div class="name">' + esc(r.name) + '</div>' +
            '<div class="reason">' + esc(r.reason || 'No reason') + ' • ' + r.time + '</div>' +
          '</div>' +
          '<div class="amount">+' + r.amount + ' XP</div>' +
        '</div>';
      });
      h += '</div>';
    }

    panel.innerHTML = h;
    updateSelInfo();
    bindCustomInput();
  }

  function presetBtn(amount, ico, label){
    var active = TXP.amount === amount ? ' active' : '';
    return '<button type="button" class="txp-preset' + active + '" ' +
      'data-amount="' + amount + '" onclick="TXP_pickPreset(' + amount + ')">' +
      '<span class="ico">' + ico + '</span>' +
      '<span class="num">+' + amount + '</span>' +
    '</button>';
  }

  // ═══════════════════════════════════════════════════════
  // 🎯 INTERACTIONS
  // ═══════════════════════════════════════════════════════
  window.TXP_pickPreset = function(amount){
    TXP.amount = amount;
    var customInp = document.getElementById('txpCustom');
    if (customInp) customInp.value = '';
    // Update preset active class
    document.querySelectorAll('.txp-preset').forEach(function(el){
      el.classList.toggle('active', parseInt(el.dataset.amount) === amount);
    });
    updateSelInfo();
    if (navigator.vibrate) try { navigator.vibrate(10); } catch(e) {}
  };

  window.TXP_setCustom = function(val){
    var v = parseInt(val) || 0;
    v = Math.max(0, Math.min(10000, v));
    TXP.amount = v;
    document.querySelectorAll('.txp-preset').forEach(function(el){
      el.classList.remove('active');
    });
    updateSelInfo();
  };

  window.TXP_toggle = function(sid, checked){
    if (checked) TXP.selected.add(sid);
    else TXP.selected.delete(sid);
    // Update row highlight
    var row = document.querySelector('.txp-table tr[data-sid="' + sid + '"]');
    if (row) row.classList.toggle('selected', checked);
    updateSelInfo();
  };

  window.TXP_selectAll = function(select){
    TXP.selected = new Set();
    TXP.students.forEach(function(s){
      if (select) TXP.selected.add(s.studentid);
    });
    document.querySelectorAll('.txp-check').forEach(function(cb){
      var tr = cb.closest('tr');
      var sid = tr ? tr.dataset.sid : null;
      cb.checked = select;
      if (tr) tr.classList.toggle('selected', select);
    });
    updateSelInfo();
    if (navigator.vibrate) try { navigator.vibrate(8); } catch(e) {}
  };

  function updateSelInfo(){
    var info = document.getElementById('txpSelInfo');
    if (!info) return;
    var cnt = TXP.selected.size;
    var amt = TXP.amount || 0;

    if (cnt === 0) {
      info.innerHTML = '<i class="fas fa-info-circle"></i><span>Students select ചെയ്തിട്ടില്ല — table-ൽ checkbox ✅</span>';
    } else if (amt === 0) {
      info.innerHTML = '<i class="fas fa-users" style="color:#2563eb;"></i><span><b>' + cnt + '</b> students selected — XP amount select ചെയ്യൂ</span>';
    } else {
      info.innerHTML = '<i class="fas fa-gift" style="color:#059669;"></i><span><b>' + cnt + '</b> students × <b>+' + amt + ' XP</b> = <b>' + (cnt * amt) + ' XP total</b></span>';
    }
    var btn = document.getElementById('txpGiveSelectedBtn');
    if (btn) btn.disabled = (cnt === 0 || amt <= 0);
  }

  function bindCustomInput(){
    var inp = document.getElementById('txpCustom');
    if (!inp || inp._bound) return;
    inp._bound = true;
    inp.addEventListener('input', function(){
      var v = parseInt(this.value) || 0;
      if (v > 10000) { v = 10000; this.value = 10000; }
    });
  }

  // ═══════════════════════════════════════════════════════
  // 🚀 APPLY XP
  // ═══════════════════════════════════════════════════════
  window.TXP_applySelected = async function(){
    var ids = Array.from(TXP.selected);
    if (ids.length === 0) { txpToast('Students select ചെയ്യൂ', 'error'); return; }
    var amount = TXP.amount || 0;
    if (amount <= 0) { txpToast('XP amount select ചെയ്യൂ', 'error'); return; }

    var reason = (document.getElementById('txpReason').value || '').trim();

    var msg = '🎁 XP Bonus Confirm\n\n' +
      '👥 Students: ' + ids.length + '\n' +
      '⭐ XP per student: +' + amount + '\n' +
      '📊 Total XP: ' + (ids.length * amount) + '\n' +
      (reason ? '📝 Reason: ' + reason + '\n' : '') +
      '\nApply ചെയ്യണോ?';
    if (!confirm(msg)) return;

    await applyXPBonus(ids, amount, reason, 'selected');
  };

  window.TXP_applyClass = async function(){
    if (!TXP.students.length) { txpToast('No students', 'error'); return; }
    var amount = TXP.amount || 0;
    if (amount <= 0) { txpToast('XP amount select ചെയ്യൂ', 'error'); return; }

    var reason = (document.getElementById('txpReason').value || '').trim();
    var ids = TXP.students.map(function(s){ return s.studentid; });

    var msg = '🎁 XP Bonus to Class ' + TXP.class_ + '\n\n' +
      '👥 Students: ' + ids.length + '\n' +
      '⭐ XP per student: +' + amount + '\n' +
      '📊 Total XP: ' + (ids.length * amount) + '\n' +
      (reason ? '📝 Reason: ' + reason + '\n' : '') +
      '\nApply ചെയ്യണോ?';
    if (!confirm(msg)) return;

    await applyXPBonus(ids, amount, reason, 'class');
  };

  async function applyXPBonus(ids, amount, reason, type){
    if (!ids || !ids.length) return;
    if (typeof supabaseClient === 'undefined' || !supabaseClient) {
      txpToast('DB unavailable', 'error');
      return;
    }

    // Show loading on the button
    var btn = type === 'selected'
      ? document.getElementById('txpGiveSelectedBtn')
      : null;
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...'; }

    var success = 0, failed = 0;

    try {
      // Fetch existing XP records
      var xr = await supabaseClient.from('student_xp')
        .select('*').in('studentid', ids);
      var existing = {};
      (xr.data || []).forEach(function(x){ existing[x.studentid] = x; });

      // Build upsert payload
      var upserts = [];
      ids.forEach(function(sid){
        var old = existing[sid] || { xp: 0, level: 1, total_earned: 0 };
        var oldTotal = old.total_earned || 0;
        var newTotal = oldTotal + amount;
        var prog = progressForTotal(newTotal);
        upserts.push({
          studentid: sid,
          xp: prog.xp,
          level: prog.level,
          total_earned: newTotal,
          last_earned_at: new Date().toISOString(),
          updated_at: new Date().toISOString()
        });
      });

      // Upsert in batches
      for (var i = 0; i < upserts.length; i += 50) {
        var batch = upserts.slice(i, i + 50);
        try {
          var r = await supabaseClient.from('student_xp')
            .upsert(batch, { onConflict: 'studentid' });
          if (r.error) throw r.error;
          success += batch.length;
        } catch(e) {
          console.error('Batch failed:', e);
          failed += batch.length;
        }
      }

      // Send notifications to students
      if (success > 0) {
        try {
          var teacher = window.currentTeacher || (window.TV60 && window.TV60.teacher);
          var teacherName = teacher ? teacher.name : 'Teacher';
          var notifs = ids.slice(0, success).map(function(sid){
            return {
              title: '🎁 +' + amount + ' XP Reward!',
              message: reason || (teacherName + ' നിങ്ങൾക്ക് +' + amount + ' XP bonus നൽകി! 🌟'),
              type: 'important',
              target_type: 'student',
              target_student: sid,
              link_url: null
            };
          });
          for (var j = 0; j < notifs.length; j += 100) {
            try {
              await supabaseClient.from('notifications').insert(notifs.slice(j, j + 100));
            } catch(e) { console.warn('Notify batch fail:', e); }
          }
        } catch(e) {
          console.warn('Notify error:', e);
        }

        // Audit log (optional, if table exists)
        try {
          await supabaseClient.from('audit_logs').insert({
            user_id: (window.currentTeacher && window.currentTeacher.teacher_id) || 'TEACHER',
            user_type: 'teacher',
            action: 'XP_REWARD_' + type.toUpperCase(),
            table_name: 'student_xp',
            record_id: ids.length + '_students',
            new_data: {
              amount: amount,
              count: ids.length,
              reason: reason,
              class: TXP.class_,
              students: ids.slice(0, 20)
            },
            user_agent: navigator.userAgent.substring(0, 200)
          });
        } catch(e) { /* audit_logs may not exist */ }
      }

      // Show result
      if (failed > 0) {
        txpToast('⚠️ ' + success + ' XP added, ' + failed + ' failed', 'error');
      } else {
        // Flash success popup
        showXpSuccessFlash(amount, success);
        txpToast('✅ ' + success + ' students-നു +' + amount + ' XP നൽകി!', 'success');
        if (typeof confetti !== 'undefined') {
          confetti({
            particleCount: 150, spread: 100, origin: { y: .5 },
            colors: ['#059669','#34d399','#fbbf24','#fcd34d','#22d3ee']
          });
        }
        if (navigator.vibrate) try { navigator.vibrate([30, 40, 30]); } catch(e) {}
      }

      // Add to recent list
      var now = new Date();
      var timeStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
      ids.slice(0, 10).forEach(function(sid){
        var st = TXP.students.find(function(x){ return x.studentid === sid; });
        if (st) {
          TXP.recent.unshift({
            name: st.name,
            amount: amount,
            reason: reason,
            time: timeStr
          });
        }
      });
      TXP.recent = TXP.recent.slice(0, 20);

      // Reset form + reload
      TXP.selected = new Set();
      TXP.amount = 0;
      var reasonInp = document.getElementById('txpReason');
      if (reasonInp) reasonInp.value = '';
      var customInp = document.getElementById('txpCustom');
      if (customInp) customInp.value = '';

      setTimeout(function(){
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-user-plus"></i> Give to Selected'; }
        openXpPanel();  // Reload
      }, 1200);

    } catch(e) {
      console.error('applyXPBonus:', e);
      txpToast('❌ ' + (e.message || 'Error'), 'error');
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-user-plus"></i> Give to Selected'; }
    }
  }

  // ═══════════════════════════════════════════════════════
  // ✨ SUCCESS FLASH
  // ═══════════════════════════════════════════════════════
  function showXpSuccessFlash(amount, count){
    var flash = document.createElement('div');
    flash.style.cssText =
      'position:fixed;top:50%;left:50%;' +
      'transform:translate(-50%,-50%) scale(0);' +
      'background:linear-gradient(135deg,#059669,#34d399);' +
      'color:#fff;padding:30px 50px;border-radius:24px;' +
      'font-weight:900;font-size:1.4rem;text-align:center;' +
      'box-shadow:0 30px 80px -20px rgba(5,150,105,.9);' +
      'z-index:100950;transition:transform .5s cubic-bezier(.34,1.56,.64,1);' +
      'pointer-events:none;font-family:\'Anek Malayalam\',sans-serif;';
    flash.innerHTML =
      '<div style="font-size:3rem;margin-bottom:8px;">🎁</div>' +
      '<div style="font-size:1.6rem;font-weight:900;">+' + amount + ' XP</div>' +
      '<div style="font-size:.8rem;opacity:.9;margin-top:6px;font-weight:700;">' + count + ' students-നു നൽകി!</div>';
    document.body.appendChild(flash);

    setTimeout(function(){ flash.style.transform = 'translate(-50%,-50%) scale(1)'; }, 50);
    setTimeout(function(){
      flash.style.transform = 'translate(-50%,-50%) scale(0)';
      setTimeout(function(){ flash.remove(); }, 500);
    }, 1800);
  }

  // ═══════════════════════════════════════════════════════
  // 🔄 REFRESH
  // ═══════════════════════════════════════════════════════
  window.TXP_loadData = function(){
    openXpPanel();
    txpToast('🔄 Refreshed', 'success');
  };

  // ═══════════════════════════════════════════════════════
  // 🎯 HOOK: Watch for tab clicks on other tabs → remove active
  // ═══════════════════════════════════════════════════════
  document.addEventListener('click', function(e){
    var tab = e.target.closest('.td60-tab');
    if (!tab) return;
    if (tab.dataset.tab === 'xpreward') return;  // handled
    // Deactivate XP tab styling when another tab clicked
    var xpTab = document.querySelector('.td60-tab[data-tab="xpreward"]');
    if (xpTab && tab !== xpTab) xpTab.classList.remove('active');
  }, true);

  // ═══════════════════════════════════════════════════════
  // 🎯 HOOK: Auto-add tab when teacher enters class
  // ═══════════════════════════════════════════════════════
  function watchForTabs(){
    var tabsInner = document.getElementById('td60TabsInner');
    if (!tabsInner) return;
    if (tabsInner.querySelector('[data-tab="xpreward"]')) return;
    if (tabsInner.querySelector('.td60-tab')) {
      addXpTabButton();
    }
  }

  // Hook into class open (watch tab rendering)
  var _tabObserver = new MutationObserver(function(){
    setTimeout(watchForTabs, 100);
  });

  setTimeout(function(){
    var tabsInner = document.getElementById('td60TabsInner');
    if (tabsInner) _tabObserver.observe(tabsInner, { childList: true });
  }, 3000);

  // Also hook enterTeacherDashboard
  var _origEnter = window.enterTeacherDashboard;
  if (typeof _origEnter === 'function' && !_origEnter._txp) {
    window.enterTeacherDashboard = async function(t){
      var r = await _origEnter.apply(this, arguments);
      setTimeout(watchForTabs, 2000);
      return r;
    };
    window.enterTeacherDashboard._txp = true;
  }

  // Init attempts
  setTimeout(watchForTabs, 2500);
  setTimeout(watchForTabs, 5000);
  setTimeout(watchForTabs, 8000);

  // ═══════════════════════════════════════════════════════
  // 🐛 DEBUG
  // ═══════════════════════════════════════════════════════
  window.TXP_debug = function(){
    console.log('=== XP REWARD DEBUG ===');
    console.log('Tab exists?', !!document.querySelector('[data-tab="xpreward"]'));
    console.log('Students loaded:', TXP.students.length);
    console.log('Selected:', TXP.selected.size);
    console.log('Amount:', TXP.amount);
    console.log('Class:', TXP.class_);
    console.log('XP map size:', Object.keys(TXP.xpMap).length);
    if (typeof showToast === 'function') showToast('🎁 Check console', 'info');
  };

  window.TXP_quickTest = async function(studentId, amount){
    if (!studentId) {
      studentId = window.currentTeacher && window.currentTeacher.teacher_id;
      console.log('Testing with teacher ID (self):', studentId);
    }
    await applyXPBonus([studentId], amount || 10, 'Test from TXP', 'test');
  };

  console.log('✅ Teacher XP Reward v1.0 ready');
  console.log('   💡 TXP_OPEN() — manual open');
  console.log('   💡 TXP_debug() — check state');
})();
</script>
