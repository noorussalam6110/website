* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Anek Malayalam', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
html { overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; }
body {
  background: linear-gradient(155deg, #03081c, #050e2b 22%, #071433 45%, #0a1a3f);
  background-attachment: scroll;
  min-height: 100vh;
  color: #eaf2ff;
  overflow-x: hidden;
}

/* 👨‍🏫 TEACHER LOGIN v60                                     */
/* ═══════════════════════════════════════════════════════ */
#teacherLoginV60{
  position:fixed;
  inset:0;
  z-index:9999999;
  background:
    radial-gradient(ellipse at 15% 10%, rgba(34,211,238,.12), transparent 55%),
    radial-gradient(ellipse at 85% 90%, rgba(139,92,246,.15), transparent 55%),
    linear-gradient(155deg,#050e2b 0%,#03081c 50%,#071433 100%);
  height:100vh;
  height:100dvh;
  overflow-y:scroll !important;
  overflow-x:hidden !important;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  touch-action:pan-y;
  box-sizing:border-box;
  display:none;
  padding:16px;
  padding-top:max(16px,env(safe-area-inset-top,16px));
  padding-bottom:max(24px,env(safe-area-inset-bottom,24px));
}
#teacherLoginV60.open{
  display:block !important;
  visibility:visible !important;
  opacity:1 !important;
  pointer-events:auto !important;
}
#teacherLoginV60 .tv60-card{
  position:relative !important;
  margin:0 auto 40px auto !important;
  overflow:visible !important;
  max-width:420px;
  width:100%;
  padding:0 0 24px 0;
  background:linear-gradient(155deg,rgba(255,255,255,.15),rgba(255,255,255,.04));
  backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
  border:1.5px solid rgba(255,255,255,.22);
  border-radius:24px;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.95),0 0 70px -20px rgba(34,211,238,.35),inset 0 1px 0 rgba(255,255,255,.4);
  box-sizing:border-box;
}
#teacherLoginV60 .tv60-top-bar{
  position:absolute;top:0;left:12%;right:12%;height:2.5px;
  border-radius:0 0 3px 3px;
  background:linear-gradient(90deg,transparent,#22d3ee,#3b8bff,#fff,#3b8bff,#22d3ee,transparent);
  background-size:250% 100%;animation:tv60Flow 4s linear infinite;
  filter:drop-shadow(0 0 10px rgba(34,211,238,.9));z-index:5;
}
@keyframes tv60Flow{0%{background-position:250% 0}100%{background-position:-250% 0}}

#teacherLoginV60 .tv60-header{
  display:flex;align-items:center;gap:14px;
  padding:24px 22px 14px;
}
#teacherLoginV60 .tv60-icon{
  width:56px;height:56px;border-radius:16px;
  background:linear-gradient(140deg,#0891b2,#22d3ee);
  display:flex;align-items:center;justify-content:center;
  font-size:1.5rem;color:#fff;
  box-shadow:0 10px 25px -8px rgba(34,211,238,.9),inset 0 1px 0 rgba(255,255,255,.4);
  flex-shrink:0;
  animation:tv60IconPulse 2.5s ease-in-out infinite;
}
@keyframes tv60IconPulse{
  0%,100%{box-shadow:0 10px 25px -8px rgba(34,211,238,.9),inset 0 1px 0 rgba(255,255,255,.4)}
  50%{box-shadow:0 14px 32px -8px rgba(34,211,238,1),inset 0 1px 0 rgba(255,255,255,.4)}
}
#teacherLoginV60 .tv60-header-text{flex:1;min-width:0}
#teacherLoginV60 .tv60-title{
  color:#fff;font-size:1.05rem;font-weight:800;margin:0 0 2px;
  line-height:1.25;letter-spacing:.2px;text-shadow:0 2px 8px rgba(0,0,0,.5);
}
#teacherLoginV60 .tv60-sub{
  color:#a9cdff;font-size:.74rem;margin:0;
  letter-spacing:1.5px;text-transform:uppercase;font-weight:700;
}

#teacherLoginV60 .tv60-info-box{
  display:flex;align-items:center;gap:12px;
  background:rgba(34,211,238,.10);
  border:1.5px solid rgba(34,211,238,.32);
  border-radius:16px;padding:12px 16px;margin:0 22px 16px;
}
#teacherLoginV60 .tv60-info-avatar{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(140deg,#0891b2,#22d3ee);
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;flex-shrink:0;
  box-shadow:0 4px 12px -4px rgba(34,211,238,.7);
}
#teacherLoginV60 .tv60-info-text{flex:1;min-width:0}
#teacherLoginV60 .tv60-info-name{
  color:#fff;font-weight:800;font-size:.92rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;
}
#teacherLoginV60 .tv60-info-meta{
  color:#a9cdff;font-size:.72rem;display:flex;align-items:center;gap:6px;
  flex-wrap:wrap;line-height:1.3;
}
#teacherLoginV60 .tv60-info-meta #tv60Tid{
  color:#67e8f9;font-weight:800;letter-spacing:.5px;
}
#teacherLoginV60 .tv60-dot{opacity:.5}

#teacherLoginV60 .tv60-error{
  background:rgba(239,68,68,.15);
  border:1.5px solid rgba(239,68,68,.45);
  border-radius:12px;padding:10px 14px;color:#fca5a5;
  font-size:.78rem;font-weight:700;margin:0 22px 12px;display:none;
}
#teacherLoginV60 .tv60-error.show{display:block;animation:tv60Shake .4s}
@keyframes tv60Shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

#teacherLoginV60 form{padding:0 22px}
#teacherLoginV60 .tv60-label{
  display:flex;align-items:center;gap:7px;color:#fff;
  font-size:.76rem;font-weight:800;margin-bottom:8px;letter-spacing:.3px;
}
#teacherLoginV60 .tv60-label i{color:#ffd966;font-size:.85rem}
#teacherLoginV60 .tv60-input-wrap{
  display:flex;align-items:center;
  background:rgba(255,255,255,.10);
  border:1.5px solid rgba(255,255,255,.24);
  border-radius:14px;padding:0 14px;margin-bottom:14px;transition:all .25s ease;
}
#teacherLoginV60 .tv60-input-wrap:focus-within{
  background:rgba(255,255,255,.18);
  border-color:#22d3ee;
  box-shadow:0 0 0 4px rgba(34,211,238,.18);
}
#teacherLoginV60 .tv60-input-wrap i.tv60-icon-in{
  color:#ffd966;font-size:.95rem;margin-right:10px;flex-shrink:0;
}
#teacherLoginV60 input.tv60-input{
  flex:1;min-width:0;border:none;outline:none;background:transparent;
  padding:14px 0;color:#fff;font-family:inherit;
  font-size:16px;font-weight:700;letter-spacing:1.5px;
  text-shadow:0 1px 3px rgba(0,0,0,.5);
}
#teacherLoginV60 input.tv60-input::placeholder{
  color:rgba(255,255,255,.5);font-weight:500;font-size:15px;letter-spacing:0;
}
#teacherLoginV60 .tv60-eye{
  cursor:pointer;color:#ffd966;padding:10px;font-size:.95rem;flex-shrink:0;transition:color .2s;
}
#teacherLoginV60 .tv60-eye:active{color:#fff}

#teacherLoginV60 .tv60-remember{
  display:flex;align-items:center;gap:10px;
  padding:11px 14px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);border-radius:12px;
  cursor:pointer;margin-bottom:16px;user-select:none;
  -webkit-tap-highlight-color:transparent;transition:background .2s;
}
#teacherLoginV60 .tv60-remember:active{background:rgba(255,255,255,.12)}
#teacherLoginV60 .tv60-remember input[type="checkbox"]{
  position:absolute;opacity:0;pointer-events:none;
}
#teacherLoginV60 .tv60-checkbox-ui{
  width:20px;height:20px;border-radius:6px;
  border:2px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .2s;position:relative;
}
#teacherLoginV60 .tv60-checkbox-ui::after{
  content:'\f00c';font-family:'Font Awesome 6 Free';font-weight:900;
  color:#fff;font-size:.7rem;opacity:0;transform:scale(.4);transition:all .2s;
}
#teacherLoginV60 input[type="checkbox"]:checked ~ .tv60-checkbox-ui{
  background:linear-gradient(140deg,#0891b2,#22d3ee);
  border-color:#22d3ee;box-shadow:0 0 12px rgba(34,211,238,.6);
}
#teacherLoginV60 input[type="checkbox"]:checked ~ .tv60-checkbox-ui::after{
  opacity:1;transform:scale(1);
}
#teacherLoginV60 .tv60-remember-text{
  color:#fff;font-size:.78rem;font-weight:700;
  display:flex;align-items:center;gap:6px;
}
#teacherLoginV60 .tv60-remember-text i{color:#ffd966;font-size:.8rem}

#teacherLoginV60 .tv60-btn-primary{
  width:100%;border:none;padding:15px;border-radius:14px;
  background:linear-gradient(100deg,#0891b2,#22d3ee,#3b8bff);
  background-size:200% 100%;animation:tv60BtnFlow 6s ease infinite;
  color:#fff;font-family:inherit;font-weight:800;font-size:.92rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  gap:10px;box-shadow:0 12px 30px -10px rgba(34,211,238,.85),inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .2s;min-height:52px;letter-spacing:.5px;
}
@keyframes tv60BtnFlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
#teacherLoginV60 .tv60-btn-primary:hover{transform:translateY(-2px)}
#teacherLoginV60 .tv60-btn-primary:active{transform:translateY(0) scale(.98)}
#teacherLoginV60 .tv60-btn-primary i{color:#ffd966}
#teacherLoginV60 .tv60-btn-primary:disabled{opacity:.7;cursor:not-allowed;animation:none}

#teacherLoginV60 .tv60-secondary-row{display:flex;gap:8px;margin-top:10px}
#teacherLoginV60 .tv60-btn-secondary{
  flex:1;padding:12px 8px;border-radius:12px;
  background:rgba(255,255,255,.08);
  border:1.5px solid rgba(255,255,255,.20);
  color:#fff;font-family:inherit;font-weight:700;font-size:.78rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  gap:6px;min-height:46px;transition:all .2s;
  -webkit-tap-highlight-color:transparent;
}
#teacherLoginV60 .tv60-btn-secondary:hover{
  background:rgba(255,255,255,.16);border-color:rgba(34,211,238,.5);
}
#teacherLoginV60 .tv60-btn-secondary:active{transform:scale(.96)}
#teacherLoginV60 .tv60-btn-secondary i{color:#ffd966;font-size:.82rem}

#teacherLoginV60 .tv60-footer{
  text-align:center;margin-top:18px;padding-top:14px;
  border-top:1px solid rgba(255,255,255,.08);
  font-size:.66rem;color:#6d88ad;font-weight:600;letter-spacing:.8px;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
#teacherLoginV60 .tv60-footer i{color:#22d3ee;opacity:.7}

/* 📱 Small phones */
@media (max-width: 500px){
  #teacherLoginV60{padding:12px;padding-top:max(12px,env(safe-area-inset-top,12px));padding-bottom:max(20px,env(safe-area-inset-bottom,20px));}
  #teacherLoginV60 .tv60-card{border-radius:20px;margin-bottom:24px}
  #teacherLoginV60 .tv60-header{padding:20px 18px 12px;gap:12px}
  #teacherLoginV60 .tv60-icon{width:48px;height:48px;font-size:1.3rem;border-radius:14px}
  #teacherLoginV60 .tv60-title{font-size:.95rem}
  #teacherLoginV60 .tv60-sub{font-size:.68rem;letter-spacing:1.2px}
  #teacherLoginV60 .tv60-info-box{margin:0 18px 14px;padding:10px 14px}
  #teacherLoginV60 .tv60-info-avatar{width:36px;height:36px;font-size:1.05rem}
  #teacherLoginV60 .tv60-info-name{font-size:.86rem}
  #teacherLoginV60 .tv60-info-meta{font-size:.68rem}
  #teacherLoginV60 .tv60-error{margin:0 18px 10px;padding:9px 12px;font-size:.74rem}
  #teacherLoginV60 form{padding:0 18px}
  #teacherLoginV60 .tv60-label{font-size:.72rem}
  #teacherLoginV60 input.tv60-input{font-size:16px !important;padding:13px 0}
  #teacherLoginV60 .tv60-remember{padding:10px 12px;gap:8px;margin-bottom:14px}
  #teacherLoginV60 .tv60-remember-text{font-size:.72rem}
  #teacherLoginV60 .tv60-checkbox-ui{width:18px;height:18px;border-radius:5px}
  #teacherLoginV60 .tv60-btn-primary{padding:14px;font-size:.86rem;min-height:48px}
  #teacherLoginV60 .tv60-btn-secondary{padding:11px 6px;font-size:.72rem;min-height:44px}
  #teacherLoginV60 .tv60-footer{font-size:.6rem;margin-top:14px;padding-top:12px}
}
@media (max-width: 360px){
  #teacherLoginV60 .tv60-card{border-radius:18px}
  #teacherLoginV60 .tv60-header{padding:18px 14px 10px}
  #teacherLoginV60 .tv60-icon{width:44px;height:44px;font-size:1.15rem}
  #teacherLoginV60 .tv60-title{font-size:.88rem}
  #teacherLoginV60 .tv60-info-box{margin:0 14px 12px}
  #teacherLoginV60 form{padding:0 14px}
  #teacherLoginV60 .tv60-error{margin:0 14px 10px}
  #teacherLoginV60 .tv60-btn-primary{font-size:.82rem}
  #teacherLoginV60 .tv60-btn-secondary{font-size:.68rem}
}
@media (min-width: 901px){
  #teacherLoginV60{
    padding: 0 24px !important;
    display: none;
    overflow: hidden !important;
    box-sizing: border-box !important;
  }
  #teacherLoginV60.open{
    display: block !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    height: 100vh !important;
    max-height: 100vh !important;
    padding: 20px 24px 80px !important;
  }
  #teacherLoginV60 .tv60-card{
    max-width: 440px;
    width: 100%;
    margin: 3vh auto 40px auto;
  }
}

/* ═══════════════════════════════════════════════════════ */
/* 👨‍🏫 TEACHER DASHBOARD v60                                 */
/* ═══════════════════════════════════════════════════════ */
#teacherDashboardV60{min-height:100vh;background:linear-gradient(160deg,#f0f9ff 0%,#dbeafe 50%,#e0f2fe 100%);padding:16px;padding-bottom:100px;display:none}
#teacherDashboardV60.open{display:block}
.td60-header{
  max-width:1200px;margin:0 auto 18px;
  background:linear-gradient(135deg,#0891b2,#22d3ee,#3b8bff);
  border-radius:22px;padding:18px 22px;
  padding-top:max(18px,env(safe-area-inset-top,18px));
  box-shadow:0 12px 30px -12px rgba(8,145,178,.6);
  display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;
}
.td60-header-left{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.td60-avatar{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.25);border:3px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#fff;flex-shrink:0}
.td60-info{min-width:0;flex:1}
.td60-name{color:#fff;font-size:1.15rem;font-weight:800;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td60-meta{color:rgba(255,255,255,.92);font-size:.78rem;margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.td60-meta i{color:#fcd34d}
.td60-exit-btn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;font-weight:800;padding:11px 18px;border-radius:14px;font-size:.82rem;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px;flex-shrink:0;min-height:44px}
.td60-exit-btn:active{transform:scale(.96)}
.td60-settings-btn{background:rgba(255,255,255,.2) !important;border:1px solid rgba(255,255,255,.3) !important;color:#fff !important;font-weight:800;padding:11px 18px;border-radius:14px;font-size:.82rem;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:8px;flex-shrink:0;min-height:44px;margin-right:8px;transition:all .2s}
.td60-settings-btn:hover{background:rgba(255,255,255,.3) !important}
.td60-settings-btn:active{transform:scale(.96)}
.td60-wa-bot-btn{background:linear-gradient(100deg,#25D366,#128C7E)!important;color:#fff!important;border:none!important;margin-right:8px;box-shadow:0 4px 12px -4px rgba(37,211,102,.5)}
.td60-notif-btn{position:relative}

.td60-stats{max-width:1200px;margin:0 auto 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.td60-stat{background:#fff;border-radius:18px;padding:18px;border:1px solid rgba(180,200,230,.5);box-shadow:0 6px 20px -12px rgba(0,0,0,.15)}
.td60-stat-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.td60-stat-num{font-size:1.9rem;font-weight:900;background:linear-gradient(120deg,#0891b2,#22d3ee);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.td60-stat-label{color:#64748b;font-size:.76rem;margin-top:6px;font-weight:700}
.td60-stat-ico{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0}

.td60-class-tabs{max-width:1200px;margin:0 auto 18px;display:flex;gap:8px;flex-wrap:wrap}
.td60-class-tab{padding:11px 20px;border-radius:30px;border:1.5px solid rgba(8,145,178,.3);background:#fff;color:#0891b2;font-family:inherit;font-weight:800;font-size:.82rem;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;min-height:44px}
.td60-class-tab.active{background:linear-gradient(100deg,#0891b2,#22d3ee);color:#fff;border-color:transparent;box-shadow:0 4px 12px -4px rgba(8,145,178,.5)}

.td60-main{max-width:1200px;margin:0 auto;background:#fff;border-radius:20px;overflow:hidden;border:1px solid rgba(180,200,230,.5);box-shadow:0 12px 30px -12px rgba(0,0,0,.15)}
.td60-main-header{background:linear-gradient(100deg,#0891b2,#22d3ee);padding:14px 20px;color:#fff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.td60-main-title{font-weight:900;font-size:1.02rem;display:flex;align-items:center;gap:8px}
.td60-main-tag{font-size:.74rem;font-weight:700;background:rgba(255,255,255,.2);padding:5px 12px;border-radius:20px}

.td60-tabs{padding:12px;background:#f8fafc;border-bottom:1px solid rgba(100,116,139,.1);overflow-x:auto;-webkit-overflow-scrolling:touch}
.td60-tabs::-webkit-scrollbar{height:4px}
.td60-tabs-inner{display:flex;gap:6px;min-width:max-content}
.td60-tab{padding:9px 15px;border-radius:30px;border:1.5px solid rgba(100,116,139,.2);background:#fff;color:#475569;font-family:inherit;font-weight:700;font-size:.74rem;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:40px}
.td60-tab.active{background:linear-gradient(100deg,#0891b2,#22d3ee);color:#fff;border-color:transparent;box-shadow:0 4px 12px -4px rgba(8,145,178,.5)}

.td60-panel{padding:18px;min-height:400px}
.td60-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid rgba(180,200,230,.5);border-radius:14px}
.td60-table{width:100%;border-collapse:collapse;font-size:.84rem;min-width:480px}

  try {
    var d = new Date(iso);

  /* ═══════════════ PANEL: ANALYTICS ═══════════════ */
  async function panelAnalytics(panel, cls) {
    panel.innerHTML = '<div style="text-align:center;padding:30px;"><div class="td60-spinner"></div></div>';
    try {
      var sr = await supabaseClient.from('students').select('studentid, name, roll, overallgrade, rank, attendance').eq('class', cls);
      var students = sr.data || [];
      if (!students.length) { panel.innerHTML = '<div class="td60-empty">No students</div>'; return; }
      var ids = students.map(function(s) { return s.studentid; });
      var mr = await supabaseClient.from('exam_marks').select('obtained_marks, max_marks').in('studentid', ids);
      var nr = await supabaseClient.from('namaz_log').select('fajr, dhuhr, asr, maghrib, isha').in('studentid', ids).gte('prayer_date', new Date(Date.now() - 30*86400000).toISOString().split('T')[0]);

      var totalMarks = 0, totalMax = 0;
      (mr.data || []).forEach(function(m) { totalMarks += Number(m.obtained_marks) || 0; totalMax += Number(m.max_marks) || 0; });
      var classPct = totalMax > 0 ? Math.round(totalMarks / totalMax * 100) : 0;

      var adaaCount = 0, qadaCount = 0;
      (nr.data || []).forEach(function(l) {
        ['fajr','dhuhr','asr','maghrib','isha'].forEach(function(k) {
          if (l[k] === 'adaa') adaaCount++;
          else if (l[k] === 'qada') qadaCount++;
        });
      });

      var attAvg = 0, attCount = 0;
      students.forEach(function(s) { if (s.attendance) { attAvg += Number(s.attendance); attCount++; } });
      attAvg = attCount > 0 ? Math.round(attAvg / attCount) : 0;

      var h = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;">';
      h += '<div style="background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-radius:16px;padding:16px;text-align:center;"><div style="font-size:1.8rem;font-weight:900;color:#059669;">' + students.length + '</div><div style="font-size:.68rem;color:#065f46;font-weight:800;margin-top:4px;">Students</div></div>';
      h += '<div style="background:linear-gradient(135deg,#eff6ff,#dbeafe);border-radius:16px;padding:16px;text-align:center;"><div style="font-size:1.8rem;font-weight:900;color:#2563eb;">' + classPct + '%</div><div style="font-size:.68rem;color:#1e40af;font-weight:800;margin-top:4px;">Class Avg</div></div>';
      h += '<div style="background:linear-gradient(135deg,#fef3c7,#fde68a);border-radius:16px;padding:16px;text-align:center;"><div style="font-size:1.8rem;font-weight:900;color:#b45309;">' + adaaCount + '</div><div style="font-size:.68rem;color:#78350f;font-weight:800;margin-top:4px;">Adaa (30d)</div></div>';
      h += '<div style="background:linear-gradient(135deg,#fef2f2,#fee2e2);border-radius:16px;padding:16px;text-align:center;"><div style="font-size:1.8rem;font-weight:900;color:#dc2626;">' + qadaCount + '</div><div style="font-size:.68rem;color:#991b1b;font-weight:800;margin-top:4px;">Qada (30d)</div></div>';
      h += '<div style="background:linear-gradient(135deg,#ecfeff,#cffafe);border-radius:16px;padding:16px;text-align:center;"><div style="font-size:1.8rem;font-weight:900;color:#0891b2;">' + attAvg + '%</div><div style="font-size:.68rem;color:#065f46;font-weight:800;margin-top:4px;">Attendance</div></div>';
      h += '</div>';
      panel.innerHTML = h;
    } catch(e) {
      panel.innerHTML = '<div class="td60-empty">Error: ' + esc(e.message) + '</div>';
    }
  }

  async function loadAttendance(cls) {
    var body = $id('td60AttBody');
    body.innerHTML = '<div style="text-align:center;padding:20px;"><div class="td60-spinner"></div></div>';
    var month = $id('td60AttMonth').value;
    var sr = await supabaseClient.from('students').select('studentid, name, roll').eq('class', cls).order('roll');
    var students = sr.data || [];
    var ar = await supabaseClient.from('attendance_records').select('*').eq('month_year', month).in('studentid', students.map(function(s){ return s.studentid; }));
    var map = {};
    (ar.data || []).forEach(function(a) { map[a.studentid] = a; });
    var total = parseInt($id('td60AttTotal').value) || 22;

    var h = '<div class="td60-table-wrap"><table class="td60-table">';
    h += '<thead><tr><th>#</th><th>Roll</th><th>Name</th><th style="text-align:center;">Present</th><th style="text-align:center;">%</th></tr></thead><tbody>';
    students.forEach(function(s, i) {
      var rec = map[s.studentid];
      var present = rec ? rec.present_days : 0;
      var pct = total > 0 ? Math.round(present / total * 100) : 0;
      var color = pct >= 75 ? '#059669' : pct >= 50 ? '#b45309' : '#dc2626';
      var cid = s.studentid.replace(/[^a-zA-Z0-9]/g, '');
      h += '<tr><td>' + (i + 1) + '</td>' +
        '<td style="font-weight:800;color:#0891b2;">' + esc(s.roll || '—') + '</td>' +
        '<td><strong>' + esc(s.name) + '</strong></td>' +
        '<td style="text-align:center;"><input type="number" class="td60-att-inp" data-sid="' + esc(s.studentid) + '" value="' + present + '" min="0" max="' + total + '" style="width:70px;padding:6px;border:1.5px solid rgba(100,116,139,.25);border-radius:8px;text-align:center;font-weight:700;font-family:inherit;font-size:16px;outline:none;"></td>' +
        '<td style="text-align:center;font-weight:900;color:' + color + ';" id="td60AttPct-' + cid + '">' + pct + '%</td></tr>';
    });
    h += '</tbody></table></div>';
    body.innerHTML = h;
    body.querySelectorAll('.td60-att-inp').forEach(function(inp) { inp.addEventListener('input', recalcAtt); });
  }

  function recalcAtt() {
    var total = parseInt($id('td60AttTotal').value) || 22;
    document.querySelectorAll('.td60-att-inp').forEach(function(inp) {
      var p = parseInt(inp.value) || 0;
      var pct = total > 0 ? Math.round(p / total * 100) : 0;
      var cid = inp.dataset.sid.replace(/[^a-zA-Z0-9]/g, '');
      var el = $id('td60AttPct-' + cid);
      if (el) {
        el.textContent = pct + '%';
        el.style.color = pct >= 75 ? '#059669' : pct >= 50 ? '#b45309' : '#dc2626';
      }
    });
  }

  async function saveAttendance(cls) {
    var month = $id('td60AttMonth').value;
    var total = parseInt($id('td60AttTotal').value) || 22;
    var rows = [];
    document.querySelectorAll('.td60-att-inp').forEach(function(inp) {
      var p = parseInt(inp.value) || 0;
      rows.push({ studentid: inp.dataset.sid, month_year: month, present_days: p, total_days: total, percentage: total > 0 ? Math.round(p / total * 100) : 0 });
    });
    if (!rows.length) { showToast('No data', 'error'); return; }
    var btn = $id('td60AttSave');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...'; }
    try {
      var ids = rows.map(function(r) { return r.studentid; });
      await supabaseClient.from('attendance_records').delete().eq('month_year', month).in('studentid', ids);
      await supabaseClient.from('attendance_records').insert(rows);
      showToast('✅ Saved (' + rows.length + ' students)', 'success');
      if (typeof confetti !== 'undefined') confetti({ particleCount: 60, spread: 70, origin: { y: .7 } });
    } catch(e) { showToast('❌ ' + e.message, 'error'); }
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i> Save'; }
  }

    body.innerHTML = '<div style="text-align:center;padding:20px;"><div class="td60-spinner"></div></div>';

    var mr = await supabaseClient.from('exam_marks').select('*').eq('exam_name', exam);
    var map = {};

      if (!map[m.studentid]) map[m.studentid] = {};
      map[m.studentid][m.subject] = m.obtained_marks;

    var h = '<div class="td60-table-wrap"><table class="td60-table" style="min-width:' + (200 + subjects.length * 80) + 'px;">';

      h += '<tr><td style="font-weight:800;color:#0891b2;">' + esc(s.roll || '—') + '</td><td><strong>' + esc(s.name) + '</strong></td>';

        h += '<td style="text-align:center;"><input type="number" class="td60-mark-inp" data-sid="' + esc(s.studentid) + '" data-sub="' + esc(sub) + '" value="' + esc(val) + '" min="0" max="50" style="width:60px;padding:6px;border:1.5px solid rgba(100,116,139,.25);border-radius:8px;text-align:center;font-weight:700;font-family:inherit;font-size:16px;outline:none;"></td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table></div>';
    body.innerHTML = h;
  }

  async function saveMarks(cls) {
    var exam = $id('td60MarksExam').value;
    var rows = [];
    var sids = new Set();
    document.querySelectorAll('.td60-mark-inp').forEach(function(inp) {
      var v = inp.value.trim();
      if (v === '') return;
      sids.add(inp.dataset.sid);
      rows.push({ studentid: inp.dataset.sid, exam_name: exam, subject: inp.dataset.sub, max_marks: 50, obtained_marks: parseFloat(v) || 0 });
    });
    if (!rows.length) { showToast('No marks entered', 'error'); return; }
    var btn = $id('td60MarksSave');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...'; }
    try {
      await supabaseClient.from('exam_marks').delete().eq('exam_name', exam).in('studentid', Array.from(sids));
      for (var i = 0; i < rows.length; i += 200) {
        await supabaseClient.from('exam_marks').insert(rows.slice(i, i + 200));
      }
      showToast('✅ Saved (' + rows.length + ' entries)', 'success');
      if (typeof confetti !== 'undefined') confetti({ particleCount: 60, spread: 70, origin: { y: .7 } });
    } catch(e) { showToast('❌ ' + e.message, 'error'); }
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i> Save'; }
  }

  function bindTimetableKeyboard() {
    var inputs = Array.from(document.querySelectorAll('.td60-tt-inp'));
    inputs.forEach(function(inp, idx) {
      inp.onkeydown = function(e) {
        if (e.key === 'Tab') {
          if (!e.shiftKey && idx === inputs.length - 1) { e.preventDefault(); inputs[0].focus(); }
          else if (e.shiftKey && idx === 0) { e.preventDefault(); inputs[inputs.length - 1].focus(); }
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (idx < inputs.length - 1) inputs[idx + 1].focus();
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          var nextIdx = idx + 3;
          if (nextIdx < inputs.length) inputs[nextIdx].focus();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          var prevIdx = idx - 3;
          if (prevIdx >= 0) inputs[prevIdx].focus();
        }
      };
    });
  }

  /* ═══════════════ TIMETABLE SAVE / CLEAR / COPY ═══════════════ */
  window.teacherTTSave = async function(cls) {
    if (!cls) return;
    var btn = document.getElementById('td60TTSaveBtn');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...'; }
    try {
      var rows = [];
      var seen = {};
      document.querySelectorAll('.td60-tt-inp').forEach(function(inp) {
        var v = (inp.value || '').trim();
        if (!v || v === '-') return;
        var key = inp.dataset.day + '|' + inp.dataset.period;
        if (seen[key]) return;
        seen[key] = true;
        rows.push({ class: String(cls), day: inp.dataset.day, period: parseInt(inp.dataset.period), subject: v });
      });

      await supabaseClient.from('timetable').delete().eq('class', String(cls));
      if (rows.length > 0) {
        for (var i = 0; i < rows.length; i += 100) {
          var ins = await supabaseClient.from('timetable').insert(rows.slice(i, i + 100));
          if (ins.error) throw ins.error;
        }
      }

      try {
        await supabaseClient.from('notifications').insert({
          title: '🕐 ടൈം ടേബിൾ അപ്ഡേറ്റ്',
          message: 'Class ' + cls + '-ന്റെ ടൈം ടേബിൾ അപ്ഡേറ്റ് ചെയ്തിരിക്കുന്നു!',
          type: 'important', target_type: 'class', target_class: String(cls)
        });
      } catch(e) {}

      showToast('✅ ' + rows.length + ' periods saved', 'success');
      if (typeof confetti !== 'undefined') confetti({ particleCount: 100, spread: 80, origin: { y: .7 }, colors: ['#8b5cf6','#a78bfa','#34d399'] });
      if (navigator.vibrate) try { navigator.vibrate([30, 40, 30]); } catch(e) {}

      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-check"></i> Saved'; setTimeout(function() { btn.innerHTML = '<i class="fas fa-save"></i> Save Timetable'; }, 2000); }
    } catch(e) {
      console.error('Teacher timetable save error:', e);
      showToast('❌ ' + e.message, 'error');
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i> Save Timetable'; }
    }
  };

  window.teacherTTCopyFrom = async function(targetCls) {
    var teacher = window.currentTeacher || TV60.teacher;
    var allowedClasses = (teacher && teacher.classes) ? teacher.classes.map(String) : [];
    var opts = allowedClasses.filter(function(c) { return c !== String(targetCls); });
    if (opts.length === 0) {
      for (var i = 1; i <= 10; i++) if (String(i) !== String(targetCls)) opts.push(String(i));
    }
    var fromClass = prompt('📋 ഏത് class-ൽ നിന്ന് copy ചെയ്യണം?\n\nAvailable: ' + opts.join(', ') + '\n\nClass number type ചെയ്യുക:', opts[0] || '');
    if (!fromClass) return;
    fromClass = String(fromClass).trim();
    if (!/^\d+$/.test(fromClass) || parseInt(fromClass) < 1 || parseInt(fromClass) > 10) { showToast('❌ Invalid class number', 'error'); return; }
    if (fromClass === String(targetCls)) { showToast('⚠️ Same class-ആണ്', 'error'); return; }
    if (!confirm('📋 Class ' + fromClass + ' → Class ' + targetCls + ' copy ചെയ്യണോ?')) return;

    try {
      var r = await supabaseClient.from('timetable').select('*').eq('class', fromClass);
      if (!r.data || r.data.length === 0) { showToast('❌ Class ' + fromClass + '-ൽ timetable ഇല്ല', 'error'); return; }
      var map = {};
      r.data.forEach(function(t) { map[t.day + '|' + t.period] = t.subject || ''; });
      var filled = 0;
      document.querySelectorAll('.td60-tt-inp').forEach(function(inp) {
        var key = inp.dataset.day + '|' + inp.dataset.period;
        if (map[key]) { inp.value = map[key]; filled++; }
      });
      showToast('✅ Copied ' + filled + ' cells from Class ' + fromClass + ' (unsaved)', 'success');
    } catch(e) { showToast('❌ ' + e.message, 'error'); }
  };

      var smap = {};
      students.forEach(function(s) { smap[s.studentid] = s; });

      creations.forEach(function(c) {
        var student = smap[c.studentid] || { name: 'Student', roll: '' };
        var ft = c.file_type || 'image';
        var url = c.file_url || c.image_url;
        var preview = '';

  window.toggleTeacherLike = async function(creationId) {
    var teacher = window.currentTeacher || TV60.teacher;
    if (!teacher) { showToast('❌ Teacher session missing', 'error'); return; }
    try {
      var ex = await supabaseClient.from('creation_likes').select('id').eq('creation_id', creationId).eq('studentid', teacher.teacher_id).maybeSingle();
      var c = await supabaseClient.from('student_creations').select('likes').eq('id', creationId).single();
      var currentLikes = c.data ? (c.data.likes || 0) : 0;
      var newLikes = ex.data ? Math.max(0, currentLikes - 1) : currentLikes + 1;
      if (ex.data) await supabaseClient.from('creation_likes').delete().eq('id', ex.data.id);
      else await supabaseClient.from('creation_likes').insert({ creation_id: creationId, studentid: teacher.teacher_id });
      await supabaseClient.from('student_creations').update({ likes: newLikes }).eq('id', creationId);
      showToast(ex.data ? '💔 Unliked' : '❤️ Liked', 'success');
      viewTeacherCreation(creationId);
    } catch(e) { showToast('❌ ' + e.message, 'error'); }
  };

  async function loadTeacherComments(creationId) {

      if (countEl) countEl.textContent = comments.length;
      if (comments.length === 0) { list.innerHTML = '<div style="text-align:center;padding:16px;color:#94a3b8;font-size:.78rem;font-style:italic;">ഇതുവരെ comments ഇല്ല</div>'; return; }

      var ids = Array.from(new Set(comments.map(function(c) { return c.studentid; })));
      var smap = {};
      if (ids.length) {
        var sr = await supabaseClient.from('students').select('studentid, name').in('studentid', ids);
        (sr.data || []).forEach(function(s) { smap[s.studentid] = s.name; });

      }).join('');

  async function loadChatMessages(cls) {
    var box = $id('td60ChatMsgs');
    if (!box) return;
    box.innerHTML = '<div style="text-align:center;padding:20px;color:#94a3b8;"><div class="td60-spinner"></div></div>';

  function appendChatMsg(m) {
    var box = $id('td60ChatMsgs');
    if (!box) return;
    var teacher = TV60.teacher || {};
    var isTeacher = m.sender_type === 'teacher';
    var isMine = isTeacher && m.studentid === teacher.teacher_id;
    var name = isTeacher ? (m.teacher_name || m.student_name || 'Teacher') : (m.student_name || 'Student');
    var classes = 'td60-chat-msg ' + (isMine ? 'mine' : 'other') + (isTeacher && !isMine ? ' teacher' : '');
    var t = m.created_at ? timeAgo(m.created_at) : '';
    var h = '<div class="' + classes + '"><div class="td60-chat-msg-name">' + (isTeacher ? '🎓 ' : '') + esc(name) + '</div><div class="td60-chat-msg-bubble">' + esc(m.message) + '</div><div class="td60-chat-msg-time">' + t + '</div></div>';
    if (box.querySelector('div[style*="text-align:center"]')) box.innerHTML = '';
    box.insertAdjacentHTML('beforeend', h);
    box.scrollTop = box.scrollHeight;
  }

  /* ═══════════════ RESTORE SESSION ═══════════════ */
  async function restoreTeacherSession() {
    if (!supabaseClient) return;
    if ($id('teacherDashboardV60').classList.contains('open')) return;

    var raw;
    try { raw = localStorage.getItem('noor_teacher_session'); } catch(e) { return; }

    if (!raw) {
      // No session → show fresh login form
      window.showTeacherLoginV60(null);
      return;
    }

    try {
      var sess = JSON.parse(raw);
      if (!sess || !sess.teacher_id) {
        window.showTeacherLoginV60(null);
        return;
      }

      var loginAt = new Date(sess.login_at || 0).getTime();
      if (Date.now() - loginAt > 7 * 24 * 60 * 60 * 1000) {
        localStorage.removeItem('noor_teacher_session');
        window.showTeacherLoginV60(null);
        return;
      }

      var tr = await supabaseClient.from('teachers')
        .select('*').eq('teacher_id', sess.teacher_id).eq('is_active', true).maybeSingle();

      if (!tr.data) {
        localStorage.removeItem('noor_teacher_session');
        window.showTeacherLoginV60(null);
        return;
      }

      // Session valid → show pre-filled login form (password only)
      window.showTeacherLoginV60(tr.data);

    } catch(e) {
      console.warn('Restore failed:', e);
      window.showTeacherLoginV60(null);
    }
  }

  /* ═══════════════ NOTIFICATIONS ═══════════════ */
  var _teacherNotifChannel = null;

  function subscribeTeacherNotifications(teacher) {
    if (!supabaseClient || !teacher) return;
    if (_teacherNotifChannel) { try { supabaseClient.removeChannel(_teacherNotifChannel); } catch(e) {} _teacherNotifChannel = null; }
    try {
      _teacherNotifChannel = supabaseClient.channel('teacher_notif_' + teacher.teacher_id)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications' }, function(payload) {
          var n = payload.new;
          if (!n) return;
          var tt = n.target_type || 'all';
          var teacherClasses = (teacher.classes || []).map(String);
          var applies = false;
          if (tt === 'all') applies = true;
          else if (tt === 'class' && teacherClasses.indexOf(String(n.target_class)) > -1) applies = true;
          else if (tt === 'student' && n.target_student === teacher.teacher_id) applies = true;
          else if (n.title && (n.title.indexOf('🎨') > -1 || n.title.indexOf('✨') > -1)) applies = true;
          if (applies) showTeacherNotifPopup(n.title, n.message, n.type);
        }).subscribe();
      console.log('✅ Teacher notif channel subscribed');
    } catch(e) { console.warn('Teacher notif error:', e); }
  }

  function showTeacherNotifPopup(title, message, type) {
    var popup = document.createElement('div');
    popup.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120%);background:linear-gradient(135deg,#0891b2,#22d3ee);color:#fff;padding:14px 20px;border-radius:18px;z-index:100070;max-width:92vw;width:380px;box-shadow:0 20px 50px -12px rgba(8,145,178,.85);display:flex;align-items:center;gap:12px;transition:transform .5s cubic-bezier(.34,1.56,.64,1);font-family:inherit;';
    popup.innerHTML = '<div style="width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;">🔔</div><div style="flex:1;min-width:0;"><div style="font-weight:900;font-size:.88rem;margin-bottom:3px;">' + esc(title || 'New Alert') + '</div><div style="font-size:.74rem;opacity:.9;line-height:1.4;">' + esc(message || '') + '</div></div><button onclick="this.parentNode.remove()" style="background:rgba(255,255,255,.2);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:.9rem;flex-shrink:0;">×</button>';
    document.body.appendChild(popup);
    requestAnimationFrame(function() { popup.style.transform = 'translateX(-50%) translateY(0)'; });
    if (navigator.vibrate) try { navigator.vibrate([40, 30, 40]); } catch(e) {}
    setTimeout(function() {
      if (popup.parentNode) {
        popup.style.transform = 'translateX(-50%) translateY(-120%)';
        setTimeout(function() { popup.remove(); }, 500);
      }
    }, 8000);
    popup.onclick = function() { popup.remove(); window.teacherShowNotifications(); };
  }

  window.teacherShowNotifications = function() {
    modalTitleSpan.innerText = '🔔 Notifications';
    modalBodyDiv.innerHTML = '<div style="text-align:center;padding:30px;"><div class="spinner-sm" style="margin:0 auto;"></div></div>';
    modal.style.display = 'flex';
    supabaseClient.from('notifications').select('*').order('created_at', { ascending: false }).limit(30).then(function(r) {
      var list = r.data || [];
      if (!list.length) { modalBodyDiv.innerHTML = '<div style="text-align:center;padding:40px;color:#64748b;">🔕 No notifications</div>'; return; }
      var teacher = window.currentTeacher || TV60.teacher;
      var teacherClasses = teacher ? (teacher.classes || []).map(String) : [];
      var filtered = list.filter(function(n) {
        var tt = n.target_type || 'all';
        if (tt === 'all') return true;
        if (tt === 'class' && teacherClasses.indexOf(String(n.target_class)) > -1) return true;
        return false;
      });
      if (filtered.length === 0) { modalBodyDiv.innerHTML = '<div style="text-align:center;padding:40px;color:#64748b;">🔕 No notifications</div>'; return; }
      modalBodyDiv.innerHTML = filtered.map(function(n) {
        var ico = n.type === 'urgent' ? '🚨' : n.type === 'important' ? '⚡' : '📢';
        return '<div style="background:#f8fafc;border-left:4px solid #0891b2;border-radius:12px;padding:12px 14px;margin-bottom:10px;"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:5px;"><strong style="color:#0f172a;font-size:.88rem;">' + ico + ' ' + esc(n.title) + '</strong><small style="color:#64748b;font-size:.7rem;">' + new Date(n.created_at).toLocaleDateString('en-IN') + '</small></div><div style="color:#475569;font-size:.82rem;line-height:1.5;">' + esc(n.message) + '</div></div>';
      }).join('');
    });
  };

  /* ═══════════════ TEACHER WA BOT BUTTON ═══════════════ */
  function addTeacherWaBotButton() {
    var header = document.querySelector('#teacherDashboardV60 .td60-header');
    if (!header) return;

<!-- 🔑 TEACHER SETTINGS v81 — Change Password               -->
<!-- ═══════════════════════════════════════════════════════ -->
<script>
(function(){
  'use strict';
  console.log('🔑 Teacher Settings v81 starting...');

  function createSettingsModal() {
    if (document.getElementById('tsModalV81')) return;

    var modal = document.createElement('div');
    modal.id = 'tsModalV81';
    modal.className = 'ts-modal';
    modal.innerHTML =
      '<div class="ts-card">' +
        '<div class="ts-top-bar"></div>' +
        '<div class="ts-header">' +
          '<div class="ts-title-row">' +
            '<div class="ts-icon"><i class="fas fa-cog"></i></div>' +
            '<div class="ts-title-text"><h3>Settings</h3><p>Teacher Account</p></div>' +
          '</div>' +
          '<button class="ts-close" onclick="window.closeTeacherSettings()"><i class="fas fa-times"></i></button>' +
        '</div>' +
        '<div class="ts-info"><i class="fas fa-info-circle"></i> നിങ്ങളുടെ <b>password മാറ്റാൻ</b> ഈ form ഉപയോഗിക്കുക. പുതിയ password കുറഞ്ഞത് <b>6 characters</b> ഉണ്ടാകണം.</div>' +
        '<div class="ts-error" id="tsErrorBox"></div>' +
        '<div class="ts-success" id="tsSuccessBox"></div>' +
        '<form id="tsPasswordForm" onsubmit="event.preventDefault();window.saveTeacherPassword();">' +
          '<div class="ts-field">' +
            '<label class="ts-label"><i class="fas fa-lock"></i> Current Password <span class="req">*</span></label>' +
            '<div class="ts-input-wrap">' +
              '<i class="fas fa-key pre-icon"></i>' +
              '<input type="password" id="tsOldPwd" class="ts-input" placeholder="ഇപ്പോൾ ഉള്ള password" autocomplete="current-password">' +
              '<i class="fas fa-eye ts-eye" onclick="window.tsToggleEye(\'tsOldPwd\', this)"></i>' +
            '</div>' +
          '</div>' +
          '<div class="ts-field">' +
            '<label class="ts-label"><i class="fas fa-lock-open"></i> New Password <span class="req">*</span></label>' +
            '<div class="ts-input-wrap">' +
              '<i class="fas fa-star pre-icon"></i>' +
              '<input type="password" id="tsNewPwd" class="ts-input" placeholder="പുതിയ password (6+ chars)" autocomplete="new-password" oninput="window.tsCheckStrength(this.value)">' +
              '<i class="fas fa-eye ts-eye" onclick="window.tsToggleEye(\'tsNewPwd\', this)"></i>' +
            '</div>' +
            '<div class="ts-strength">' +
              '<div class="ts-strength-bar" id="tsStr1"></div>' +
              '<div class="ts-strength-bar" id="tsStr2"></div>' +
              '<div class="ts-strength-bar" id="tsStr3"></div>' +
              '<div class="ts-strength-bar" id="tsStr4"></div>' +
            '</div>' +
            '<div class="ts-strength-text" id="tsStrText">ശക്തി: —</div>' +
          '</div>' +
          '<div class="ts-field">' +
            '<label class="ts-label"><i class="fas fa-lock-open"></i> Confirm New Password <span class="req">*</span></label>' +
            '<div class="ts-input-wrap">' +
              '<i class="fas fa-check-double pre-icon"></i>' +
              '<input type="password" id="tsConfirmPwd" class="ts-input" placeholder="വീണ്ടും type ചെയ്യുക" autocomplete="new-password">' +
              '<i class="fas fa-eye ts-eye" onclick="window.tsToggleEye(\'tsConfirmPwd\', this)"></i>' +
            '</div>' +
          '</div>' +
          '<div class="ts-actions">' +
            '<button type="button" class="ts-btn secondary" onclick="window.closeTeacherSettings()">Cancel</button>' +
            '<button type="submit" class="ts-btn primary" id="tsSaveBtn"><i class="fas fa-save"></i> Save Password</button>' +
          '</div>' +
        '</form>' +
      '</div>';

    document.body.appendChild(modal);
    modal.addEventListener('click', function(e) {
      if (e.target === modal) window.closeTeacherSettings();
    });
  }

  window.openTeacherSettings = function() {
    createSettingsModal();
    var form = document.getElementById('tsPasswordForm');
    if (form) form.reset();
    document.getElementById('tsErrorBox').classList.remove('show');
    document.getElementById('tsSuccessBox').classList.remove('show');
    window.tsCheckStrength('');
    document.getElementById('tsModalV81').classList.add('open');
    setTimeout(function() {
      var inp = document.getElementById('tsOldPwd');
      if (inp) inp.focus();
    }, 300);
    if (navigator.vibrate) try { navigator.vibrate(15); } catch(e) {}
  };

  window.closeTeacherSettings = function() {
    var m = document.getElementById('tsModalV81');
    if (m) m.classList.remove('open');
  };

  window.tsToggleEye = function(inputId, iconEl) {
    var inp = document.getElementById(inputId);
    if (!inp) return;
    if (inp.type === 'password') {
      inp.type = 'text';
      iconEl.className = 'fas fa-eye-slash ts-eye';
    } else {
      inp.type = 'password';
      iconEl.className = 'fas fa-eye ts-eye';
    }
  };

  window.tsCheckStrength = function(val) {
    var score = 0;
    if (!val) {
      ['tsStr1','tsStr2','tsStr3','tsStr4'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.className = 'ts-strength-bar';
      });
      var t = document.getElementById('tsStrText');
      if (t) t.textContent = 'ശക്തി: —';
      return;
    }
    if (val.length >= 6) score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    score = Math.min(4, score);

    var classNames = ['', 'weak', 'weak', 'medium', 'strong'];
    for (var i = 1; i <= 4; i++) {
      var bar = document.getElementById('tsStr' + i);
      if (bar) bar.className = 'ts-strength-bar' + (i <= score ? ' ' + classNames[score] : '');
    }
    var text = document.getElementById('tsStrText');
    if (text) {
      var labels = ['—', 'വളരെ ദുർബലം', 'ദുർബലം', 'നല്ലത്', 'മികച്ചത്'];
      var colors = ['#a9cdff', '#ef4444', '#f59e0b', '#f59e0b', '#22c55e'];
      text.textContent = 'ശക്തി: ' + labels[score];
      text.style.color = colors[score];
    }
  };

  window.saveTeacherPassword = async function() {
    var oldPwd = document.getElementById('tsOldPwd').value;
    var newPwd = document.getElementById('tsNewPwd').value;
    var confPwd = document.getElementById('tsConfirmPwd').value;

    var errBox = document.getElementById('tsErrorBox');
    var sucBox = document.getElementById('tsSuccessBox');
    var saveBtn = document.getElementById('tsSaveBtn');

    errBox.classList.remove('show');
    sucBox.classList.remove('show');

    if (!oldPwd || !newPwd || !confPwd) {
      errBox.textContent = '❌ എല്ലാ fields-ഉം പൂരിപ്പിക്കുക';
      errBox.classList.add('show');
      return;
    }
    if (newPwd.length < 6) {
      errBox.textContent = '❌ പുതിയ password കുറഞ്ഞത് 6 characters വേണം';
      errBox.classList.add('show');
      return;
    }
    if (newPwd !== confPwd) {
      errBox.textContent = '❌ രണ്ട് പുതിയ passwords ഒരുപോലെയല്ല';
      errBox.classList.add('show');
      return;
    }
    if (newPwd === oldPwd) {
      errBox.textContent = '❌ പുതിയ password പഴയതിൽ നിന്ന് വ്യത്യസ്തമാകണം';
      errBox.classList.add('show');
      return;
    }

    var teacher = window.currentTeacher || (window.TV60 && TV60.teacher);
    if (!teacher || !teacher.teacher_id) {
      errBox.textContent = '❌ Teacher session not found. Please re-login.';
      errBox.classList.add('show');
      return;
    }

    if (oldPwd !== teacher.password) {
      errBox.textContent = '❌ തെറ്റായ current password';
      errBox.classList.add('show');
      document.getElementById('tsOldPwd').value = '';
      document.getElementById('tsOldPwd').focus();
      if (navigator.vibrate) try { navigator.vibrate([30, 50, 30]); } catch(e) {}
      return;
    }

    saveBtn.disabled = true;
    saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

    try {
      var r = await supabaseClient.from('teachers').update({
        password: newPwd,
        must_change_password: false,
        password_changed_at: new Date().toISOString(),
        updated_at: new Date().toISOString()
      }).eq('teacher_id', teacher.teacher_id);

      if (r.error) throw r.error;

      teacher.password = newPwd;
      teacher.must_change_password = false;

      try {
        var sess = JSON.parse(localStorage.getItem('noor_teacher_session') || '{}');
        sess.password_changed = true;
        sess.password_changed_at = new Date().toISOString();
        localStorage.setItem('noor_teacher_session', JSON.stringify(sess));
      } catch(e) {}

      if (window.TV60 && window.TV60.teacher) {
        window.TV60.teacher.password = newPwd;
        window.TV60.teacher.must_change_password = false;
      }

      sucBox.textContent = '✅ Password മാറ്റി! അടുത്ത ലോഗിൻ മുതൽ പുതിയ password ഉപയോഗിക്കുക.';
      sucBox.classList.add('show');

      document.getElementById('tsOldPwd').value = '';
      document.getElementById('tsNewPwd').value = '';
      document.getElementById('tsConfirmPwd').value = '';
      window.tsCheckStrength('');

      if (typeof confetti !== 'undefined') confetti({ particleCount: 100, spread: 80, origin: { y: .5 }, colors: ['#22d3ee','#0891b2','#34d399','#fbbf24'] });
      if (navigator.vibrate) try { navigator.vibrate([30, 40, 30]); } catch(e) {}
      showToast('🔑 Password updated successfully', 'success');

      setTimeout(function() { window.closeTeacherSettings(); }, 2500);
    } catch(e) {
      console.error('saveTeacherPassword error:', e);
      errBox.textContent = '❌ ' + (e.message || 'Failed to save');
      errBox.classList.add('show');
    } finally {
      saveBtn.disabled = false;
      saveBtn.innerHTML = '<i class="fas fa-save"></i> Save Password';
    }
  };

  console.log('✅ Teacher Settings v81 ready');
})();
</script>

              '<div style="font-size:.7rem;font-weight:700;opacity:.9;margin-top:2px;">Cumulative Overview</div>' +
            '</div>' +
          '</div>' +
          '<button type="button" onclick="document.getElementById(\'td60NamazHistoryModal\').remove();document.body.style.overflow=\'\';" style="background:rgba(255,255,255,.22);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">✕</button>' +
        '</div>' +
        '<div id="td60NamazHistoryBody" style="padding:18px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;">' +
          '<div style="text-align:center;padding:40px;color:#64748b;"><div class="spinner-sm" style="margin:0 auto 12px;"></div>ഡാറ്റ ലോഡ് ചെയ്യുന്നു...</div>' +
        '</div>' +
      '</div>';

    document.body.appendChild(modal);
    document.body.style.overflow = 'hidden';
    modal.addEventListener('click', function(e) {
      if (e.target === modal) { modal.remove(); document.body.style.overflow = ''; }
    });
    if (navigator.vibrate) try { navigator.vibrate(10); } catch(e) {}

    var body = document.getElementById('td60NamazHistoryBody');

    try {
      var sr = await supabaseClient.from('students').select('studentid, name, roll').eq('class', String(cls)).order('roll');
      var students = sr.data || [];

      if (!students.length) {
        body.innerHTML = '<div style="text-align:center;padding:50px 20px;color:#64748b;"><i class="fas fa-users" style="font-size:3rem;opacity:.3;display:block;margin-bottom:14px;"></i><div style="font-weight:800;color:#0f172a;">ഈ class-ൽ students ഇല്ല</div></div>';
        return;
      }

      var ids = students.map(function(s) { return s.studentid; });
      var lr = await supabaseClient.from('namaz_log').select('*').in('studentid', ids);
      var logs = lr.data || [];

      var byStudent = {};
      logs.forEach(function(log) {
        if (!byStudent[log.studentid]) byStudent[log.studentid] = [];
        byStudent[log.studentid].push(log);
      });

      var monthPrefix = new Date().toISOString().substring(0, 7);
      var classTotals = { adaa: 0, qada: 0 };

      var studentStats = students.map(function(s) {
        var sLogs = byStudent[s.studentid] || [];
        var adaa = 0, qada = 0, mAdaa = 0, mQada = 0;
        var dateMap = {};

        sLogs.forEach(function(log) {
          var inMonth = log.prayer_date.indexOf(monthPrefix) === 0;
          var dayCount = 0;
          PRAYERS.forEach(function(p) {
            var st = log[p.key];
            if (st === 'adaa') { adaa++; dayCount++; if (inMonth) mAdaa++; }
            else if (st === 'qada') { qada++; dayCount++; if (inMonth) mQada++; }
          });
          dateMap[log.prayer_date] = dayCount;
        });

        var streak = 0;
        var cd = new Date(); cd.setHours(0, 0, 0, 0);
        for (var i = 0; i < 400; i++) {
          var ds = cd.toISOString().split('T')[0];
          if ((dateMap[ds] || 0) >= 5) { streak++; cd.setDate(cd.getDate() - 1); }
          else if (i === 0) { cd.setDate(cd.getDate() - 1); }
          else break;
        }

        classTotals.adaa += adaa;
        classTotals.qada += qada;

      html += '<div style="background:linear-gradient(140deg,#fff7ed,#fed7aa);border:1.5px solid rgba(249,115,22,.3);border-radius:14px;padding:14px;text-align:center;"><div style="font-size:1.5rem;font-weight:900;color:#ea580c;line-height:1;">' + classTotals.qada + '</div><div style="font-size:.66rem;color:#9a3412;font-weight:800;margin-top:6px;">⏰ Total ഖളാഅ്</div></div>';
      html += '<div style="background:linear-gradient(140deg,#fef3c7,#fde68a);border:1.5px solid rgba(180,83,9,.3);border-radius:14px;padding:14px;text-align:center;"><div style="font-size:1.5rem;font-weight:900;color:#b45309;line-height:1;">' + Math.round((classTotals.adaa + classTotals.qada) / students.length) + '</div><div style="font-size:.66rem;color:#78350f;font-weight:800;margin-top:6px;">📊 Avg/Student</div></div>';
      html += '</div>';

      html += '<div style="background:#ecfeff;border:1px solid rgba(8,145,178,.3);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.76rem;color:#0891b2;font-weight:700;display:flex;align-items:center;gap:8px;">' +
                '<i class="fas fa-info-circle" style="font-size:.9rem;"></i>' +
                '<span>Student row tap ചെയ്താൽ 30-day detailed view കാണാം</span>' +
              '</div>';

      html += '<div style="overflow-x:auto;border:1.5px solid rgba(100,116,139,.15);border-radius:14px;background:#fff;-webkit-overflow-scrolling:touch;">';
      html += '<table style="width:100%;border-collapse:collapse;font-size:.82rem;min-width:600px;">';
      html += '<thead><tr style="background:#f0fdf4;">' +
                '<th style="padding:11px 8px;text-align:left;color:#059669;font-size:.6rem;text-transform:uppercase;font-weight:900;letter-spacing:.5px;">#</th>' +

      studentStats.forEach(function(s, i) {

<!-- 🔒 AUTOFILL KILLER (Chrome/Safari injection prevention) -->
<!-- ═══════════════════════════════════════════════════════ -->
<script>
(function(){
  'use strict';
  console.log('🔒 Autofill Killer starting...');

  var TARGET_IDS = ['tv60Pwd', 'teacherIdInput'];

  function killAutofillStyles(el) {
    if (!el) return;
    el.style.setProperty('background-color', 'transparent', 'important');
    el.style.setProperty('background', 'transparent', 'important');
    el.style.setProperty('color', '#ffffff', 'important');
    el.style.setProperty('-webkit-text-fill-color', '#ffffff', 'important');
    el.style.setProperty('-webkit-box-shadow', 'none', 'important');
    el.style.setProperty('box-shadow', 'none', 'important');
    el.style.setProperty('filter', 'none', 'important');
  }

  function fixWrapper(el) {
    if (!el) return;
    var wrap = el.closest('.tv60-input-wrap, [style*="border-radius"]');
    if (wrap) {
      wrap.style.setProperty('background', 'rgba(5,14,43,0.92)', 'important');
      wrap.style.setProperty('background-color', 'rgba(5,14,43,0.92)', 'important');
    }
  }

  function attachToInput(el) {
    if (!el || el._v78fixed) return;
    el._v78fixed = true;

    el.addEventListener('focus', function() { killAutofillStyles(this); fixWrapper(this); }, { passive: true });
    el.addEventListener('input', function() { killAutofillStyles(this); fixWrapper(this); }, { passive: true });
    el.addEventListener('animationstart', function(e) {
      if (e.animationName && /autofill/i.test(e.animationName)) {
        killAutofillStyles(this);
        fixWrapper(this);
      }
    });

    var _timer = null;
    el.addEventListener('focus', function() {
      var self = this;
      if (_timer) clearInterval(_timer);
      _timer = setInterval(function() {
        if (document.activeElement !== self) { clearInterval(_timer); _timer = null; return; }
        killAutofillStyles(self);
        fixWrapper(self);
      }, 300);
    });

    killAutofillStyles(el);
  }

  function scanAll() {
    TARGET_IDS.forEach(function(id) {
      var el = document.getElementById(id);
      if (el) attachToInput(el);
    });
    document.querySelectorAll('.tv60-input, #tv60Pwd, #teacherIdInput, input[type="password"]').forEach(attachToInput);
  }

  function init() {
    scanAll();
    var tm = document.getElementById('teacherLoginV60');
    if (tm && !tm._v78watch) {
      tm._v78watch = true;
      new MutationObserver(function() {
        if (tm.classList.contains('open')) { setTimeout(scanAll, 100); setTimeout(scanAll, 400); }
      }).observe(tm, { attributes: true, attributeFilter: ['class'] });
    }
    var tpm = document.getElementById('teacherIdPromptModal');
    if (tpm) new MutationObserver(function() { setTimeout(scanAll, 50); }).observe(tpm, { childList: true, subtree: true });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { setTimeout(init, 500); setTimeout(init, 1500); setTimeout(init, 3000); });
  } else {
    setTimeout(init, 500); setTimeout(init, 1500); setTimeout(init, 3000);
  }
  setTimeout(init, 5000);
  window.addEventListener('focus', function() { setTimeout(scanAll, 100); setTimeout(scanAll, 600); });

  console.log('✅ Autofill Killer ready');
})();
</script>

<!-- 📚 SETTINGS LOADER — Loads classSubjectsList from Supabase -->
<!-- ═══════════════════════════════════════════════════════ -->
<script id="teacher-settings-loader">
(function(){
  'use strict';
  console.log('📚 Teacher Settings Loader starting...');

  // ═══ Replace the placeholder getSubjectsForClass ═══
  window.SETTINGS_CACHE = {};
  window.CLASS_EXAM_SUBJECTS = {};
  window.CLASS_SUBJECTS = {};
  window.SUBJECTS_LIST = ['Arabic', 'Malayalam', 'English', 'Maths', 'Science'];
  window.EXAMS_LIST = ['First Term', 'Second Term', 'Annual'];
  window.TRAITS_LIST = ['Discipline', 'Respect', 'Honesty', 'Punctuality', 'Cleanliness'];
  window.CLASS_TRAITS = {};
  window.CLASS_TEACHERS = {};
  window.SWADAR_MUALLIM_NAME = 'Swadar Muallim';

  // ─── Parse class-exam subjects from string ───
  window.parseClassExamSubjects = function(str) {
    var r = {};
    if (!str) return r;
    str.split('\n').forEach(function(l) {
      l = l.trim();
      if (!l || l.indexOf(':') < 0) return;
      var i = l.indexOf(':');
      var key = l.substring(0, i).trim();
      var subs = l.substring(i + 1).split(',').map(function(x) { return x.trim(); }).filter(Boolean);
      if (!key || subs.length === 0) return;
      var cls, exam;
      if (key.indexOf('|') > -1) {
        var parts = key.split('|');
        cls = parts[0].trim();
        exam = parts.slice(1).join('|').trim();
      } else {
        cls = key;
        exam = '__default__';
      }
      if (!r[cls]) r[cls] = {};
      r[cls][exam] = subs;
    });
    return r;
  };

  // ─── Sync legacy class subjects ───
  window.syncLegacyClassSubjects = function() {
    window.CLASS_SUBJECTS = {};
    Object.keys(window.CLASS_EXAM_SUBJECTS).forEach(function(cls) {
      if (window.CLASS_EXAM_SUBJECTS[cls]['__default__']) {
        window.CLASS_SUBJECTS[cls] = window.CLASS_EXAM_SUBJECTS[cls]['__default__'];
      }
    });
  };

  // ─── MAIN: get subjects for a class+exam ───
  window.getSubjectsForClass = function(cls, exam) {
    var cs = String(cls || '');
    var cd = window.CLASS_EXAM_SUBJECTS[cs];

    if (cd) {
      // Try exact exam match
      if (exam && cd[exam] && cd[exam].length > 0) return cd[exam].slice();
      // Try default
      if (cd['__default__'] && cd['__default__'].length > 0) return cd['__default__'].slice();
    }
    // Try legacy class subjects
    if (window.CLASS_SUBJECTS[cs] && window.CLASS_SUBJECTS[cs].length > 0) {
      return window.CLASS_SUBJECTS[cs].slice();
    }
    // Last resort: default list
    return window.SUBJECTS_LIST.slice();
  };

  // ─── Load all settings from Supabase ───
  window.loadAllTeacherSettings = async function() {
    if (typeof supabaseClient === 'undefined' || !supabaseClient) {
      console.warn('⚠️ Supabase not ready');
      return false;
    }
    try {
      console.log('📥 Fetching settings from Supabase...');
      var r = await supabaseClient.from('settings').select('*');

      if (r.error) throw r.error;

      window.SETTINGS_CACHE = {};
      (r.data || []).forEach(function(s) {
        window.SETTINGS_CACHE[s.key] = s.value;
      });

      console.log('✅ Loaded ' + Object.keys(window.SETTINGS_CACHE).length + ' settings keys');

      // ─── Exams list ───
      if (window.SETTINGS_CACHE.examsList) {
        window.EXAMS_LIST = window.SETTINGS_CACHE.examsList.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
        console.log('📝 Exams loaded:', window.EXAMS_LIST);
      }

      // ─── Subjects per class+exam ───
      if (window.SETTINGS_CACHE.classSubjectsList) {
        window.CLASS_EXAM_SUBJECTS = window.parseClassExamSubjects(window.SETTINGS_CACHE.classSubjectsList);
        window.syncLegacyClassSubjects();
        console.log('📚 Class-exam subjects loaded for classes:', Object.keys(window.CLASS_EXAM_SUBJECTS));
        // Debug: log Class 5 subjects as example
        if (window.CLASS_EXAM_SUBJECTS['5']) {
          console.log('   Example — Class 5:', window.CLASS_EXAM_SUBJECTS['5']);
        }
      } else {
        console.warn('⚠️ No classSubjectsList found in settings table');
        console.warn('   → Super Admin must save subjects from Settings → Class + Exam-wise Subjects');
      }

      // ─── Traits ───
      if (window.SETTINGS_CACHE.traitsList) {
        window.TRAITS_LIST = window.SETTINGS_CACHE.traitsList.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
      }
      if (window.SETTINGS_CACHE.classTraitsList) {
        try {
          var ct = window.SETTINGS_CACHE.classTraitsList;
          var parsed = {};
          ct.split('\n').forEach(function(l) {
            l = l.trim();
            if (!l || l.indexOf(':') < 0) return;
            var i = l.indexOf(':');
            var c = l.substring(0, i).trim();
            var s = l.substring(i + 1).split(',').map(function(x) { return x.trim(); }).filter(Boolean);
            if (c && s.length > 0) parsed[c] = s;
          });
          window.CLASS_TRAITS = parsed;
        } catch(e) {}
      }

      // ─── Class teachers ───
      if (window.SETTINGS_CACHE.classTeachers) {
        var ct2 = window.SETTINGS_CACHE.classTeachers;
        var parsed2 = {};
        ct2.split('\n').forEach(function(l) {
          l = l.trim();
          if (!l || l.indexOf(':') < 0) return;
          var i = l.indexOf(':');
          var c = l.substring(0, i).trim();
          var t = l.substring(i + 1).trim();
          if (c && t) parsed2[c] = t;
        });
        window.CLASS_TEACHERS = parsed2;
      }

      // ─── Swadar name ───
      if (window.SETTINGS_CACHE.swadarMuallimName) {
        window.SWADAR_MUALLIM_NAME = window.SETTINGS_CACHE.swadarMuallimName;
      }

      // ─── Global EXAMS_LIST (local scope in v60) ───
      // Since v60 script had `var EXAMS_LIST = [...]` in its scope,
      // update global window.EXAMS_LIST and re-assign via reference.
      if (typeof EXAMS_LIST !== 'undefined') {
        try { EXAMS_LIST = window.EXAMS_LIST; } catch(e) {}
      }

      console.log('✅ All teacher settings loaded');
      return true;
    } catch(e) {
      console.error('❌ Settings load failed:', e);
      if (typeof showToast === 'function') {
        showToast('⚠️ Settings load failed: ' + e.message, 'error');
      }
      return false;
    }
  };

  // ─── Refresh marks panel with correct subjects ───
  window.refreshMarksPanel = async function(cls) {
    if (!cls) return;
    var panel = document.getElementById('td60Panel');
    if (!panel) return;
    // Re-run marks panel
    if (typeof openPanel === 'function') {
      try { openPanel('marks', cls); } catch(e) {}
    }
  };

  // ═══ HOOK into enterTeacherDashboard — load settings first ═══
  var _origEnter = window.enterTeacherDashboard;
  if (typeof _origEnter === 'function' && !_origEnter._settingsHooked) {
    window.enterTeacherDashboard = async function(teacher) {
      // Load settings FIRST before rendering dashboard
      await window.loadAllTeacherSettings();
      var r = await _origEnter.apply(this, arguments);
      return r;
    };
    window.enterTeacherDashboard._settingsHooked = true;
    console.log('✅ enterTeacherDashboard hooked');
  } else if (typeof _origEnter !== 'function') {
    // Wait for v60 script to load first
    var waitCount = 0;
    var waitTimer = setInterval(function() {
      waitCount++;
      var fn = window.enterTeacherDashboard;
      if (typeof fn === 'function' && !fn._settingsHooked) {
        var _o = fn;
        window.enterTeacherDashboard = async function(teacher) {
          await window.loadAllTeacherSettings();
          return _o.apply(this, arguments);
        };
        window.enterTeacherDashboard._settingsHooked = true;
        console.log('✅ enterTeacherDashboard hooked (delayed)');
        clearInterval(waitTimer);
      }
      if (waitCount > 40) clearInterval(waitTimer);
    }, 250);
  }

  // ═══ Auto-load on page ready (in case session restore) ═══
  setTimeout(function() {
    if (typeof supabaseClient !== 'undefined' && supabaseClient) {
      window.loadAllTeacherSettings();
    }

<script id="tv60-id-preview">
(function(){
  'use strict';
  // Live-preview teacher info as user types ID (before submit)
  function attachPreview(){
    var inp = document.getElementById('tv60Id');
    if (!inp || inp._previewAttached) return;
    inp._previewAttached = true;

    var timer = null;
    inp.addEventListener('input', function(){
      var tid = (this.value || '').trim().toUpperCase();
      if (timer) clearTimeout(timer);
      if (!tid || !/^TR[A-Z0-9]+$/.test(tid)) return;
      timer = setTimeout(async function(){
        if (typeof supabaseClient === 'undefined' || !supabaseClient) return;
        try {
          var r = await supabaseClient.from('teachers')
            .select('name, teacher_id, classes, subject, is_active')
            .eq('teacher_id', tid).maybeSingle();
          if (!r.data) return;
          if (r.data.is_active === false) return;
          var nameEl = document.getElementById('tv60Tname');
          var metaEl = document.getElementById('tv60Tmeta');
          var greetEl = document.getElementById('tv60Greeting');
          if (nameEl) nameEl.textContent = r.data.name || 'Teacher';
          if (metaEl) {
            var cls = (r.data.classes || []).length ? 'Class ' + r.data.classes.join(', ') : 'Class —';
            metaEl.textContent = cls + ' • ' + (r.data.subject || 'General');
          }
          if (greetEl) {
            greetEl.textContent = 'അസ്സലാമു അലൈക്കും, ' + (r.data.name || 'Ustad').split(' ')[0] + ' 👋';
          }
          var av = document.getElementById('tv60Tid');
          if (av) av.textContent = r.data.teacher_id || tid;
        } catch(e){}
      }, 600);
    });
  }

  // Attach when modal opens
  function tryAttach(){
    var m = document.getElementById('teacherLoginV60');
    if (!m) return;
    if (m.classList.contains('open')) setTimeout(attachPreview, 100);
  }

  var mo = new MutationObserver(tryAttach);
  document.addEventListener('DOMContentLoaded', function(){
    var m = document.getElementById('teacherLoginV60');
    if (m) mo.observe(m, { attributes: true, attributeFilter: ['class'] });
    setTimeout(attachPreview, 1000);
  });
})();
</script>

  window.td60BulkAttendance = function(action){
    var inputs = document.querySelectorAll('.td60-att-inp');
    if (!inputs.length) { toast('⚠️ Attendance table ലോഡ് ചെയ്യൂ','error'); return; }
    var total = parseInt(($id('td60AttTotal')||{}).value) || 22;

    if (action === 'present') {
      inputs.forEach(function(inp){ inp.value = total; });
      if (typeof window.recalcAtt === 'function') try{ recalcAtt(); }catch(e){}
      // Force recalc (recalcAtt is inside IIFE, not exposed — manual)
      inputs.forEach(function(inp){
        var evt = new Event('input', { bubbles: true });
        inp.dispatchEvent(evt);
      });
      toast('✅ All marked present (' + total + ' days)','success');
    } else if (action === 'absent') {
      inputs.forEach(function(inp){ inp.value = 0; });

        var evt = new Event('input', { bubbles: true });
        inp.dispatchEvent(evt);
      });

  async function td60CopyAttendanceFrom(monthYear, inputs){
    try {
      var cls = window.TV60 && TV60.activeClass;
      var sidList = Array.from(inputs).map(function(inp){ return inp.dataset.sid; });
      var ar = await supabaseClient.from('attendance_records').select('*').eq('month_year', monthYear).in('studentid', sidList);
      var map = {};
      (ar.data||[]).forEach(function(a){ map[a.studentid] = a; });
      var copied = 0;
      inputs.forEach(function(inp){
        var rec = map[inp.dataset.sid];
        if (rec) { inp.value = rec.present_days || 0; copied++; }
      });
      inputs.forEach(function(inp){
        var evt = new Event('input', { bubbles: true });
        inp.dispatchEvent(evt);
      });
      if (copied > 0) toast('✅ Copied from ' + monthYear + ' (' + copied + ' students)','success');
      else toast('⚠️ Previous month-ൽ data ഇല്ല','info');
    } catch(e){ toast('❌ '+e.message,'error'); }
  }

<!-- ═══════════════════════════════════════════════════════ -->
<script id="teacher-live-sync">
(function(){
  'use strict';
  console.log('🔄 Teacher Live Sync starting...');

  var _syncChannel = null;
  var _syncDebounce = null;
  var SYNCED_TABLES = ['exam_marks','attendance_records','timetable','homework','notice_board','namaz_log','students','student_creations'];
  var SAFE_TABS = ['students','analytics','timetable','homework','notice','namaz','creations'];

  function attachSync() {
    var teacher = window.currentTeacher || (window.TV60 && TV60.teacher);
    if (!teacher || !teacher.teacher_id) return;
    if (typeof supabaseClient === 'undefined' || !supabaseClient) return;
    if (_syncChannel) { try { supabaseClient.removeChannel(_syncChannel); } catch(e){} _syncChannel = null; }

    try {
      _syncChannel = supabaseClient.channel('teacher_sync_' + teacher.teacher_id);
      SYNCED_TABLES.forEach(function(tbl) {
        _syncChannel = _syncChannel.on('postgres_changes',
          { event: '*', schema: 'public', table: tbl },
          function(payload) { handleChange(tbl, payload); });
      });
      _syncChannel.subscribe();
      console.log('✅ Live sync attached for', teacher.teacher_id);
    } catch(e) { console.warn('Live sync error:', e); }
  }

  function handleChange(table, payload) {
    if (!window.TV60 || !TV60.activeClass || !TV60.activeTab) return;
    var active = document.activeElement;
    if (active && active.closest && active.closest('#td60Panel')) {
      if (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT') return;
    }
    if (SAFE_TABS.indexOf(TV60.activeTab) === -1) {
      if (TV60.activeTab === 'marks' || TV60.activeTab === 'attendance') {
        if (typeof showToast === 'function') showToast('🔄 Data changed externally — refresh to see', 'info');
      }
      return;
    }
    if (_syncDebounce) clearTimeout(_syncDebounce);
    _syncDebounce = setTimeout(function() {
      _syncDebounce = null;
      if (!TV60.activeTab || !TV60.activeClass) return;
      console.log('🔄 Live refresh:', table, '→ tab:', TV60.activeTab);
      document.querySelectorAll('.td60-tab').forEach(function(t) {
        if (t.dataset.tab === TV60.activeTab) t.click();
      });
    }, 2000);
  }

  var _lastTid = null;
  setInterval(function() {
    var teacher = window.currentTeacher || (window.TV60 && TV60.teacher);
    var tid = teacher ? teacher.teacher_id : null;
    if (tid && tid !== _lastTid) { _lastTid = tid; setTimeout(attachSync, 1000); }
    if (!tid && _lastTid) {
      _lastTid = null;
      if (_syncChannel) { try { supabaseClient.removeChannel(_syncChannel); } catch(e){} _syncChannel = null; }
    }
  }, 2000);

  window.addEventListener('beforeunload', function() {
    if (_syncChannel) { try { supabaseClient.removeChannel(_syncChannel); } catch(e){} }
  });

  console.log('✅ Teacher Live Sync ready');
})();
</script>

<script id="admin-live-sync">
(function(){
  'use strict';
  var _adminChannel = null;
  var _adminDebounce = null;
  var TABLES = ['exam_marks','attendance_records','timetable','homework','notice_board','namaz_log','students'];

  function attachAdminSync() {
    if (typeof supabaseClient === 'undefined' || !supabaseClient) return;
    if (_adminChannel) { try { supabaseClient.removeChannel(_adminChannel); } catch(e){} }
    _adminChannel = supabaseClient.channel('admin_sync')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'notifications' }, function(p) {
        if (typeof showToast === 'function' && p.new) showToast('🔔 ' + (p.new.title || 'New notification'), 'info');
      });
    TABLES.forEach(function(tbl) {
      _adminChannel = _adminChannel.on('postgres_changes',
        { event: '*', schema: 'public', table: tbl },
        function() {
          if (_adminDebounce) clearTimeout(_adminDebounce);
          _adminDebounce = setTimeout(function() {
            if (typeof window.renderAdminPanel === 'function') window.renderAdminPanel();
            else if (typeof window.loadAdminDashboard === 'function') window.loadAdminDashboard();
          }, 2000);
        });
    });
    _adminChannel.subscribe();
    console.log('✅ Admin live sync attached');
  }

  setTimeout(attachAdminSync, 2500);
})();
</script>
