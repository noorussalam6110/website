<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOORUSSALAM MADRASA - Login</title>
    <!-- Font Awesome Icons (for icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Elegant Dark Gradient Background */
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Subtle decorative background circles */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 184, 148, 0.1) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            border-radius: 50%;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(253, 203, 110, 0.08) 0%, transparent 70%);
            bottom: -200px;
            left: -200px;
            border-radius: 50%;
            z-index: 0;
        }

        /* Glassmorphism Main Card */
        .login-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 50px 40px;
            max-width: 600px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s ease-out;
        }

        /* Logo / Header */
        .logo-icon {
            font-size: 48px;
            color: #fdcb6e;
            margin-bottom: 10px;
            display: inline-block;
            background: rgba(253, 203, 110, 0.15);
            padding: 15px;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            line-height: 50px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        h1 span {
            color: #fdcb6e;
        }

        .sub-title {
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 35px;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
        }

        .sub-title i {
            color: #00b894;
            margin: 0 5px;
        }

        /* Button Group */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        /* Common Button Styles */
        .btn {
            width: 100%;
            padding: 18px 30px;
            border: none;
            border-radius: 60px;
            font-size: 20px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            letter-spacing: 1px;
        }

        /* Button Icons */
        .btn i {
            font-size: 24px;
            transition: transform 0.3s ease;
        }

        /* ---- STUDENT BUTTON (Green Gradient) ---- */
        .btn-student {
            background: linear-gradient(135deg, #00b894, #00cec9);
            box-shadow: 0 8px 25px rgba(0, 206, 201, 0.3);
        }

        .btn-student::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
            transform: scale(0);
            transition: transform 0.5s ease;
        }

        /* ---- PARENTS BUTTON (Gold/Amber Gradient) ---- */
        .btn-parents {
            background: linear-gradient(135deg, #fdcb6e, #f39c12);
            box-shadow: 0 8px 25px rgba(253, 203, 110, 0.3);
            color: #2d3436; /* Dark text for contrast on gold */
        }

        .btn-parents::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.25) 0%, transparent 60%);
            transform: scale(0);
            transition: transform 0.5s ease;
        }

        /* ---- Hover Effects ---- */
        .btn:hover {
            transform: translateY(-8px) scale(1.02);
        }

        .btn:hover i {
            transform: rotate(-5deg) scale(1.1);
        }

        .btn:hover::after {
            transform: scale(1);
        }

        .btn-student:hover {
            box-shadow: 0 15px 35px rgba(0, 206, 201, 0.5);
            background: linear-gradient(135deg, #00a381, #00b894);
        }

        .btn-parents:hover {
            box-shadow: 0 15px 35px rgba(253, 203, 110, 0.5);
            background: linear-gradient(135deg, #e1b12c, #d35400);
            color: #ffffff;
        }

        /* ---- Active/Click Effect ---- */
        .btn:active {
            transform: translateY(-2px) scale(0.98);
        }

        /* Small text under buttons */
        .footer-text {
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            letter-spacing: 1px;
        }

        .footer-text a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-text a:hover {
            color: #fdcb6e;
        }

        /* Animation Keyframes */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---- Responsive Design (Mobile Friendly) ---- */
        @media (min-width: 500px) {
            .button-group {
                flex-direction: row;
                justify-content: center;
            }
            .btn {
                width: auto;
                min-width: 210px;
                padding: 18px 35px;
            }
        }

        @media (max-width: 499px) {
            .login-container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 22px;
            }
            .btn {
                font-size: 17px;
                padding: 15px 20px;
            }
            .btn i {
                font-size: 20px;
            }
            .logo-icon {
                width: 60px;
                height: 60px;
                font-size: 30px;
                line-height: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Decorative Icon -->
        <div class="logo-icon">
            <i class="fas fa-mosque"></i>
        </div>
        
        <!-- Title -->
        <h1>NOORUSSALAM <span>MADRASA</span></h1>
        <p class="sub-title">
            <i class="fas fa-graduation-cap"></i> 
            പ്രവേശനം / Login 
            <i class="fas fa-user-friends"></i>
        </p>

        <!-- BUTTONS SECTION -->
        <div class="button-group">
            <!-- Student Login Button -->
            <a href="students.html" class="btn btn-student">
                <i class="fas fa-user-graduate"></i> 
                Student Login
            </a>

            <!-- Parents Login Button -->
            <a href="parents.html" class="btn btn-parents">
                <i class="fas fa-users"></i> 
                Parents Login
            </a>
        </div>

        <div class="footer-text">
            <i class="fas fa-lock" style="margin-right: 5px;"></i> 
            ©️ • NOORUSSALAM MADRASA
        </div>
    </div>

</body>
</html>
