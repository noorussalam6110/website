<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>വരിസംഖ്യ വിവരങ്ങൾ | അറിയിപ്പ്</title>

<!-- മലയാളം ഫോണ്ടുകൾ Google Fonts-ൽ നിന്ന് -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@300;400;500;600;700;800&family=Manjari:wght@400;700&family=Baloo+Chettan+2:wght@500;600;700;800&family=Noto+Sans+Malayalam:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --primary: #6C5CE7;
    --primary-dark: #4834d4;
    --accent: #00cec9;
    --pink: #fd79a8;
    --orange: #fdcb6e;
    --dark: #1e272e;
    --gray: #636e72;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f0c29;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    padding: 20px;
    font-family: 'Anek Malayalam', 'Noto Sans Malayalam', sans-serif;
    position: relative;
    overflow-x: hidden;
  }

  /* ഫ്ലോട്ടിംഗ് ബബിൾസ് */
  .bubble {
    position: fixed;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), rgba(108,92,231,0.15));
    animation: float 15s infinite ease-in-out;
    pointer-events: none;
    z-index: 0;
  }
  .bubble:nth-child(1) { width: 120px; height: 120px; top: 10%; left: 8%; animation-delay: 0s; }
  .bubble:nth-child(2) { width: 80px;  height: 80px;  top: 70%; left: 5%;  animation-delay: 2s; }
  .bubble:nth-child(3) { width: 150px; height: 150px; top: 15%; right: 6%; animation-delay: 4s; }
  .bubble:nth-child(4) { width: 60px;  height: 60px;  bottom: 15%; right: 12%; animation-delay: 1s; }
  .bubble:nth-child(5) { width: 100px; height: 100px; top: 50%; right: 3%; animation-delay: 3s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
    50%      { transform: translateY(-40px) rotate(180deg); opacity: 1; }
  }

  /* പ്രധാന കാർഡ് */
  .notice-card {
    position: relative;
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(20px);
    border-radius: 32px;
    padding: 55px 45px 45px;
    max-width: 580px;
    width: 100%;
    text-align: center;
    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.5),
      0 0 0 1px rgba(255, 255, 255, 0.1),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
    z-index: 10;
    animation: cardEntry 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden;
  }

  @keyframes cardEntry {
    from { opacity: 0; transform: translateY(60px) scale(0.9); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ഗ്ലോയിംഗ് ബോർഡർ */
  .notice-card::before {
    content: '';
    position: absolute;
    top: -2px; left: -2px; right: -2px; bottom: -2px;
    background: linear-gradient(45deg, #6C5CE7, #00cec9, #fd79a8, #fdcb6e, #6C5CE7);
    background-size: 400% 400%;
    border-radius: 34px;
    z-index: -1;
    animation: glowBorder 6s ease infinite;
    filter: blur(8px);
    opacity: 0.8;
  }

  @keyframes glowBorder {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* മുകളിലെ കളർ റിബൺ */
  .ribbon {
    position: absolute;
    top: 22px;
    left: -38px;
    background: linear-gradient(135deg, #fd79a8, #e84393);
    color: white;
    padding: 6px 50px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    transform: rotate(-45deg);
    box-shadow: 0 4px 12px rgba(232, 67, 147, 0.4);
    font-family: 'Anek Malayalam', sans-serif;
  }

  /* ഐക്കൺ */
  .icon-wrap {
    width: 110px;
    height: 110px;
    margin: 0 auto 24px;
    border-radius: 30px;
    background: linear-gradient(135deg, #6C5CE7 0%, #a29bfe 50%, #00cec9 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    position: relative;
    box-shadow:
      0 20px 40px rgba(108, 92, 231, 0.5),
      inset 0 -5px 15px rgba(0, 0, 0, 0.1),
      inset 0 5px 15px rgba(255, 255, 255, 0.3);
    animation: iconFloat 3s ease-in-out infinite;
    transform: rotate(-5deg);
  }

  @keyframes iconFloat {
    0%, 100% { transform: rotate(-5deg) translateY(0); }
    50%      { transform: rotate(5deg) translateY(-10px); }
  }

  .icon-wrap::after {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 38px;
    background: linear-gradient(135deg, #6C5CE7, #00cec9);
    z-index: -1;
    opacity: 0.3;
    filter: blur(15px);
    animation: pulseGlow 2s ease-in-out infinite;
  }

  @keyframes pulseGlow {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50%      { opacity: 0.6; transform: scale(1.15); }
  }

  /* ശീർഷകം */
  .title {
    font-family: 'Baloo Chettan 2', 'Anek Malayalam', sans-serif;
    font-size: 30px;
    font-weight: 800;
    color: var(--dark);
    line-height: 1.4;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }

  .title .gradient-text {
    background: linear-gradient(135deg, #6C5CE7, #00cec9, #fd79a8);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientMove 4s ease infinite;
    display: inline-block;
  }

  @keyframes gradientMove {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* ഡിവൈഡർ */
  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 18px 0 22px;
  }

  .divider-line {
    height: 2px;
    width: 60px;
    background: linear-gradient(90deg, transparent, #6C5CE7);
    border-radius: 2px;
  }
  .divider-line.right {
    background: linear-gradient(90deg, #6C5CE7, transparent);
  }

  .divider-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #6C5CE7;
    box-shadow: 0 0 12px #6C5CE7;
    animation: dotPulse 1.5s ease infinite;
  }

  @keyframes dotPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.4); }
  }

  /* വിവരണം */
  .description {
    font-family: 'Manjari', 'Anek Malayalam', sans-serif;
    font-size: 18px;
    font-weight: 400;
    color: var(--gray);
    line-height: 2;
    margin-bottom: 26px;
  }

  .description strong {
    font-family: 'Baloo Chettan 2', 'Anek Malayalam', sans-serif;
    color: #fff;
    background: linear-gradient(135deg, #6C5CE7, #a29bfe);
    padding: 4px 14px;
    border-radius: 8px;
    font-weight: 700;
    display: inline-block;
    box-shadow: 0 4px 12px rgba(108, 92, 231, 0.35);
    transition: all 0.3s ease;
  }

  .description strong:hover {
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 8px 20px rgba(108, 92, 231, 0.5);
  }

  /* ഹൈലൈറ്റ് ബോക്സ് */
  .highlight-box {
    background: linear-gradient(135deg, #f8f9ff 0%, #eef1ff 100%);
    border-radius: 18px;
    padding: 20px 22px;
    margin-bottom: 32px;
    text-align: left;
    display: flex;
    align-items: flex-start;
    gap: 15px;
    border: 2px dashed rgba(108, 92, 231, 0.25);
    position: relative;
    transition: all 0.4s ease;
  }

  .highlight-box:hover {
    border-color: rgba(108, 92, 231, 0.5);
    transform: translateY(-3px);
    box-shadow: 0 15px 30px rgba(108, 92, 231, 0.15);
  }

  .highlight-box .emoji {
    font-size: 28px;
    flex-shrink: 0;
    animation: emojiBounce 2s ease infinite;
  }

  @keyframes emojiBounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25%      { transform: translateY(-5px) rotate(-8deg); }
    75%      { transform: translateY(-5px) rotate(8deg); }
  }

  .highlight-box .text {
    font-family: 'Manjari', 'Anek Malayalam', sans-serif;
    font-size: 15px;
    color: #4a4a4a;
    line-height: 1.9;
    font-weight: 400;
  }

  .highlight-box .text b {
    font-family: 'Baloo Chettan 2', sans-serif;
    color: var(--primary);
    font-weight: 700;
  }

  /* ബട്ടൺ */
  .btn-login {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: linear-gradient(135deg, #6C5CE7 0%, #4834d4 50%, #00cec9 100%);
    background-size: 200% 200%;
    color: #ffffff;
    text-decoration: none;
    padding: 18px 50px;
    border-radius: 60px;
    font-family: 'Baloo Chettan 2', 'Anek Malayalam', sans-serif;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.5px;
    box-shadow:
      0 15px 35px rgba(108, 92, 231, 0.5),
      inset 0 2px 0 rgba(255, 255, 255, 0.25),
      inset 0 -3px 0 rgba(0, 0, 0, 0.15);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: none;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    animation: gradientShift 3s ease infinite;
  }

  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  .btn-login::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    transform: translate(-50%, -50%);
    transition: width 0.6s ease, height 0.6s ease;
  }

  .btn-login:hover::before {
    width: 400px;
    height: 400px;
  }

  .btn-login:hover {
    transform: translateY(-4px) scale(1.03);
    box-shadow:
      0 22px 45px rgba(108, 92, 231, 0.7),
      inset 0 2px 0 rgba(255, 255, 255, 0.3),
      inset 0 -3px 0 rgba(0, 0, 0, 0.15);
  }

  .btn-login:active {
    transform: translateY(-1px) scale(0.99);
  }

  .btn-login .icon {
    font-size: 22px;
    transition: transform 0.3s ease;
  }

  .btn-login:hover .icon {
    transform: rotate(-15deg) scale(1.15);
  }

  .btn-login .arrow {
    transition: transform 0.3s ease;
    font-size: 22px;
  }

  .btn-login:hover .arrow {
    transform: translateX(6px);
  }

  /* ഫൂട്ടർ ടെക്സ്റ്റ് */
  .footer-text {
    margin-top: 22px;
    font-family: 'Manjari', sans-serif;
    font-size: 13px;
    color: #b2bec3;
    letter-spacing: 0.5px;
  }

  .footer-text span {
    display: inline-block;
    animation: heartBeat 1.5s ease infinite;
  }

  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.2); }
  }

  /* മൊബൈൽ റെസ്പോൺസീവ് */
  @media (max-width: 500px) {
    .notice-card { padding: 45px 25px 35px; border-radius: 26px; }
    .title      { font-size: 22px; }
    .description { font-size: 16px; }
    .btn-login  { padding: 16px 36px; font-size: 17px; }
    .icon-wrap  { width: 90px; height: 90px; font-size: 42px; }
    .ribbon     { font-size: 10px; padding: 5px 40px; left: -32px; }
    .highlight-box { padding: 16px 18px; }
    .highlight-box .text { font-size: 14px; }
  }
</style>
</head>
<body>

  <!-- ഫ്ലോട്ടിംഗ് ബബിൾസ് -->
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>

  <div class="notice-card">
    <div class="ribbon">അറിയിപ്പ്</div>

    <div class="icon-wrap">💰</div>

    <h1 class="title">
      <span class="gradient-text">വരിസംഖ്യ വിവരങ്ങൾ</span>
    </h1>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-dot"></div>
      <div class="divider-line right"></div>
    </div>

    <p class="description">
      നിങ്ങളുടെ വരിസംഖ്യ വിവരങ്ങൾ കാണാൻ
      <strong>Student Login</strong> ചെയ്തതിനുശേഷം
      <strong>ഫീസ്</strong> എന്ന ഭാഗം സന്ദർശിക്കുക.
    </p>

    <div class="highlight-box">
      <span class="emoji">📌</span>
      <span class="text">
        <b>ഫീസ് വിഭാഗത്തിൽ</b> നിങ്ങളുടെ എല്ലാ വരിസംഖ്യ വിവരങ്ങളും
        അവസാന തീയതിയും ലഭ്യമാണ്.
      </span>
    </div>

    <a href="login.html" class="btn-login">
      <span class="icon">🔐</span>
      ലോഗിൻ ചെയ്യുക
      <span class="arrow">→</span>
    </a>

    <p class="footer-text">
      SUHAIL KERALA <span>©</span> NOORUSSALAM
    </p>
  </div>

</body>
</html>
